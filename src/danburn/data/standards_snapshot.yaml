# - admrules·laws: 법제처(law.go.kr) 공식 목록·본문으로 확인. mirror_path 는 github.com/legalize-kr/legalize-kr (main) 기준 경로.
# - codes(KDS·KCS·LHCS): 국가건설기준센터(KCSC) 코드 목록의 현행판(최종 제·개정). 국토부 고시 개정전문의 판 표기와 표본 대조함.
#   환경부 소관(KDS/KCS 57 상수도, KCS 61 하수관로)은 KCSC 가 갱신을 멈춰 기후에너지환경부 고시 개정전문의 판을 넣었다.
#   current 는 연도판(예 "KCS 14 20 10 : 2024" 의 2024). status: withdrawn 이면 replaced_by 에 이어받은 코드.
#   "(구 번호)" 항목: 번호가 바뀐 옛 코드. KCSC 현행 목록에 같은 번호가 다른 이름으로 다시 쓰인 경우(예 KCS 31 60 10)는 넣지 않았다.
