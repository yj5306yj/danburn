# 출처: 「건설공사 품질관리 업무지침」 별표2 1. 공통 > 가. 토공사 및 기초공사 > 성토용 흙 (PDF p.1)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
# 도로 노체·노상·동상방지층·보조기층(2. 토목 가. 도로공사)과 흙댐·제방 성토(2. 토목 나.)는 별도 종별 → match.exclude.
# KS 처리: 재료(흙) 시험이지만 KS 제품이 아님 → ks_mark false, 시험마다 행(외부 의뢰가 흔하나 원문은 장소를 정하지 않음).
material: fill_soil
label: 성토용흙
work: 토공사
basis_version: "국토교통부고시 제2026-360호(2026-07-08 시행) 「건설공사 품질관리 업무지침」 별표2"
index_keys: [fill_soil]
match:
  names: [성토, 흙쌓기, 성토용흙, 순성토, 유용토]
  units: [m3]
  exclude: [노상, 노체, 보조기층, 동상방지, 축제, 제방, 흙댐, 용수로, 배수로, 운반, 상차, 사토]
ks_mark: false
order: 31
tests:
  - {test_type: 함수비, method: "KS F 2306", where: 현장, frequency: &f {per_qty: null, unit: null, text: "토취장마다, 재질변화시마다", minimum: 1},
     basis: "별표2 1. 가. 성토용 흙 함수비 (PDF p.1)", conditions: &c "토취장마다·재질변화시마다(함수비~다짐 7종목이 한 빈도 칸). 토취장 수를 모르면 1회."}
  - {test_type: 입도, method: "KS F 2302", where: 현장, frequency: *f, basis: "별표2 1. 가. 성토용 흙 입도 (PDF p.1)", conditions: *c}
  - {test_type: 세립토 비율, method: "KS F 2309", where: 현장, frequency: *f, basis: "별표2 1. 가. 성토용 흙 세립토 비율 (PDF p.1)", conditions: *c}
  - {test_type: 밀도, method: "KS F 2308", where: 현장, frequency: *f, basis: "별표2 1. 가. 성토용 흙 밀도 (PDF p.1)", conditions: *c}
  - {test_type: 액성한계·소성한계, method: "KS F 2303", where: 현장, frequency: *f, basis: "별표2 1. 가. 성토용 흙 액성한계·소성한계 (PDF p.1)", conditions: *c}
  - {test_type: 노상토지지력비(CBR), method: "KS F 2320", where: 현장, frequency: *f, basis: "별표2 1. 가. 성토용 흙 노상토지지력비(CBR) (PDF p.1)", conditions: *c}
  - {test_type: 다짐, method: "KS F 2312", where: 현장, frequency: *f, basis: "별표2 1. 가. 성토용 흙 다짐 (PDF p.1)", conditions: *c}
  - {test_type: 유기물 함량, method: "KS F 2104", where: 현장, optional: true, frequency: {per_qty: null, unit: null, text: "필요시", minimum: 1},
     basis: "별표2 1. 가. 성토용 흙 유기물 함량 (PDF p.1)", conditions: "필요시."}
  - {test_type: 토질조사, method: "보링 등", where: 외부, optional: true, frequency: {per_qty: null, unit: null, text: "필요시", minimum: 1},
     basis: "별표2 1. 가. 성토용 흙 토질조사 (PDF p.1)", conditions: "필요시."}
  - {test_type: 투수, method: "KS F 2322", where: 현장, optional: true, frequency: *f,
     basis: "별표2 1. 가. 성토용 흙 투수 (PDF p.1)", conditions: &dam "비고: 흙댐·용수로·배수로용 일반성토 및 표토, 공종에 따라 적용. 일반 성토에는 기본 산출에서 뺀다. 빈도 토취장마다·재질변화시마다."}
  - {test_type: 직접전단, method: "KS F 2343", where: 현장, optional: true, frequency: *f,
     basis: "별표2 1. 가. 성토용 흙 직접전단 (PDF p.1)", conditions: *dam}
  - {test_type: 3축압축, method: "KS F 2346", where: 외부, optional: true, frequency: *f,
     basis: "별표2 1. 가. 성토용 흙 3축압축 (PDF p.1)", conditions: *dam}
