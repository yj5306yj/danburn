# 출처: 「건설공사 품질관리 업무지침」 별표2 건설공사 품질시험기준(제8조제1항 관련)
#       3. 건축 > 사. 도장공사 > 래커도료(KS M 6040) (PDF p.48~49)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다. (L7-R5, 원문 표를 렌더해 칸 경계 확인)
# KS 처리: 종별 괄호 안 KS 규격 제품은 별표2 끝 ※주석(PDF p.52)에 따라 시행령 제91조제1항 시험 제외 → ◎.
# 원문은 1·2·3종(래커 프라이머·퍼티·서페이서), 4·5종(목재용 우드실러·샌딩실러), 6·7종(마감용 투명래커·상도마감용 래커 에나멜) 3묶음별 종목(p.48).
# 6·7종 마지막 행 '용기내 상태'는 다음 쪽 첫 행(p.49, 바니시 칸 위)으로 이어진다.
# 기본 행은 3묶음 공통 3종목(고화 건조 시간·비휘발분·용기내 상태). 묶음별 종목은 optional + conditions.
# 이름: '락카'만 쓰지 않는다 — 내역서에서 '락카'는 사물함(탈의실 락카)으로도 쓰인다. 단위도 도료 단위로 제한.
