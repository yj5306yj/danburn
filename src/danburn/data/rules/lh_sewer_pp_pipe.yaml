# 출처: LHCS 10 40 00:2020 「시험」(2020-12-09 제정, 한국토지주택공사) 부록 「품질시험 및 검사기준」 Ⅰ. 공통 및 토목분야 1. 공통 마. 기타
#       국가건설기준센터(KCSC) 공개본. 공공데이터포털 「한국토지주택공사_전문시방서_20201209」 이용허락범위 제한 없음.
# 발주처(LH) 전용 규칙 — `--owner LH` 일 때만 켜진다. 별표2에는 하수용 폴리프로필렌(PP)관 종별이 없다.
# 원문 문장·표를 옮기지 않고 종별·시험종목·시험방법 번호·빈도 사실만 적는다.
# 시험방법 번호는 원문 표기(KS M 3700-1 이중벽관, -2 다중벽관, -3 코러게이트관, -4 심레스관) 그대로다.
#   해석 필요: 별표2의 KS M 3700 은 초산비닐수지 에멀션 목재 접착제라 번호가 겹친다 — 제품 KS 번호를 확인한다.
# 설비 배수용 PPF 관(기계)은 하수용 PP관이 아니므로 뺀다.
# 단위: 빈도가 '300개마다(6M기준)' — 관 1개 = 6m 로 보고 m 를 개로 환산한다.
material: lh_sewer_pp_pipe
label: 하수용 PP관
work: 배수공사
owner: LH
basis_version: LHCS 10 40 00:2020(2020-12-09) 부록 「품질시험 및 검사기준」
match:
  names: [하수용폴리프로필렌관, 하수용PP관, 폴리프로필렌이중벽관, PP이중벽관, PP다중벽관, PP코러게이트관, PP심레스관]
  units: [m, 본, 개, ea]
  exclude: [PPF, 보호콘크리트, 천공, 준설, 절단, 하차, 운반, 인건, 노무, 할증, 철거]
unit_factors:
  m: [ea, 0.16666666666666666]      # 6m = 1개(원문 '6M기준')
  본: [ea, 1]
  개: [ea, 1]
ks_mark: false
ks_count: makers
order: 71
spec_group:
  pattern: "D\\s*[-=]?\\s*(\\d{3,4})"
  label: "D{1}"
  other: "규격 미기재"   # L14-C7: 패턴에 안 걸린 행 — 뜻이 보이게
group_tests: true
group:
  frequency: 제조회사별, 제품규격별 300개마다(6m 기준)
  basis: LHCS 10 40 00:2020 부록 「품질시험 및 검사기준」 Ⅰ.1 공통 마. 기타 하수용 폴리프로필렌(PP)관(원문 KS M 3700-1~4)
tests:
- test_type: 원강성
  method: KS M 3700-1~4(원문 표기)
  where: 외부
  frequency: &f {per_qty: 300, unit: ea, text: 제조회사별, 제품규격별 300개마다(6m 기준), minimum: 1}
  basis: LHCS 10 40 00:2020 부록 「품질시험 및 검사기준」 Ⅰ.1 공통 마. 기타 하수용 폴리프로필렌(PP)관 원강성
  conditions: &c 제조회사별·제품규격별 300개(관 6m 기준)마다. 비고 — 소량(10개 미만) 사용 규격은 KS 제품이면 KS 인증업체가 공인기관에 의뢰한 시험성적서 확인으로 갈음할 수 있고, 그 밖의 시험항목은 KS 인증업체 공인기관 성적서 확인으로 갈음.
- {test_type: 원연성, method: KS M 3700-1~4(원문 표기), where: 외부, frequency: *f, basis: LHCS 10 40 00:2020 부록 「품질시험 및 검사기준」 Ⅰ.1 공통 마. 기타 하수용 폴리프로필렌(PP)관 원연성, conditions: *c}
