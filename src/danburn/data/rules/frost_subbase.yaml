# 출처: 「건설공사 품질관리 업무지침」 별표2 2. 토목 > 가. 도로공사 > (1) 흙 및 혼합골재 > 동상방지층 및 보조기층 (PDF p.23)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
# 물량 빈도(500㎥·1,000㎥마다)는 원문 그대로 ㎥ 기준. 연장 기준(층별 200m, 100m)은 내역서로 알 수 없어 해석 필요로 표시.
# 보조기층은 내역서에 ㎡(포설 면적)로 나오기도 한다 — 이 규칙은 ㎥ 행만 잡는다(보고서 참조).
# KS 처리: 공종·골재원 시험 → ks_mark false, 시험마다 행.
material: frost_subbase
label: 동상방지층·보조기층
work: 포장공사
basis_version: "국토교통부고시 제2026-360호(2026-07-08 시행) 「건설공사 품질관리 업무지침」 별표2"
index_keys: [frost_subbase]
match:
  names: [동상방지층, 보조기층, 혼합골재]
  units: [m3]
  exclude: [운반, 상하차, 상차비, 다짐]   # '상차'는 재료 행 '혼합골재(채취상차도…)'까지 막았다. '다짐'은 같은 골재의 시공 행(L4-T4)
ks_mark: false
order: 34
spec_group:                              # 인력시공·소규모 장비·T-75CM은 시공 방법(L14-C3). 기층용 골재만 따로(승인본은 '보조기층 및 동상방지층' 한 줄)
  pattern: "(?<!보조)(기층)"
  label: 기층용
  other: 보조기층·동상방지층
tests:
  - {test_type: 골재의 0.08mm체 통과량, method: "KS F 2511", where: 현장, frequency: &src {per_qty: null, unit: null, text: "골재원마다, 재질변화시마다", minimum: 1},
     basis: "별표2 2. 가. (1) 동상방지층 및 보조기층 골재의 0.08밀리미터체 통과량 (PDF p.23)", conditions: &c "골재원마다·재질변화시마다. 골재원 수를 모르면 1회."}
  - {test_type: 골재의 밀도 및 흡수율, method: "KS F 2503", where: 현장, frequency: *src, basis: "별표2 2. 가. (1) 동상방지층 및 보조기층 골재의 밀도 및 흡수율 (PDF p.23)", conditions: *c}
  - {test_type: 마모, method: "KS F 2508", where: 외부, frequency: *src, basis: "별표2 2. 가. (1) 동상방지층 및 보조기층 마모 (PDF p.23)", conditions: *c}
  - {test_type: 노상토지지력비(CBR), method: "KS F 2320", where: 현장, frequency: *src, basis: "별표2 2. 가. (1) 동상방지층 및 보조기층 노상토지지력비(CBR) (PDF p.23)", conditions: *c}
  - {test_type: 다짐, method: "KS F 2312", where: 현장, frequency: *src, basis: "별표2 2. 가. (1) 동상방지층 및 보조기층 다짐 (PDF p.23)",
     conditions: "골재원마다·재질변화시마다. 비고: 급속함수량 시험기 사용 불가."}
  - {test_type: 체가름, method: "KS F 2502", where: 현장, frequency: {per_qty: 1000, unit: m3, text: "골재원마다, 1,000㎥마다", minimum: 1},
     basis: "별표2 2. 가. (1) 동상방지층 및 보조기층 체가름 (PDF p.23)", conditions: "골재원마다, 1,000㎥마다. 골재원이 둘 이상이면 골재원별로 센다."}
  - {test_type: 두께, method: "KS F 2367", where: 현장, frequency: {per_qty: null, unit: null, text: "1일 1회 이상", minimum: 1},
     basis: "별표2 2. 가. (1) 동상방지층 및 보조기층 두께 (PDF p.23)", conditions: "1일 1회 이상. 해석 필요: 시공 일수를 내역서로 알 수 없어 최소 1회 — 계획 시 공정 일수로 다시 센다."}
  - {test_type: 함수비, method: "KS F 2306 또는 급속함수량 측정방법", where: 현장, frequency: {per_qty: 500, unit: m3, text: "골재원마다, 포설 후 다짐 전 500㎥마다", minimum: 1},
     basis: "별표2 2. 가. (1) 동상방지층 및 보조기층 함수비 (PDF p.23)", conditions: "골재원마다, 포설 후 다짐 전 500㎥마다."}
  - {test_type: 현장밀도, method: "KS F 2311", where: 현장, frequency: {per_qty: 500, unit: m3, text: "500㎥마다(광활한 지역), 층별 200m마다(2차로 기준)", minimum: 1},
     basis: "별표2 2. 가. (1) 동상방지층 및 보조기층 현장밀도 (PDF p.23)",
     conditions: "500㎥마다(폭이 넓은 광활한 지역의 성토작업시), 층별 200m마다(2차로 기준). 비고: 급속함수량측정기 사용 가능. 해석 필요: 연장 기준은 내역서로 알 수 없어 ㎥ 기준으로 계산."}
  - {test_type: 평판재하, method: "KS F 2310", where: 현장, optional: true, frequency: {per_qty: 500, unit: m3, text: "완성 후 100m마다(2차로 기준), 500㎥마다(광활한 지역)", minimum: 1},
     basis: "별표2 2. 가. (1) 동상방지층 및 보조기층 평판재하 (PDF p.23)",
     conditions: "비고: 현장밀도시험 불가능시. 빈도 선택층 및 보조기층 완성 후 100m마다(2차로 기준) 또는 500㎥마다(광활한 지역)."}
  - {test_type: 모래당량시험, method: "KS F 2340", where: 현장, frequency: *src, basis: "별표2 2. 가. (1) 동상방지층 및 보조기층 모래당량시험 (PDF p.23)", conditions: *c}
  - {test_type: 프루프롤링, method: "5톤 이상의 복륜하중(타이어 접지압 0.55MPa 이상) 통과", where: 현장,
     frequency: {per_qty: null, unit: null, text: "완성 후 전구간에 걸쳐 3회 이상", minimum: 3},
     basis: "별표2 2. 가. (1) 동상방지층 및 보조기층 프루프롤링(Proof rolling) (PDF p.23)", conditions: "완성 후 전 구간에 걸쳐 3회 이상."}
