  - {test_type: "ISVP 열간 내압 내크리프성", method: "KS M 3404", where: 외부, optional: true, frequency: *f, basis: "별표2 1. 마. 일반용 경질폴리염화비닐관 ISVP 열간 내압 내크리프성 (PDF p.18)", conditions: "ISVP 관일 때만."}
