# 출처: 「건설공사 품질관리 업무지침」 별표2 2. 토목 > 가. 도로공사 > (2) 아스팔트 포장 > 혼합물의 포설 (PDF p.26)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
# 아스팔트 콘크리트(표층·기층) 포설 면적 행(㎡)을 잡는다. 재료 행(TON)은 asphalt_plant_mix.yaml.
# KS 처리: 공종(시공) 시험 → ks_mark false, 시험마다 행.
material: asphalt_laying
label: 아스팔트콘크리트 포설
work: 포장공사
basis_version: "국토교통부고시 제2026-360호(2026-07-08 시행) 「건설공사 품질관리 업무지침」 별표2"
index_keys: [asphalt_laying]
match:
  names: [아스콘, 아스팔트콘크리트, 아스팔트포장, 아스팔트혼합물, 가열아스팔트, 표층포설, 기층포설]
  units: [m2]
  exclude: [투수, 절삭, 택코팅, 택코트, 프라임, 유화, 컷백, 방수, 펠트, 루핑, 슁글, 싱글, 운반]
ks_mark: false
order: 41
tests:
  - test_type: 밀도
    method: "KS F 2353"
    where: 현장
    frequency: {per_qty: null, unit: null, text: "1일 1회 이상", minimum: 1}
    basis: "별표2 2. 가. (2) 혼합물의 포설 밀도 (PDF p.26)"
    conditions: "1일 1회 이상. 해석 필요: 포설 일수를 내역서로 알 수 없어 최소 1회 — 계획 시 포설 일수로 다시 센다."

  - test_type: 두께
    method: "KS F 2367"
    where: 현장
    frequency: {per_qty: 3000, unit: m2, text: "포설 1층당 30아르(3,000㎡)마다", minimum: 1}
    basis: "별표2 2. 가. (2) 혼합물의 포설 두께 (PDF p.26)"
    conditions: "포설 1층당 30아르(=3,000㎡)마다. 표층·기층은 층이 달라 규격(행)별로 따로 센다."

  - test_type: 평탄성(종방향)
    method: "KS F 2373"
    where: 현장
    frequency: {per_qty: null, unit: null, text: "차로마다 전구간", minimum: 1}
    basis: "별표2 2. 가. (2) 혼합물의 포설 평탄성 종방향 KS F 2373 (PDF p.26)"
    conditions: "차로마다 전 구간. 비고: 7.6m 측정기. 해석 필요: 차로 수를 내역서로 알 수 없어 최소 1회."

  - test_type: 평탄성(종방향, 3.0m 측정기)
    method: "3.0m 측정기"
    where: 현장
    optional: true                    # 7.6m 측정기 사용 불가능시
    frequency: {per_qty: null, unit: null, text: "차로마다 전구간", minimum: 1}
    basis: "별표2 2. 가. (2) 혼합물의 포설 평탄성 종방향 3.0m 측정기 (PDF p.26)"
    conditions: "비고: 7.6m 측정기 사용 불가능시에만(위 KS F 2373 행 대체)."

  - test_type: 평탄성(횡방향)
    method: "직선자"
    where: 현장
    frequency: {per_qty: null, unit: null, text: "200m마다", minimum: 1}
    basis: "별표2 2. 가. (2) 혼합물의 포설 평탄성 횡방향 (PDF p.26)"
    conditions: "200m마다. 비고: 측정기 사용 불가능시. 해석 필요: 원문 비고를 종방향 측정기 사용 불가 때 직선자로 잰다는 뜻으로 볼지 횡방향 상시 측정으로 볼지 판단 필요 — 기본 산출에 넣고 연장을 모르므로 최소 1회."
