# 출처: LHCS 10 40 00 V2026.04 「시험」 부록4 「품질시험 및 검사기준」 Ⅱ 건축 9. 단열·보온공사 경질 발포 플라스틱-건축물 단열재 "PF"(KS M ISO 4898)
# 발주처(LH) 전용 규칙 — `--owner LH` 일 때만 켜진다. 별표2 에는 페놀폼 종별이 없다(extra_catalog phenolic_foam).
# 원문 문장·표를 옮기지 않고 시험종목·시험방법 번호·빈도 사실만 적는다.
# KS 종목별 처리(ks_still_test): 부록4 비고 — KS 인증 제품이어도 초기 열전도도·흡수성은 시험,
#   실내 단열재의 폼알데하이드·톨루엔·총휘발성유기화합물은 eco_substitute(LHCS 1.5.1(9) 성적서·환경표지인증서 제출 시 면제, L14-C5).
# 등급 조건(부록4 표 주): 압축 크리프 PF Ⅱ(A,B)·Ⅲ(A), 연소성 PF Ⅰ(A,B)·Ⅱ(A,B)·Ⅲ(A), 난연성 PF Ⅰ(C,D) — 해당 등급만(optional).
material: lh_pf_insulation
label: 페놀폼 단열재(PF)
owner: LH
work: 단열공사
basis_version: "LHCS 10 40 00 V2026.04 부록4 「품질시험 및 검사기준」"
extra_keys: [phenolic_foam]
match:
  names: [건축물단열재-PF, 건축물단열재PF, 건축물단열재(PF), 페놀폼, 페놀폼단열재, PF단열재, 페놀수지폼, 페놀보드]
  units: [m2, 매, 장]
  exclude: [인건, 노무, 운반, 할증]
ks_mark: true                          # 종별 괄호에 KS M ISO 4898 — KS 칸 ◎
ks_count: none
order: 48
spec_group:                              # L14-C6: 두께·종호는 제품 규격 — 두께별 행(승인본 건축!B906~B1170 EPS·PUR·PF 두께별 행). 부위·붙임 방법만 뗀다
  pattern: "((?:비드법|압출법)?[1-4]종[1-4]호|특호|[1-4]호)?[^0-9+]*?(\\d{2,3})MM"
  label: "{1}{2}MM"
  other: "두께 미기재"
group_tests: true
group:
  frequency: "시공면적 1,000㎡마다"
  basis: "LHCS 10 40 00 V2026.04 부록4 Ⅱ.9 단열·보온공사 경질 발포 플라스틱-건축물 단열재 PF(KS M ISO 4898)"
tests:
  - {test_type: 선형치수, method: "KS M ISO 1923", where: 현장, frequency: &f {per_qty: 1000, unit: m2, text: "시공면적 1,000㎡마다", minimum: 1}, basis: &b "LHCS 10 40 00 V2026.04 부록4 Ⅱ.9 경질 발포 플라스틱-건축물 단열재 PF(KS M ISO 4898)", conditions: "현장시험"}
  - {test_type: 밀도, method: "KS M ISO 845", where: 현장, frequency: *f, basis: *b, conditions: "현장시험"}
  - {test_type: 압축강도, method: "KS M ISO 844", where: 외부, frequency: *f, basis: *b}
  - {test_type: 초기 열전도도, ks_still_test: true, method: "KS L ISO 8301 또는 8302", where: 외부, frequency: *f, basis: *b, conditions: &s "KS 인증 제품이어도 시험(부록4 비고)."}
  - {test_type: 장기 열 저항, method: "KS M ISO 11561", where: 외부, frequency: *f, basis: *b}
  - {test_type: 치수 안정성, method: "KS M ISO 2796", where: 외부, frequency: *f, basis: *b}
  - {test_type: 압축 크리프, optional: true, method: "KS M ISO 7616 또는 7850", where: 외부, frequency: *f, basis: *b, conditions: "PF Ⅱ(A,B)·Ⅲ(A) 등급만"}
  - {test_type: 수증기 투과도, method: "KS M ISO 1663", where: 외부, frequency: *f, basis: *b}
  - {test_type: 흡수성, ks_still_test: true, method: "KS M ISO 2896", where: 외부, frequency: *f, basis: *b, conditions: *s}
  - {test_type: 굴곡 파괴하중, method: "KS M ISO 1209-1", where: 외부, frequency: *f, basis: *b}
  - {test_type: 연소성, method: "KS M ISO 9772", where: 외부, frequency: *f, basis: *b, conditions: "PF Ⅰ(A,B)·Ⅱ(A,B)·Ⅲ(A) 등급에 해당(표 주). PF는 KS라도 시험 종목에 연소성이 없음(비고는 초기 열전도도·흡수성)."}
  - {test_type: 난연성, optional: true, method: "KS F ISO 5660-1, KS F 2271", where: 외부, frequency: {per_qty: null, unit: null, text: "제조회사별, 제품규격별", minimum: 1}, basis: *b, conditions: "PF Ⅰ(C,D) 등급만. 「건축자재등 품질인정 및 관리기준」에 따른 최근 1년 이내 성적서로 대체 가능(부록4 비고)."}
  - {test_type: 폼알데하이드, eco_substitute: true, optional: true, method: "KS M 1998", where: 외부, frequency: &fv {per_qty: null, unit: null, text: "제조회사별, 제품규격별(범주별)", minimum: 1}, basis: *b, conditions: &v "실내 단열재에 한함. KS 인증 제품이어도 시험(부록4 비고). 친환경 항목은 LHCS 1.5.1(9) 성적서로 면제될 수 있음."}
  - {test_type: 톨루엔, eco_substitute: true, optional: true, method: "KS M 1998", where: 외부, frequency: *fv, basis: *b, conditions: *v}
  - {test_type: 총휘발성유기화합물, eco_substitute: true, optional: true, method: "KS M 1998", where: 외부, frequency: *fv, basis: *b, conditions: *v}
