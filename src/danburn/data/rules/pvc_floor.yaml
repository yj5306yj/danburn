# 출처: 「건설공사 품질관리 업무지침」 별표2 건설공사 품질시험기준(제8조제1항 관련)
#       3. 건축 > 바. 마감공사(지붕·목공사 포함) > PVC계 바닥재(KS M 3802) (PDF p.43~44)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다. (L7-R5, 원문 표를 렌더해 칸 경계 확인)
# KS 처리: 종별 괄호 안 KS 규격 제품은 별표2 끝 ※주석(PDF p.52)에 따라 시행령 제91조제1항 시험 제외 → ◎.
# 원문은 바닥타일·바닥시트 2종류(p.43~44). 기본 행은 두 종류 공통 6종목, 바닥타일에만 있는 흡수에 의한 길이 변화율·긁기시험은 optional.
# p.44 박리강도~난연성은 종류 칸 없이 종별 전체에 걸친 행이고 빈도 '필요시'(박리강도 포함 한 칸) → optional.
# 시공 행: 공동주택 내역은 '비닐장판깔기'·'륨카펫트붙이기'처럼 재료+시공 한 행으로 나온다 → accept_install_rows(비고 '시공 행 추정').
# 비닐 바닥재 접착제(KS M 3705)는 vinyl_floor_adhesive — 이름이 더 길어 그쪽이 이긴다.
