# 출처: 「건설공사 품질관리 업무지침」 별표2 건설공사 품질시험기준(제8조제1항 관련)
#       3. 건축 > 바. 마감공사(지붕·목공사 포함) > 섬유판(KS F 3200) (PDF p.40~41)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다. (L7-R5, 원문 표를 렌더해 칸 경계 확인)
# KS 처리: 종별 괄호 안 KS 규격 제품은 별표2 끝 ※주석(PDF p.52)에 따라 시행령 제91조제1항 시험 제외 → ◎.
# 원문은 연질판·중밀도판(p.40)·경질판(p.41) 3종류별로 종목이 다르다(비고: 용도 및 접착제 등에 따라 구분 적용).
# 기본 행은 3종류 공통 4종목(겉모양·치수·직각도, 밀도, 함수율, 휨 강도). 종류별 종목은 optional + conditions.
# 바탕·단판붙임·치장 판(p.41, KS F 3104)은 파티클보드 종별이라 여기 넣지 않는다.
