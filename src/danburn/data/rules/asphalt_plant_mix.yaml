# 출처: 「건설공사 품질관리 업무지침」 별표2 2. 토목 > 가. 도로공사 > (2) 아스팔트 포장 > 플랜트혼합물 (PDF p.26)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
# 아스팔트 콘크리트(표층·기층) 재료 행(TON)을 잡는다. 포설 면적 행(㎡)은 asphalt_laying.yaml(혼합물의 포설)이 잡는다.
# 투수성 아스팔트 혼합물(KS F 2385, PDF p.28)·아스콘용 골재·채움재·유화아스팔트는 별도 종별 → match.exclude.
# KS 처리: 종별 괄호 KS 없음 → ks_mark false, 시험마다 행.
material: asphalt_plant_mix
label: 아스팔트콘크리트
work: 포장공사
basis_version: "국토교통부고시 제2026-360호(2026-07-08 시행) 「건설공사 품질관리 업무지침」 별표2"
index_keys: [asphalt_plant_mix]
match:
  names: [아스콘, 아스팔트콘크리트, 아스팔트혼합물, 가열아스팔트, 플랜트혼합물]
  units: [ton]
  exclude: [투수, 순환골재, 골재, 채움재, 포설, 운반, 절삭, 택코팅, 택코트, 프라임, 유화, 컷백, 방수, 펠트, 루핑, 슁글, 싱글, 플랜트설치]
ks_mark: false
order: 40
tests:
  - test_type: 혼합물 온도
    method: "온도계에 의함"
    where: 현장
    frequency: {per_qty: null, unit: null, text: "운반차량마다", minimum: 1}
    basis: "별표2 2. 가. (2) 플랜트혼합물 혼합물 온도 (PDF p.26)"
    conditions: "운반차량마다. 해석 필요: 차량 대수는 적재량·운반 계획에 따라 달라 내역서 물량(톤)으로 정하지 않는다 — 최소 1회로 두고 계획 시 반입 대수로 적는다."

  - test_type: 역청함유량
    method: "KS F 2354"
    where: 현장
    frequency: {per_qty: null, unit: null, text: "1일 1회 이상", minimum: 1}
    basis: "별표2 2. 가. (2) 플랜트혼합물 역청함유량 (PDF p.26)"
    conditions: &day "1일 1회 이상(역청함유량·체가름·마샬안정도가 한 빈도 칸). 해석 필요: 포장 일수를 내역서로 알 수 없어 최소 1회 — 계획 시 포장 일수로 다시 센다."

  - test_type: 체가름
    method: "KS F 2502"
    where: 현장
    frequency: {per_qty: null, unit: null, text: "1일 1회 이상", minimum: 1}
    basis: "별표2 2. 가. (2) 플랜트혼합물 체가름 (PDF p.26)"
    conditions: *day

  - test_type: 마샬안정도
    method: "KS F 2337"
    where: 현장
    frequency: {per_qty: null, unit: null, text: "1일 1회 이상", minimum: 1}
    basis: "별표2 2. 가. (2) 플랜트혼합물 마샬안정도 (PDF p.26)"
    conditions: *day

  - test_type: 피막박리
    method: "KS F 2355"
    where: 현장
    optional: true
    frequency: {per_qty: null, unit: null, text: "필요시마다", minimum: 1}
    basis: "별표2 2. 가. (2) 플랜트혼합물 피막박리 (PDF p.26)"
    conditions: "필요시마다."
