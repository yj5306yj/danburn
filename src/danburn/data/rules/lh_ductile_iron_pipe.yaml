  method: 원문 시험방법 칸 빈칸(실측)
  where: 현장
  frequency: {per_qty: null, unit: null, text: 제조회사별, 제품규격마다, minimum: 1}
  basis: LHCS 10 40 00:2020 부록 「품질시험 및 검사기준」 Ⅰ.1 공통 마. 기타 상수도용 관(공통) 치수
  conditions: 상수도용 관 공통 종목. 제조회사별·제품규격마다. 해석 필요 — 원문에 현장/외부 구분이 없어 현장 실측으로 적음.
- test_type: KS D 4311에 규정된 시험종목
  ks_substitute: certificate
  method: KS D 4311
  where: KS
  frequency: {per_qty: null, unit: null, text: KS 인증업체 공인기관 시험성적서 확인으로 갈음, minimum: 1}
  basis: LHCS 10 40 00:2020 부록 「품질시험 및 검사기준」 Ⅰ.1 공통 마. 기타 상수도용 관 주철관 — KS D 4311에 규정된 시험종목
  conditions: 비고 — KS 인증업체가 공인기관에 의뢰한 시험성적서 징구 확인으로 갈음.
- test_type: 수압시험
  method: KS D 4311
  where: 현장
  frequency: {per_qty: null, unit: null, text: 제수밸브와 제수밸브 사이, minimum: 1}
  basis: LHCS 10 40 00:2020 부록 「품질시험 및 검사기준」 Ⅰ.1 공통 마. 기타 상수도용 관 주철관 수압시험
  conditions: 대상 80mm 이상 관. 관경 800mm 이상 주철관 이음은 공사감독자(감리원) 입회하에 이음부마다 내면에서 테스트밴드로 수압시험. 해석 필요 — 제수밸브 구간 수를 내역서로 알 수 없어 1회로 적음(구간 수만큼 늘린다).
