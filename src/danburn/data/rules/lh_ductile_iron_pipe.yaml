# 출처: LHCS 10 40 00:2020 「시험」(2020-12-09 제정, 한국토지주택공사) 부록 「품질시험 및 검사기준」 Ⅰ. 공통 및 토목분야 1. 공통 마. 기타
#       > 상수도용 관(공통 치수, 주철관). 국가건설기준센터(KCSC) 공개본. 공공데이터포털 「한국토지주택공사_전문시방서_20201209」 이용허락범위 제한 없음.
# KS 종목별 처리(ks_substitute): KS D 4311 규정 종목은 KS 인증업체 성적서로 갈음 — LHCS 10 40 00 V2026.04 부록4 같은 비고(L14-C3).
# 발주처(LH) 전용 규칙 — `--owner LH` 일 때만 켜진다. 별표2에는 주철관 종별이 없다(PDF 전체 확인, L7-R9).
# 원문 문장·표를 옮기지 않고 종별·시험종목·시험방법 번호·빈도 사실만 적는다.
# 원문: 공통 — 치수(제조회사별·제품규격마다, 시험방법 칸 빈칸). 주철관 — 'KS D 4311에 규정된 시험종목'(KS D 4311, 비고: KS 인증업체가
#   공인기관에 의뢰한 시험성적서 확인으로 갈음), 수압시험(빈도: 제수밸브와 제수밸브 사이, 비고: 대상 80mm 이상 관, 관경 800mm 이상은
#   공사감독자 입회하에 이음부마다 테스트밴드 수압시험).
# 이 파일은 직관. 이형관은 lh_ductile_iron_fitting.yaml(관로 수압시험은 여기서 한 번만 센다).
# 표기: 실자료에 '닥타일'(오기)로 온다 — 덕타일·닥타일 둘 다 적는다. 색인 도자기질 타일은 '덕타일·닥타일'을 제외한다.
# 매칭: 자재 행(본·m). 부설(자재 미포함)·KP 메커니컬 조인트 접합·절단·운반·통행료 행, 배수용(NO-HUB) 주철관, 덕타일 제수밸브, 맨홀 뚜껑은 뺀다.
material: lh_ductile_iron_pipe
label: 수도용 덕타일 주철관
work: 상수도공사
owner: LH
basis_version: LHCS 10 40 00:2020(2020-12-09) 부록 「품질시험 및 검사기준」
match:
  names: [덕타일주철관, 닥타일주철관, 덕타일주철직관, 닥타일주철직관, 수도용주철관, 주철직관, DCIP, 덕타일추철관, 닥타일추철관]   # 승인본 표기(L14-C4) — "주철" 오기
  units: [본, m, 개, ea]
  exclude: [이형관, 배수용, NO-HUB, 부설, 접합, 절단, 운반, 통행료, 밸브, 제수, 뚜껑, 맨홀, 오수관, 보호공, 인건, 노무, 할증]
ks_mark: true                          # KS D 4311 — LH 계산에서 KS 종목 성적서 갈음(0회·성적서대체)을 타도록(L14-C3, D2 연결 2)
ks_count: makers                       # 치수·수압시험은 KS 제품이어도 제조사 수 × 1회(규격별)
order: 72
spec_group:
  pattern: "D\\s*[-=]?\\s*(\\d{2,4})"
  label: "D{1}"
  other: "규격 미기재"   # L14-C7: 패턴에 안 걸린 행 — 뜻이 보이게
group_tests: true                      # 종목별 행은 calc 가 LH·KS 경로에서 나눈다(L14-C3)
group:
  frequency: "제조회사별, 제품규격마다"
  basis: "LHCS 10 40 00:2020 부록 「품질시험 및 검사기준」 Ⅰ.1 공통 마. 기타 상수도용 관(공통 치수, 주철관 KS D 4311 — KS 인증업체 공인기관 성적서 확인으로 갈음)"
tests:
