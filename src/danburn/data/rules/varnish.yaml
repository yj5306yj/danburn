# 출처: 「건설공사 품질관리 업무지침」 별표2 건설공사 품질시험기준(제8조제1항 관련)
#       3. 건축 > 사. 도장공사 > 바니시(KS M 6050) (PDF p.49)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다. (L7-R5, 원문 표를 렌더해 칸 경계 확인)
# KS 처리: 종별 괄호 안 KS 규격 제품은 별표2 끝 ※주석(PDF p.52)에 따라 시행령 제91조제1항 시험 제외 → ◎.
# 종목: 저온 안정성(1·2종)~로진 및 유도체 (p.49). p.49 첫 행 '용기내 상태'는 래커도료 6·7종의 이어진 행이라 넣지 않는다.
# 이름: '니스'만 쓰지 않는다 — 내역서의 '피트니스' 등에 걸린다. 단위도 도료 단위로 제한.
