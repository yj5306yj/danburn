# 출처: 「건설공사 품질관리 업무지침」 별표2 1. 공통 > 라. 가설기자재 > 강재 파이프서포트 (PDF p.15)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
# KS 처리: 종별 이름에 괄호 KS 규격이 없다 → ※주석(PDF p.52) 시험 면제 대상 아님 → ks_mark false. 묶음 행(비KS: 공급자 수×1회).
# 도급내역서 관행: 동바리는 '설치 및 해체'(공㎥·㎡)·'손료' 행이 대부분이다. 손료·운반 행은 자재가 아니므로 빼고,
#   자재 행(개·본)이 없을 때만 시공 행 물량으로 받는다(accept_install_rows, 비고 '시공 행 추정').
#   빈도가 물량 비례가 아니므로(제품규격마다·공급자마다) 시공 행 물량은 횟수에 영향이 없다.
material: temp_pipe_support
label: 강재파이프서포트
work: 가설공사
basis_version: "국토교통부고시 제2026-360호(2026-07-08 시행) 「건설공사 품질관리 업무지침」 별표2"
index_keys: [temp_pipe_support]
match:
  names: [파이프서포트, 파이프써포트, 강관동바리, 강관서포트, 강재파이프서포트]
  units: [ea, 개, 본]
  exclude: [설치, 시공, 손료, 임대, 운반, 인건, 노무, 할증, 알루미늄, 시스템]
accept_install_rows: true                # 내역서에 시공 행(…설치 및 해체)만 있을 때 그 물량으로(비고 “시공 행 추정”)
install_units: [m2, m3, 공m3, 공㎥]
ks_mark: false
makers_label: 공급자                     # 빈도 '공급자마다' — 묶음 행 횟수 = 공급자 수(기본 1, --makers)×1회
order: 61
group_tests: true                        # 규격당 한 행(시공 행 추정 비고가 묶음 행에 붙는다)
group:
  frequency: "제품규격마다(3개), 공급자마다"
  basis: "별표2 1. 라. 가설기자재 강재 파이프서포트 (PDF p.15)"
tests:
  - test_type: 평누름에 의한 압축하중
    method: "KS F 8001 또는 산업안전보건법에 따른 안전인증기준"
    where: 외부
    frequency: {per_qty: null, unit: null, text: "제품규격마다(3개), 공급자마다", minimum: 1}
    basis: "별표2 1. 라. 강재 파이프서포트 — 평누름에 의한 압축 하중 (PDF p.15)"
    conditions: "제품규격마다 시험체 3개, 공급자마다. 비고: 최대 사용 길이 4,000mm 초과 제품과 알루미늄합금재 제품은 「방호장치 안전인증 고시」의 시험방법 적용. 해석 필요: 공급자·제품규격 수를 내역서로 알 수 없어 규격(행)당 1회로 적는다."
