# 출처: 「건설공사 품질관리 업무지침」 별표2 건설공사 품질시험기준(제8조제1항 관련)
#       1. 공통 > 나. 철근콘크리트공사 > 굳지 아니한 콘크리트(레미콘포함)·굳은 콘크리트(레미콘포함)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
material: ready_mixed_concrete
label: 콘크리트                        # 원본 계획서 표기: 콘크리트(25-18-80)
work: 철근콘크리트공사
ks_mark: true                          # KS F 4009 인증 레미콘 — KS 칸 ◎(사용자 확인 09-26)
order: 20
warn_if_missing: true                  # 입력에 없으면 경고(핵심 자재)
basis_version: "국토교통부고시 제2026-360호(2026-07-08 시행) 「건설공사 품질관리 업무지침」 별표2 — 레미콘·철근 행은 제2025-311호와 동일(R3 확인 2026-09-26)"
match:
  names: ["레미콘"]
  units: ["m3"]
tests:
  - test_type: 압축강도
    method: "KS F 2403, KS F 2405, KCS 14 20 00"   # 옛 명칭 콘크리트표준시방서 → KCS 14 20 00(2016 코드 전환, standards_snapshot obsolete_names)
    where: 현장
    # 사용자 실무 설명(09-26): 120㎥마다는 현장물성시험 1회, 3회(360㎥)가 1로트. 로트 안에서 부위(수직·수평)·재령(7·28일)별로
    # 공시체를 떠 합친 것이 N조. 현행 기준 근거는 R3(KCS 확인)로 보강 예정.
    frequency: {per_qty: 360, unit: m3, lot: true, text: "360㎥ 마다", minimum: 1, default_sets: 4, sets_basis: "28일 3조·7일 1조(LHCS 14 20 10 05:2020 3.12.5.1(4) — 기초·층별·타설 단위별; KCS 14 20 10:2024 표 3.5-3 120㎥마다 1회=공시체 3개). 360㎥=1로트는 120㎥×연속 3회 판정에서 나온 실무 해석(기준 문구 아님). 거푸집 존치 판단용은 수직 1조·수평 1조·예비 1조(LHCS 14 20 10 05:2020 3.12.5.1(4), 원문은 층별; 사용자 실무 설명 09-26) — 해당 규격에 --formwork-sets 로 추가"}
    basis: "별표2 1. 나. 굳은 콘크리트(레미콘포함) 압축 강도 (PDF p.7)"
    conditions: "1일 타설량 구분은 슬럼프와 같음. 해석 필요: 별표2는 시험 장소(현장 시험실/외부 의뢰)를 정하지 않음 — where=현장은 기본값."

  - test_type: 공시체제작
    method: "KS F 2403"
    where: 현장
    # 별표2의 독립 시험종목은 아니다. 실무 8.11은 압축강도와 같은 로트·조 수로 공시체제작 행을 따로 적는다
    # (사용자 결정 09-26: "넣긴 해야 돼, 저거랑 똑같이"). 계획횟수는 압축강도와 같다.
    frequency: {per_qty: 360, unit: m3, lot: true, text: "360㎥ 마다", minimum: 1, default_sets: 4, sets_basis: "28일 3조·7일 1조(LHCS 14 20 10 05:2020 3.12.5.1(4) — 기초·층별·타설 단위별; KCS 14 20 10:2024 표 3.5-3 120㎥마다 1회=공시체 3개). 360㎥=1로트는 120㎥×연속 3회 판정에서 나온 실무 해석(기준 문구 아님). 거푸집 존치 판단용은 수직 1조·수평 1조·예비 1조(LHCS 14 20 10 05:2020 3.12.5.1(4), 원문은 층별; 사용자 실무 설명 09-26) — 해당 규격에 --formwork-sets 로 추가"}
    basis: "실무 관행 — 압축강도 공시체 제작(KS F 2403). 사용자 결정 2026-09-26"
    conditions: "압축강도 행과 같은 로트 수·조 수를 쓴다."

  - test_type: 슬럼프 또는 슬럼프플로
    display: 슬럼프
    method: "KS F 2402 또는 KS F 2594"
    where: 현장
    frequency: {per_qty: 120, unit: m3, text: "120㎥ 마다", minimum: 1}
    basis: "별표2 1. 나. 굳지 아니한 콘크리트(레미콘포함) 슬럼프 또는 슬럼프플로 (PDF p.6~7)"
    conditions: "배합이 다를 때마다. 1일 타설량 120㎥ 미만이면 1일 타설량마다, 120㎥ 이상이면 120㎥마다. 해석 필요: 도급내역서 총량만으로는 1일 타설량·타설일수를 알 수 없어 per_qty=120은 120㎥ 이상 타설일 기준이며, 120㎥ 미만 타설일이 있으면 횟수가 늘어난다."

  - test_type: 공기량
    method: "KS F 2421 또는 KS F 2409 또는 KS F 2449"
    where: 현장
    frequency: {per_qty: 120, unit: m3, text: "120㎥ 마다", minimum: 1}
    basis: "별표2 1. 나. 굳지 아니한 콘크리트(레미콘포함) 공기량 (PDF p.7)"
    conditions: "슬럼프와 같은 빈도 칸(쪽 경계 p.6→p.7에 걸친 병합 칸). 해석 필요: 1일 타설량 구분은 슬럼프와 같음."

  - test_type: 염화물 함유량
    display: 염화물
    method: "KS F 4009 부속서 A"
    where: 현장
    frequency: {per_qty: 120, unit: m3, text: "120㎥ 마다", minimum: 1}
    basis: "별표2 1. 나. 굳지 아니한 콘크리트(레미콘포함) 염화물 함유량 (PDF p.7)"
    conditions: "해석 필요: 이 행의 빈도 칸이 비어 있어 위 슬럼프·공기량의 병합 빈도 칸에 속하는 것으로 읽음(표 칸 구조 기준)."

  - test_type: 단위수량
    method: "KCS 14 20 10, 한국콘크리트학회 제규격(KCI-RM101)"
    where: 현장
    frequency: {per_qty: 120, unit: m3, text: "120㎥ 마다", minimum: 1}
    basis: "별표2 1. 나. 굳지 아니한 콘크리트(레미콘포함) 단위수량 (PDF p.7)"
    conditions: "비고: 정전용량법·단위용적질량법·고주파가열법·마이크로파법 중 하나, 판정은 시방배합 단위수량 ±20kg/㎥ 이내. 1일 타설량 구분은 슬럼프와 같음."

  - test_type: 배합설계
    method: "KCS 14 20 00"
    where: 현장
    optional: true                    # 실무 8.11에서 생략(사용자 결정 09-26: 원본 현장 계획서에 없음). --include-optional 로 포함
    frequency: {per_qty: null, unit: null, text: "배합마다", minimum: 1}
    basis: "별표2 1. 나. 굳지 아니한 콘크리트(레미콘포함) 배합설계 (PDF p.6)"
    conditions: "재료가 다른 배합마다 1회."

  - test_type: 현장배합수정
    method: "원문 공란(시험방법 미지정)"
    where: 현장
    optional: true                    # 실무 8.11에서 생략(사용자 결정 09-26: 원본 현장 계획서에 없음). --include-optional 로 포함
    frequency: {per_qty: null, unit: null, text: "작업개시전 1회", minimum: 1}
    basis: "별표2 1. 나. 굳지 아니한 콘크리트(레미콘포함) 현장배합수정 (PDF p.6)"
    conditions: "메인 원문 대조(09-26): 시험방법 칸은 병합이 아니라 공란이다. 계획서 작성 시 현장이 방법을 정한다."

  - test_type: 온도
    method: "온도계에 의함"
    where: 현장
    optional: true                    # 실무 8.11에서 생략(사용자 결정 09-26: 원본 현장 계획서에 없음). --include-optional 로 포함
    frequency: {per_qty: 120, unit: m3, text: "120㎥ 마다", minimum: 1}
    basis: "별표2 1. 나. 굳지 아니한 콘크리트(레미콘포함) 온도 (PDF p.6)"
    conditions: "120㎥마다(1일 타설량 구분 없음)."

  - test_type: 휨강도
    method: "KS F 2408"
    where: 현장
    optional: true                    # 비고: 콘크리트포장에 한함
    frequency: {per_qty: 120, unit: m3, text: "120㎥ 마다", minimum: 1}
    basis: "별표2 1. 나. 굳은 콘크리트(레미콘포함) 휨 강도 (PDF p.7)"
    conditions: "비고: 콘크리트포장에 한함(포장이 아니면 적용하지 않음). 해석 필요: 빈도 칸이 비어 있어 압축강도 빈도 칸과 병합된 것으로 읽음."
