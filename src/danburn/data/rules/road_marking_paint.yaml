# 출처: 「건설공사 품질관리 업무지침」 별표2 2. 토목 가. 도로공사 > 도로표지용 도료(KS M 6080) (PDF p.29)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
# 원문은 1종(상온형)·2종(수용성)·3종(가열형) 15종목과 4종(융착식) 15종목을 나누어 적는다(종류 칸 세로 가운데로 경계 확인).
#   엔진은 규격별로 시험 목록을 가를 수 없으므로 수성도료 규칙처럼 두 목록에 모두 있는 8종목을 기본으로 두고,
#   종류에만 있는 14종목은 optional(조건: 종류)로 둔다 — --include-optional 이면 모두 나온다. 행 이름은 규격의 종류(융착·상온 등)로 나눈다.
# KS 처리: 종별 괄호 안 KS 규격 제품은 ※주석(PDF p.52)에 따라 시행령 제91조제1항 시험 제외 → ◎.
# 내역서 관행: '차선도색(백색, 실선)'·'주차선도색'처럼 도색 공종 행(㎡)에 도료가 들어 있다(규격 칸에 '융착식 도료' 등).
# KS 종목별 처리(ks_substitute): LHCS 10 40 00 V2026.04 부록4 해당 종별 비고 — KS 인증업체 공인기관 성적서 확인으로 갈음하는 종목. LH 발주 기준(별표2 아님).
material: road_marking_paint
label: 도로표지용 도료
work: 도장공사                           # 내역서 구분 경로에 공종이 없을 때(건축 주차선 등). 토목은 경로(교통안전시설 등)가 우선
basis_version: "국토교통부고시 제2026-360호(2026-07-08 시행) 「건설공사 품질관리 업무지침」 별표2"
index_keys: [road_marking_paint]
match:
  names: [도로표지용도료, 차선도색, 차선도료, 주차선도색, 노면표시, 융착식도료]
  units: [m2, m, kg, l, ℓ]
  exclude: [규제봉, 제거, 인건, 노무, 운반, 할증]
ks_mark: true                            # 종별 괄호 (KS M 6080)
ks_count: none
order: 42
spec_group:                              # 색·선 모양별 행 대신 도료 종류별로 묶는다(시험 종목이 종류로 갈림)
  pattern: "(융착|가열|수용|상온)"
  label: "{1}형"
  other: "규격 미기재"   # L14-C7: 패턴에 안 걸린 행 — 뜻이 보이게
group_tests: true
group:
  frequency: "제조회사별, 제품규격마다"
  basis: "별표2 2. 토목 가. 도로공사 도로표지용 도료(KS M 6080) (PDF p.29); KS 제품은 별표2 ※주석(PDF p.52) — 종별 괄호 안 KS 규격 제품은 건설기술 진흥법 시행령 제91조제1항 시험 제외"
