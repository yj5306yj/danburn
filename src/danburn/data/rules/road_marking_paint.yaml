  - test_type: "불점착 건조성"
    ks_substitute: certificate
    method: "KS M 6080"
    where: 외부
    frequency: {per_qty: null, unit: null, text: "제조회사별, 제품규격마다", minimum: 1}
    basis: "별표2 2. 토목 가. 도로공사 도로표지용 도료(KS M 6080) 불점착 건조성 (PDF p.29)"
