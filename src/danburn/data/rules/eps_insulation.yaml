# 출처: 「건설공사 품질관리 업무지침」 별표2 건설공사 품질시험기준(제8조제1항 관련)
#       3. 건축 > 다. 단열·보온공사 > 발포폴리스티렌단열재(KS M 3808) (PDF p.36~37)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
# KS M 3808 은 비드법·압출법 보온판을 함께 다룬다(계약의 '압출법 보온판 등 단열재').
# 빈도 '시공면적 1,000㎡마다, 1,000매마다' → per_qty 1000 m2(비KS 계산용). 매 단위 행은 1,000매로 같은 숫자를 쓴다.
# KS 종목별 처리(ks_still_test): LHCS 10 40 00 V2026.04 부록4 해당 종별 비고 — KS 인증 제품이어도 시험하는 종목. LH 발주 기준(별표2 아님).
material: eps_insulation
label: 발포폴리스티렌단열재
work: 단열공사
basis_version: "국토교통부고시 제2026-360호(2026-07-08 시행) 「건설공사 품질관리 업무지침」 별표2"
index_keys: [eps_insulation]
match:
  names: [발포폴리스티렌, 스티로폼, 비드법, 압출법단열재, EPS단열재, 압출법보온판, 비드법보온판, XPS, 스치로폴, 스티로폴, 경질발포플라스틱단열재, 결로방지용발포폴리스티렌, 건축물단열재-EPS, 건축물단열재EPS, 건축물단열재(EPS), 결로방지용발포플리스티렌]   # LHCS 표기 "경질 발포 플라스틱-건축물 단열재-EPS"(L14-C2)
  units: [m2, 매, 장]
  exclude: [PUR, PIR, 우레탄, 페놀, 인건, 노무, 운반, 할증]
ks_mark: true                          # 종별 괄호에 KS M 3808 — KS 칸 ◎
ks_count: none                         # KS 인증품은 시험 없이 ◎(시행령 91조 면제, 산출근거 'KS자재')
order: 45
spec_group:                              # L14-C6: 두께·종호는 제품 규격 — 두께별 행(승인본 건축!B906~B1170 EPS·PUR·PF 두께별 행). 부위·붙임 방법만 뗀다
  pattern: "((?:비드법|압출법)?[1-4]종[1-4]호|특호|[1-4]호)?[^0-9+]*?(\\d{2,3})MM"
  label: "{1}{2}MM"
  other: "두께 미기재"
group_tests: true
group:
  frequency: "시공면적 1,000㎡마다, 1,000매마다"
  basis: "별표2 3. 건축 다. 단열·보온공사 발포폴리스티렌단열재(KS M 3808) (PDF p.36~37); KS 제품은 ※주석(PDF p.52) — 종별 괄호 안 KS 규격 제품은 건설기술 진흥법 시행령 제91조제1항 시험 제외"
