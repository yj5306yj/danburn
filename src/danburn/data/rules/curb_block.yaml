# 출처: 「건설공사 품질관리 업무지침」 별표2 건설공사 품질시험기준(제8조제1항 관련)
#       2. 토목 > 가. 도로공사 > (3) 기타 > 콘크리트 경계블록(보·차도용)(KS F 4006)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
# KS 처리: 종별 괄호 안 KS 규격 제품은 별표2 끝 ※주석(PDF p.52)에 따라 시행령 제91조제1항 시험 제외 → ◎.
# 화강석 경계석은 이 종별(콘크리트 제품)이 아니라 석재(stone)다 → exclude.
material: curb_block
label: 콘크리트경계블록
work: 포장공사
basis_version: "국토교통부고시 제2026-360호(2026-07-08 시행) 「건설공사 품질관리 업무지침」 별표2"
index_keys: [curb_block]
match:
  names: [경계블록, 경계블럭, 보차도경계, 도로경계석, 경계석]
  units: [m, ea, 개, 매]                 # 도급내역서 관행 M(연장) 또는 EA
  exclude: [화강석, 석재, 자연석, 대리석, 설치, 운반, 하차, 기초, 철거]
unit_factors:                            # 합산 전 환산: 매·개=1개, m=1개(블록 길이 1,000mm 가정 — 다른 길이면 확인 필요)
  m: [ea, 1]
  매: [ea, 1]
  개: [ea, 1]
ks_mark: true                            # 종별 괄호 (KS F 4006)
ks_count: none
order: 70
spec_group:                              # 곡선·직선·빗물받이부·A-TYPE·모따기는 시공 위치(L14-C3). 호칭(단면×길이)은 제품 규격이라 남긴다
  pattern: "(\\d{3})X(\\d{3})X(\\d{3,4})"
  label: "{1}X{2}X{3}"
  other: "규격 미기재"   # L14-C7: 패턴에 안 걸린 행 — 뜻이 보이게
group_tests: true
group:
  frequency: "제조회사별, 호칭 및 길이별\n1,000매 또는 그 단수마다"
  basis: "별표2 2. 토목 가. 도로공사 (3) 기타 콘크리트 경계블록(보·차도용)(KS F 4006) (PDF p.28); KS 제품은 별표2 ※주석(PDF p.52) — 시행령 제91조제1항 시험 제외"
tests:
  - test_type: 겉모양, 모양 및 치수
    method: "KS F 4006"
    where: 현장   # LHCS 10 40 00 V2026.04 부록4 비고 '현장시험'(L14-C5)
    frequency: {per_qty: 1000, unit: ea, text: "호칭·길이별 1,000매마다", minimum: 1}
    basis: "별표2 2. 가. (3) 콘크리트 경계블록(KS F 4006) 겉모양, 모양 및 치수 (PDF p.28)"
    conditions: &cb "제조회사별, 호칭 및 길이를 달리할 때 1,000매 또는 그 단수마다(병합 빈도 칸). KS 인증품은 ※주석(PDF p.52)으로 면제 → ◎. 내역 단위 m(연장)·매·개는 unit_factors 로 개(ea) 환산 — m 는 블록 길이 1,000mm(1m=1개) 가정. 해석 필요: 길이가 다른 블록(곡선·모서리용 등)이 섞이면 매수 확인 필요."
  - test_type: 휨강도
    method: "KS F 4006"
    where: 외부
    frequency: {per_qty: 1000, unit: ea, text: "호칭·길이별 1,000매마다", minimum: 1}
    basis: "별표2 2. 가. (3) 콘크리트 경계블록(KS F 4006) 휨강도 (PDF p.28)"
    conditions: *cb
  - test_type: 흡수율
    method: "KS F 4006"
    where: 외부
    frequency: {per_qty: 1000, unit: ea, text: "호칭·길이별 1,000매마다", minimum: 1}
    basis: "별표2 2. 가. (3) 콘크리트 경계블록(KS F 4006) 흡수율 (PDF p.28)"
    conditions: *cb
