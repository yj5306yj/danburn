    basis: "별표2 1. 공통 마. 기타 철근콘크리트관(KS F 4402) 치수 (PDF p.18)"
    conditions: &rc "하수도용관(비고). 해석 필요: 내역 m 단위는 관 1본 길이로 나누어 개수로 바꿔야 비KS 횟수가 맞음."
