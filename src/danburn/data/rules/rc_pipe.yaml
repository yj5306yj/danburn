    basis: "별표2 1. 공통 마. 기타 철근콘크리트관(KS F 4402) 겉모양 및 모양 (PDF p.18)"
    conditions: "빈도: 모든 제품마다. 하수도용관(비고)."
  - test_type: "치수"
