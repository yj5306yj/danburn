# 출처: 「건설공사 품질관리 업무지침」 별표2 건설공사 품질시험기준(제8조제1항 관련)
#       3. 건축 다. 단열·보온공사 > 인조광섬유 단열재(KS L 9102) (PDF p.37)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
# KS 처리: 종별 괄호 안 KS 규격 제품은 별표2 끝 ※주석(PDF p.52)에 따라 시행령 제91조제1항 시험 제외 → ◎.
# 유리면(글라스울)·미네랄울 모두 이 종별. 암면 흡음판·뿜칠 내화피복은 다른 제품 → exclude.
material: mineral_wool
label: 인조광섬유 단열재
work: 단열공사
basis_version: "국토교통부고시 제2026-360호(2026-07-08 시행) 「건설공사 품질관리 업무지침」 별표2"
index_keys: [mineral_wool]
match:
  names: [인조광섬유, 그라스울, 글라스울, 미네랄울, 암면, 유리면, 유리섬유보온재, 유리섬유단열재, 유리솜, 유리면보온재]
  units: [m2, 매, 장, m]   # m = 관 보온(유리솜) 연장(L4-T3). KS 묶음 행은 ◎, 비KS(--non-ks)면 빈도 ㎡와 달라 '단위 확인'
  exclude: [흡음, 뿜칠, 천장판, 텍스, 샌드위치, 인건, 노무, 운반, 할증]
ks_mark: true                            # 종별 괄호 (KS L 9102)
ks_count: none                           # KS 인증품은 시험 없이 ◎(산출근거 'KS자재')
order: 48
# spec_group 없음(L14-C6): 빈도가 제품규격별인데 규격에 제품·조건이 섞여 안전한 추출이 어렵다 — 묶지 않는다(규격별 행)
group_tests: true
group:
  frequency: "시공면적 1,000제곱미터마다
1,000매마다"
  basis: "별표2 3. 건축 다. 단열·보온공사 인조광섬유 단열재(KS L 9102) (PDF p.37); KS 제품은 별표2 ※주석(PDF p.52) — 종별 괄호 안 KS 규격 제품은 건설기술 진흥법 시행령 제91조제1항 시험 제외"
tests:
  - test_type: "겉모양, 치수, 밀도"
    method: "KS L 9102"
    where: 현장   # LHCS 10 40 00 V2026.04 부록4 비고 '현장시험'(L14-C5)
    frequency: {per_qty: 1000, unit: m2, text: "시공면적 1,000㎡마다", minimum: 1}
    basis: "별표2 3. 건축 다. 단열·보온공사 인조광섬유 단열재(KS L 9102) 겉모양, 치수, 밀도 (PDF p.37)"
    conditions: "시공면적 1,000㎡마다, 1,000매마다(병합 빈도 칸). 해석 필요: 매 단위 내역은 ㎡ 기준 계산과 다름."
  - test_type: "열간 수축 온도"
    method: "KS L 9102"
    where: 외부
    frequency: {per_qty: 1000, unit: m2, text: "시공면적 1,000㎡마다", minimum: 1}
    basis: "별표2 3. 건축 다. 단열·보온공사 인조광섬유 단열재(KS L 9102) 열간 수축 온도 (PDF p.37)"
    conditions: "시공면적 1,000㎡마다, 1,000매마다(병합 빈도 칸). 해석 필요: 매 단위 내역은 ㎡ 기준 계산과 다름."
  - test_type: "섬유 평균 굵기(미네랄울)"
    method: "KS L 9102"
    where: 외부
    optional: true
    frequency: {per_qty: 1000, unit: m2, text: "시공면적 1,000㎡마다", minimum: 1}
    basis: "별표2 3. 건축 다. 단열·보온공사 인조광섬유 단열재(KS L 9102) 섬유 평균 굵기(미네랄울) (PDF p.37)"
    conditions: "미네랄울에 한함. 시공면적 1,000㎡마다, 1,000매마다(병합 빈도 칸). 해석 필요: 매 단위 내역은 ㎡ 기준 계산과 다름."
  - test_type: "입자 함유율(미네랄울)"
    method: "KS L 9102"
    where: 외부
    optional: true
    frequency: {per_qty: 1000, unit: m2, text: "시공면적 1,000㎡마다", minimum: 1}
    basis: "별표2 3. 건축 다. 단열·보온공사 인조광섬유 단열재(KS L 9102) 입자 함유율(미네랄울) (PDF p.37)"
    conditions: "미네랄울에 한함. 시공면적 1,000㎡마다, 1,000매마다(병합 빈도 칸). 해석 필요: 매 단위 내역은 ㎡ 기준 계산과 다름."
  - test_type: "열전도율"
    method: "KS L 9016"
    where: 외부
    frequency: {per_qty: 1000, unit: m2, text: "시공면적 1,000㎡마다", minimum: 1}
    basis: "별표2 3. 건축 다. 단열·보온공사 인조광섬유 단열재(KS L 9102) 열전도율 (PDF p.37)"
    conditions: "시공면적 1,000㎡마다, 1,000매마다(병합 빈도 칸). 해석 필요: 매 단위 내역은 ㎡ 기준 계산과 다름."
