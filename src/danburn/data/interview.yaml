# danburn start 첫 실행 인터뷰 질문 목록 — CLI(`danburn start`)와 에이전트 스킬이 같이 읽는다(설계: L7-S1 §2).
#
# 흐름(사용자 2026-09-26): 내역서를 먼저 읽고, 읽은 값은 한 줄 확인([Y/n]), 정해지지 않았거나 모호한 것만 묻는다.
# from_boq: 내역서에서 읽은 후보가 있으면 '…로 읽었습니다. 맞나요?' 로 확인만 한다(start.py read_boq_info).
# 항목: id(순서·이어 하기 표시), key(project.yaml 에 채우는 키), text(화면 문구), help(? 를 누르면 나오는 한 줄 근거),
#       type(choice·text·number·file·files·yesno), choices([{value, label}] — 번호로 고름), default(Enter = 기본값),
#       when(이 질문을 물을 조건 — start.py 의 이름 붙은 조건), optional(true 면 빈 답 허용).
# 공통: Enter = 기본값, ? = 도움말, - = 모름·건너뛰기. 파일은 창에 끌어다 놓아도 된다.
# 첨부(자격·경력 증빙)는 1차에서 목록만 — 파일 이름·경로를 화면·요약·로그에 쓰지 않고 개수만 쓴다.

questions:
- id: '1'
  key: 내역서
  type: file
  text: 도급내역서가 있나요? 먼저 읽고 모호한 것만 여쭙겠습니다. (번호 또는 파일을 창에 끌어다 놓기)
  help: 지급(건)·내역(건) 같은 시트가 있는 xlsx 파일. 읽을 수 있는지 바로 확인합니다.
  exts:
  - .xlsx
- id: 1-1
  key: 블록
  type: choice
  text: 어느 동(블록)으로 만들까요?
  help: 내역서의 동·블록별 수량 열입니다. '전체'는 모든 동을 한 계획서에 동별 행으로 넣습니다.
  when: several_blocks
  choices_from: blocks
  default: 전체
- id: 6-1
  key: 공사명
  type: text
  text: 공사명은?
  help: 계약서의 공사명. 표지·쪽 머리·본문에 들어가고, 산출 폴더 이름에도 씁니다.
  from_boq: 공사명
- id: 2-1
  key: 발주자
  type: text
  text: 발주자 이름은?
  help: 계약서의 발주자(기관·회사) 이름. 4.1 공사개요와 본문에 들어갑니다.
  optional: true
  from_boq: 발주자
- id: '2'
  key: 발주자_구분
  type: choice
  text: 발주자가 국가·지자체·공공기관(공기업·지방공사 등)인가요?
  help: 「건설기술 진흥법」 제2조제6호 '발주청'. 아니면 계획서 사본을 인·허가기관에 내는 절차가 붙습니다(법 제55조제1항 후단). 내역서의 지급/사급(자재 공급)과는 다른 뜻입니다.
  choices:
  - value: 발주청
    label: 예 — 발주청(국가·지자체·공공기관)
  - value: 민간
    label: 아니오 — 민간 발주자
  - value: 모름
    label: 모름
  from_boq: 발주자_구분
- id: 2-2
  key: 발주처기준
  type: yesno
  text: LH 발주 현장으로 보입니다. LH 시험기준(LHCS 10 40 00 부록)도 넣을까요?
  help: 켜면 plan 에 --owner LH 가 붙어 LH 전용 자재 규칙이 적용됩니다.
  when: owner_is_lh
  default: 예
- id: '3'
  key: 공사종류
  type: choice
  text: 어떤 공사인가요?
  help: 시행령 제89조제2항은 공사 종류별로 품질시험계획 대상 기준이 다릅니다(토목 5억·건축 660㎡·전문 2억). 조경식재·철거는 수립하지 않을 수 있습니다(시행규칙 제49조).
  choices:
  - value: 건축
    label: 건축
  - value: 토목
    label: 토목
  - value: 건축+토목
    label: 건축+토목
  - value: 전문
    label: 전문공사
  - value: 조경식재
    label: 조경식재 공사만
  - value: 철거
    label: 철거 공사만
  from_boq: 공사종류
- id: 3-1
  key: KS_인증
  type: choice
  text: 철근 등 주요 자재를 KS 인증 제품으로 받나요?
  help: 별표2 ※주석 — 종별 괄호 안 KS 규격의 인증 제품은 시행령 제91조제1항 시험을 하지 않아도 됩니다(KS 칸 ◎, 철근은 제조회사·규격별 1회). 비KS 가 섞이면 철근 50톤마다 등 별표2 빈도로 외부 시험을 적습니다. 모르면 KS 로 계산하고 확인할 것에 남깁니다.
  when: ks_materials
  choices:
  - value: 예
    label: 예 — KS 인증품
  - value: 아니오
    label: 아니오 — 비KS 포함
  - value: 모름
    label: 모름(확인 전)
  default: 모름
- id: 4-1
  key: 총공사비_억원
  type: number
  text: 총공사비는 몇 억원인가요? (관급자재 포함·보상비 제외. 모르면 -)
  help: 시행령 제89조제1항제1호의 총공사비는 도급자가 설치하는 관급자재비를 포함하고 토지 등 보상비는 뺍니다. 내역서 도급액에는 관급자재가 빠져 있을 수 있습니다.
  optional: true
  from_boq: 총공사비_억원
- id: 4-2
  key: 연면적
  type: number
  text: 연면적은 몇 ㎡인가요? (모르면 -)
  help: 다중이용 건축물 3만㎡(품질관리계획)·5만㎡(특급), 건축공사 660㎡(품질시험계획) 기준에 씁니다.
  optional: true
  unit: ㎡
- id: 4-3
  key: 지상층수
  type: number
  text: 지상 최고 층수는? (모르면 -)
  help: '「건축법 시행령」 제2조제17호: 16층 이상 건축물은 용도와 관계없이 다중이용 건축물입니다.'
  optional: true
- id: 5-1
  key: 건설사업관리_대상
  type: choice
  text: 감독 권한대행 등 건설사업관리 대상 공사인가요?
  help: '시행령 제89조제1항제1호: 건설사업관리 대상이면서 총공사비 500억원 이상이면 품질관리계획 대상입니다.'
  when: decides
  choices:
  - value: 예
    label: 예
  - value: 아니오
    label: 아니오
  - value: 모름
    label: 모름
- id: 5-2
  key: 계약_품질관리계획
  type: choice
  text: 계약서(또는 설계도서)에 '품질관리계획 수립' 조항이 있나요?
  help: '시행령 제89조제1항제3호: 계약에 정해져 있으면 규모와 관계없이 품질관리계획 대상입니다. 조경식재·철거도 설계도서가 정하면 수립합니다.'
  when: decides
  choices:
  - value: 예
    label: 예
  - value: 아니오
    label: 아니오
  - value: 모름
    label: 모름
- id: 5-3
  key: 주용도
  type: choice
  text: 주 용도가 다음 중 하나인가요?
  help: '「건축법 시행령」 제2조제17호가목: 이 용도들의 바닥면적 합계가 5천㎡ 이상이면 다중이용 건축물입니다.'
  when: decides
  decide_values:
  - 공동주택
  - 판매
  choices:
  - value: 공동주택
    label: 해당 없음(공동주택 등)
  - value: 판매
    label: 판매시설
  - value: 문화집회
    label: 문화 및 집회시설(동·식물원 제외)
  - value: 종교
    label: 종교시설
  - value: 여객운수
    label: 여객용 운수시설
  - value: 종합병원
    label: 종합병원
  - value: 관광숙박
    label: 관광숙박시설
  - value: 모름
    label: 모름
- id: '7'
  key: 로고
  type: file
  text: 회사 로고 이미지(PNG·JPEG)가 있나요? 표지와 모든 쪽 머리 왼쪽 칸에 넣습니다. (번호 또는 끌어다 놓기, 없으면 Enter)
  help: 비율을 지켜 칸 안에 맞춰 줄입니다(투명 PNG 그대로). 파일은 복사하지 않고 경로만 적습니다.
  exts:
  - .png
  - .jpg
  - .jpeg
  optional: true
- id: 6-4
  key: 시공자
  type: text
  text: 시공사(우리 회사) 이름은? 표지와 쪽 머리 로고 칸 아래에 씁니다. (없으면 Enter)
  help: 표지·쪽 머리의 회사명 칸과 4.1 공사개요 시공자에 들어갑니다.
  optional: true
- id: '6'
  key: 사람_회사_지금
  type: choice
  text: 공사 위치·기간, 현장대리인·품질관리자, 증빙 파일을 지금 적을까요?
  help: 나중에 고르면 이 칸들은 '(작성 필요)'로 두고, 산출 폴더의 project.yaml 에서 적은 뒤 plan 을 다시 돌리면 됩니다.
  choices:
  - value: 지금
    label: 지금 적기(6개 안팎)
  - value: 나중에
    label: 나중에 — project.yaml 에서
  default: 나중에
- id: 6-2
  key: 공사위치
  when: fill_now
  type: text
  text: 공사 위치는?
  optional: true
- id: 6-3
  key: 공사기간
  when: fill_now
  type: text
  text: '공사 기간은? (예: 착공일로부터 30개월)'
  optional: true
- id: 6-5
  key: 현장대리인
  when: fill_now
  type: text
  text: 현장대리인 이름은?
  optional: true
- id: 6-6
  key: 품질관리자
  when: fill_now
  type: text
  text: 품질관리자 이름은?
  optional: true
- id: 6-7
  key: 품질관리자_등급
  when: fill_now
  type: choice
  text: 품질관리자 등급은?
  choices:
  - value: 특급
    label: 특급
  - value: 고급
    label: 고급
  - value: 중급
    label: 중급
  - value: 초급
    label: 초급
  default_from: judged_grade
  optional: true
- id: '8'
  key: 첨부
  when: fill_now
  type: files
  text: 품질관리자 자격증·경력증명서 파일이 있으면 하나씩 끌어다 놓으세요(끝나면 Enter).
  help: 지금은 목록만 남깁니다(계획서에 이미지로 넣지 않음). 파일 이름·경로는 화면·요약에 쓰지 않고 개수만 씁니다. 주민등록번호 뒷자리를 가렸는지 확인하세요.
  exts:
  - .pdf
  - .png
  - .jpg
  - .jpeg
  optional: true

# 계획서를 한 번 만든 뒤 묻는 '현장 확인'(L7-I2, 엔진 L7-E7 과 짝).
# 요약의 ask 목록(규칙 밖 행·설치 행에만 있음)을 하나씩 묻고 답을 project.yaml `현장_확인: {key: 예|아니오}` 에 저장한다.
# 넣기(예)·빼기(아니오)가 하나라도 있으면 계획서를 다시 만든다. 나중에(모름)는 저장하지 않는다(다음에 다시 물음).
site_check:
  intro: "계획서를 만들었습니다. 현장마다 달라 도구가 정할 수 없는 내역이 {n}건 있습니다. 하나씩 물을게요."
  question:
    rule_miss: "‘{label}’로 보이는 내역 {lines}행(예: {examples})이 있습니다. {label} 시험 대상으로 넣을까요?"
    install_only: "‘{label}’ 설치 내역 {lines}행(예: {examples})이 자재 행 없이 있습니다. 자재를 포함한 시공으로 보고 {label} 시험 대상으로 넣을까요?"
    name_unknown: "‘{label}’은 품명으로 무슨 자재인지 알 수 없습니다(규격에 ‘{spec_word}’, 내역 {lines}행)."
  # 품명으로 자재를 알 수 없는 행(엔진 L7-E8, kind name_unknown): 답은 현장_확인 {"name:<품명>": <종별 key>|예|아니오}
  name_unknown_choices: {예: "시험 대상 자재(발주처 기준 필요)", 아니오: "자재 아님", 나중에: "나중에"}
  help: "넣기 = 이 내역을 {rule} 규칙으로 8.11 에 넣음(비고 '현장 확인으로 포함'). 빼기 = 넣지 않고 경고에서도 뺌. 나중에 = 지금은 두고 경고로 남김."
  choices:
    - {value: 예, label: 넣기}
    - {value: 아니오, label: 빼기}
    - {value: 나중에, label: "나중에(모름)"}
  default: 나중에
  many: 8                               # 이보다 많으면 묶음마다 먼저 "하나씩 / 모두 나중에"를 묻는다
  group: "{group} 쪽 {n}건 — 하나씩 물을까요, 모두 나중에 할까요?"
  group_choices:
    - {value: each, label: 하나씩 묻기}
    - {value: later, label: 모두 나중에}
  group_names: {rule_miss: "규칙에 걸리지 않은 내역", install_only: "설치 행에만 있는 내역", name_unknown: "품명으로 자재를 알 수 없는 내역"}
  rerun: "답을 반영해 계획서를 다시 만듭니다."
  later_left: "현장 확인을 나중에로 남긴 내역 {n}건 — 다시 `danburn start` 하거나 project.yaml `현장_확인` 에 key: 예/아니오 를 적고 plan 을 다시 돌리세요."
