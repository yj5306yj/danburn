            indent: false

      - id: "8.12"
        title: "부적합 공사의 관리"
        basis: "별표1 8.12"
        purpose: "품질기준에 맞지 않는 자재의 사용, 후속 공정 진행, 인계를 막는다."
        steps:
          - "부적합 공사를 특성에 따라 식별하고 상태를 기록한다."
          - "부적합을 검토·분석하여 원인을 정하고, 유사 부적합이 있거나 생길 수 있는지 확인한다."
          - "현상 사용, 보완 시공, 재시공 등 조치를 정하여 실행한다. 처리 방안은 공사감독자 등의 승인을 받는다."
          - "보완 시공과 재시공 후 품질 요구사항에 따라 다시 검사한다."
          - "취한 조치의 효과성을 검토한다."
        records: ["부적합 보고서", "시정조치 요구·결과서"]
        roles:
          - {task: "부적합 식별·기록", marks: {품질: "○", 공사: "○"}}
          - {task: "검토·원인 분석", marks: {품질: "○", 공사: "◎"}}
          - {task: "조치 결정·승인 요청", marks: {공사: "○", 품질: "◎", 현장대리인: "●"}}
          - {task: "불량 자재 반품·폐기 확인", marks: {품질: "○", 공사: "○", 공무: "◎"}}
          - {task: "재검사·효과성 검토", marks: {품질: "○", 현장대리인: "●"}}
        flow:
          - stage: "식별"
            content:
              - "• 부적합 공사를 발견한 사람은 품질관리자에게 알리고, 품질관리자는 부적합 특성에 맞게 식별 표시한다."
            basis: ["별표1 8.12", "8.8"]
          - stage: "상태 기록"
            content:
              - "• 부적합의 내용·위치·수량·발견일을 조치표에 적는다."
            basis: ["별표1 8.12", "양식:nonconformity_action"]
          - stage: "검토·원인 결정"
            content:
              - "• 부적합을 검토·분석하여 원인을 정한다."
              - "• 비슷한 부적합이 이미 있거나 생길 수 있는지 확인한다."
            basis: ["별표1 8.12"]
          - stage: "조치 결정·승인"
            content:
              - "• 현상 사용, 보완 시공, 재시공 등 조치를 정한다."
              - "• 처리 방안은 공사감독자 또는 건설사업관리기술인 등 권한 있는 자의 승인을 받는다."
              - "- 불량 자재로 시공된 부위는 재시공을 원칙으로 한다."
            basis: ["별표1 8.12", "업무지침 제41조"]
          - stage: "불량 자재 처리"
            content:
              - "• 불량 자재는 곧바로 반품하고, 반출 때 반출증으로 품명·수량을 확인한다."
              - "• 다른 현장에서 쓰이지 않도록 생산자에게 폐기 확약서를 받아 준공 때까지 보관한다."
            basis: ["업무지침 제41조", "양식:disposal_pledge", "양식:carry_out_slip"]
          - stage: "재검사"
            content:
              - "• 보완 시공이나 재시공 뒤 품질 요구사항에 따라 다시 검사한다."
            basis: ["별표1 8.12", "8.11"]
          - stage: "효과성 검토"
            content:
              - "• 취한 조치의 효과성을 검토하고, 재발 방지가 필요하면 10.1로 넘긴다."
            basis: ["별표1 8.12", "10.1"]
        forms:
          - key: "nonconformity_action"
            title: "부적합 공사 조치표"
            header: ["공사명"]
            columns: ["번호", "발견일", "공종·부위(자재)", "부적합 내용", "원인", "조치 구분", "조치 내용", "승인자", "재검사 결과", "완료일"]
            widths: [5, 8, 13, 17, 12, 9, 15, 7, 8, 6]
            approval: true
            rows: 0
          - key: "disposal_pledge"
            title: "불량자재 폐기 확약서"
            header: ["공사명", "생산자", "품명·규격"]
            columns: ["번호", "반입일", "차량번호", "수량", "불량 사유", "폐기 방법", "폐기 예정일", "확인"]
            widths: [6, 10, 12, 9, 23, 18, 11, 11]
            approval: false
            rows: 0
          - key: "carry_out_slip"
            title: "반출증"
            header: ["공사명", "반출일"]
            columns: ["번호", "품명", "규격", "수량", "반출 사유", "차량번호", "반출처", "확인"]
            widths: [6, 16, 14, 8, 20, 12, 14, 10]
            approval: true
            rows: 0

      - id: "8.13"
        title: "공사준공 및 인계"
        basis: "별표1 8.13"
        purpose: "완공을 입증하는 기록을 갖추어 준공검사를 받고 시설물과 함께 인계한다."
        steps:
          - "필요하면 시운전 계획과 절차를 세운다."
          - "준공검사를 신청하고, 부적합 공사가 있으면 처리한다."
          - "준공도면을 검토하여 제출하고, 준공 표지를 설치한다."
          - "시설물 인계 계획을 세우고, 본사로 넘길 기록과 발주자·공사감독자 등에게 넘길 기록을 파악하여 인계한다."
        records: ["준공 서류 목록", "인계인수서"]
        roles:
          - {task: "시운전 계획", marks: {공사: "○", 품질: "◎"}}
          - {task: "준공검사 신청", marks: {공무: "○", 품질: "◎", 현장대리인: "●"}}
          - {task: "준공도면 검토·제출", marks: {공사: "○", 공무: "◎"}}
          - {task: "시설물 인계 계획", marks: {공무: "○", 공사: "◎", 현장대리인: "●"}}
          - {task: "문서·기록 인계", marks: {공무: "○", 품질: "○", 현장대리인: "●"}}
        flow:
          - stage: "준공 준비"
            content:
              - "• 필요하면 시운전 계획과 절차를 세워 시행한다."
              - "• 완공을 입증하는 데 필요한 문서화된 정보(검사·시험 기록 등)를 파악하여 확보한다."
            basis: ["별표1 8.13"]
          - stage: "준공검사 신청"
            content:
              - "• 공무 담당은 준공검사를 신청하고, 부적합 공사가 있으면 8.12에 따라 처리한다."
            basis: ["별표1 8.13", "8.12"]
          - stage: "준공도면·표지"
            content:
              - "• 준공도면을 검토하여 제출하고, 준공 표지를 설치한다."
            basis: ["별표1 8.13", "8.6"]
          - stage: "인계 계획"
            content:
              - "• 시설물 인계 계획을 세워 발주자와 협의한다."
            basis: ["별표1 8.13"]
          - stage: "문서·기록 인계"
            content:
              - "• 본사로 넘길 현장 문서·기록과 발주자·건설사업관리기술인에게 넘길 문서·기록을 파악하여 인계 목록으로 인계한다."
              - "- 자재공급원 승인 관련 서류, 자재 시공품질관리 점검표, 자재 품질시험·검사대장을 넘길지는 발주청과 협의한다."
            basis: ["별표1 8.13", "업무지침 제40조", "양식:handover_list"]
        forms:
          - key: "handover_list"
            title: "인계 문서 목록"
            header: ["공사명", "인계일"]
            columns: ["번호", "문서·기록명", "수량(권·파일)", "인계처(발주자·본사)", "인계일", "인수자 확인", "비고"]
            widths: [7, 33, 11, 15, 11, 13, 10]
            approval: true
            rows: 0

  - id: "9"
    title: "성과관리"
    basis: "별표1 9."
    sections:
      - id: "9.1"
        title: "고객만족"
        basis: "별표1 9.1"
        purpose: "발주자와 이해관계자의 요구·기대가 얼마나 충족되었는지 파악한다."
        steps:
          - "회의·설문·피드백·칭찬·불만 등으로 정보를 모은다."
          - "모은 정보를 검토하여 6.2 품질목표와 9.4 경영검토에 반영한다."
        records: ["고객 의견 기록"]
        roles:
          - {task: "정보 수집 방법 결정", marks: {품질: "○", 현장대리인: "●"}}
          - {task: "의견·만족도 수집", marks: {품질: "○", 공무: "○", 공사: "◎"}}
          - {task: "검토·반영", marks: {품질: "○", 현장대리인: "●"}}
        flow:
          - stage: "수집 방법 결정"
            content:
              - "• 품질관리자는 발주자와 이해관계자의 요구·기대가 충족된 정도를 파악할 방법과 시기를 정한다."
              - "- 설문조사, 회의 의견, 피드백, 칭찬, 불만·클레임"
            basis: ["별표1 9.1"]
          - stage: "정보 수집"
            content:
              - "• 정기 회의·공문·민원 기록과 만족도 설문으로 정보를 모은다."
            basis: ["양식:satisfaction_survey", "7.5"]
          - stage: "검토·분석"
            content:
              - "• 모은 정보를 검토하여 개선이 필요한 사항을 정한다."
            basis: ["별표1 9.1", "9.2"]
          - stage: "반영"
            content:
              - "• 결과를 품질목표, 경영검토, 지속적 개선에 반영한다."
            basis: ["6.2", "9.4", "10.2"]
        forms:
          - key: "satisfaction_survey"
            title: "만족도 설문지"
            header: ["공사명", "조사일", "응답 기관"]
            columns: ["번호", "평가 항목", "매우 만족", "만족", "보통", "불만족", "매우 불만족", "의견"]
            widths: [6, 30, 8, 8, 8, 8, 8, 24]
            groups:                          # 2단 머리(묶음 판단: 이 저장소, 정본 모양 아님)
              - {title: "만족도(해당 칸에 ○)", span: 5, start: 2}
            approval: false
            rows: 12                 # 평가 항목 수만큼(현장에서 항목을 정해 채움)

      - id: "9.2"
        title: "분석 및 평가"
        basis: "별표1 9.2"
        purpose: "품질관리계획의 적절성과 효과성을 보이고 개선하기 위한 자료를 분석·평가한다."
        steps:
          - "발주자와 이해관계자의 만족도 조사 결과를 분석한다."
          - "주요 자재의 시험 결과로 품질 경향을 본다."
          - "부적합 공사의 발생 빈도와 특성을 분석한다."
          - "내부심사와 품질관리 적절성 확인 결과를 정리한다."
        records: ["분석 및 평가 보고서"]
        roles:
          - {task: "분석 데이터 선정", marks: {품질: "○", 현장대리인: "●"}}
          - {task: "데이터 수집·분석", marks: {품질: "○", 공사: "◎", 공무: "◎"}}
          - {task: "결과 보고·활용", marks: {품질: "○", 현장대리인: "●"}}
        flow:
          - stage: "데이터 선정"
            content:
              - "• 품질관리자는 분석할 데이터와 주기를 정한다."
              - "- 발주자·이해관계자 만족도 조사 결과"
              - "- 주요 자재의 품질 경향"
              - "- 부적합 공사의 발생 빈도와 특성"
              - "- 내부심사와 품질관리 적절성 확인 등의 결과"
            basis: ["별표1 9.2"]
          - stage: "수집·정리"
            content:
              - "• 품질검사 실시대장, 부적합 공사 조치표, 심사 보고서 등에서 데이터를 모아 정리한다."
            basis: ["양식:test_ledger", "양식:nonconformity_action"]
          - stage: "분석·평가"
            content:
              - "• 추이와 합격률 등으로 분석하여 품질관리계획의 적절성과 효과성을 평가한다."
            basis: ["양식:analysis_table"]
          - stage: "보고·활용"
            content:
              - "• 결과를 현장대리인에게 보고하고 경영검토와 지속적 개선의 입력으로 쓴다."
            basis: ["9.4", "10.2"]
        forms:
          - key: "analysis_table"
            title: "데이터 분석표"
            header: ["공사명", "분석 기간"]
            columns: ["번호", "분석 항목", "데이터 출처", "분석 결과", "평가", "개선 필요 사항", "비고"]
            widths: [6, 16, 15, 22, 12, 21, 8]
            approval: true
            rows: 0
        tables:
          - key: "analysis_items"
            title: "데이터 분석 항목과 방법"
            columns: ["분석 항목", "데이터", "분석 방법", "주기", "담당"]
            widths: [20, 26, 28, 12, 14]
            rows:
              - ["발주자·이해관계자 만족도", "만족도 설문지, 회의 의견, 민원 처리 일지", "항목별 평균과 추이, 불만 유형 분류", "반기", "품질관리자"]
              - ["주요 자재 품질 경향", "품질검사 실시대장, 시험성적서", "종목별 결과 추이, 기준 대비 여유, 합격률", "월", "품질관리자"]
              - ["부적합 공사", "부적합 공사 조치표, 시정조치 관리대장", "공종·원인별 발생 빈도와 재발 여부", "월", "품질관리자"]
              - ["내부심사·적절성 확인", "내부심사 결과 보고서, 외부 점검 결과", "지적 건수·유형, 시정 완료율", "심사·점검 때", "품질관리자"]
              - ["품질목표", "품질목표 추진계획 및 실적", "목표 대비 달성도", "목표별 확인 주기", "책임자"]
            indent: false

      - id: "9.3"
        title: "내부심사"
        basis: "별표1 9.3"
        purpose: "품질관리계획의 적합성·이행성·효과성을 연 1회 이상 현장 스스로 심사한다."
        steps:
          - "심사 주기·범위·기준과 자격을 갖춘 심사자를 정한 심사 계획을 세운다."
          - "심사를 수행하고 결과를 보고한다."
          - "필요하면 부적합 사항에 대한 시정조치를 한다."
          - "후속 조치를 검증하고 결과를 보고한다."
        records: ["내부심사 계획서", "내부심사 보고서"]
        roles:
          - {task: "심사 계획 수립·심사자 선정", marks: {품질: "○", 현장대리인: "●"}}
          - {task: "심사 수행·결과 보고", marks: {품질: "○", 공사: "◎", 공무: "◎", 안전: "◎"}}
          - {task: "시정조치", marks: {공사: "○", 공무: "○", 안전: "○", 품질: "◎"}}
          - {task: "후속 조치 검증", marks: {품질: "○", 현장대리인: "●"}}
        flow:
          - stage: "심사 계획"
            content:
              - "• 품질관리자는 연 1회 이상 현장 내부심사 계획을 세운다."
              - "- 심사 주기·범위·기준과, 역량을 갖추고 심사 대상 업무를 맡지 않은 심사자를 정한다."
            basis: ["별표1 9.3", "양식:audit_plan"]
          - stage: "심사 수행"
            content:
              - "• 심사자는 계획에 따라 문서와 현장을 확인하여 품질관리계획의 적합성·이행성·효과성을 판단한다."
            basis: ["별표1 9.3"]
          - stage: "결과 보고"
            content:
              - "• 심사 결과를 보고서로 작성하여 현장대리인에게 보고한다."
            basis: ["양식:audit_report"]
          - stage: "시정조치"
            content:
              - "• 필요하면 부적합 사항을 해당 팀이 10.1에 따라 시정조치한다."
            basis: ["별표1 9.3", "10.1"]
          - stage: "후속 검증"
            content:
              - "• 품질관리자는 시정조치 결과를 검증하고 그 결과를 보고한다."
            basis: ["별표1 9.3", "양식:audit_report"]
        forms:
          - key: "audit_plan"
            title: "내부심사 계획서"
            header: ["공사명", "심사 기간"]
            columns: ["번호", "심사 대상(절·팀)", "심사 기준", "예정 일자", "심사자", "비고"]
            widths: [7, 25, 28, 13, 15, 12]
            approval: true
            rows: 0
          - key: "audit_report"
            title: "내부심사 결과 보고서"
            header: ["공사명", "심사일", "심사자", "심사 범위"]
            columns: ["번호", "심사 대상(절)", "확인 내용", "판정(적합·부적합·관찰)", "지적 사항", "시정 담당", "시정 기한", "검증 결과"]
            widths: [6, 12, 22, 12, 18, 9, 9, 12]
            approval: true
            rows: 0

      - id: "9.4"
        title: "경영검토"
        basis: "별표1 9.4"
        purpose: "연 1회 이상 현장 운영 성과를 검토하여 개선 사항을 정하고 조치한다."
        steps:
          - "입력: 전년도 검토 조치 결과, 내·외부 이슈 변화, 자원의 충족성, 리스크 조치의 효과성, 문제점과 애로사항."
          - "입력: 고객 만족과 피드백, 품질목표 달성 정도, 부적합과 시정조치, 검사·시험 결과, 내·외부 점검 결과, 외부 공급자 성과."
          - "검토 결과에 따른 후속 조치 방법을 정한다."
        records: ["경영검토 회의록"]
        roles:
          - {task: "검토 시기 결정", marks: {현장대리인: "●", 품질: "○"}}
          - {task: "입력 자료 준비", marks: {품질: "○", 공사: "○", 공무: "○", 안전: "○"}}
          - {task: "경영검토 회의", marks: {현장대리인: "●", 품질: "○", 공사: "◎", 공무: "◎", 안전: "◎"}}
          - {task: "후속 조치 실행·확인", marks: {품질: "○", 공사: "○", 공무: "○", 안전: "○"}}
        flow:
          - stage: "시기 결정"
            content:
              - "• 현장대리인은 연 1회 이상 현장 운영성과를 자체 검토할 시기를 정한다."
            basis: ["별표1 9.4"]
          - stage: "입력 자료 준비"
            content:
              - "• 품질관리자는 다음 자료를 모은다."
              - "- 이전 검토의 조치 결과, 내·외부 이슈의 변화, 자원의 충족성, 리스크 조치의 효과성, 문제점과 애로사항"
              - "- 고객 만족과 피드백(불만 포함), 품질목표 달성 정도, 부적합과 시정조치, 검사·시험 결과"
              - "- 내부심사·품질관리 적절성 확인 등 내·외부 점검 결과, 외부 공급자의 성과"
            basis: ["별표1 9.4"]
          - stage: "검토 회의"
            content:
              - "• 현장대리인 주재로 검토하여 개선 사항과 필요한 자원을 결정하고 회의록을 남긴다."
            basis: ["양식:management_review", "양식:meeting_minutes"]
          - stage: "후속 조치"
            content:
              - "• 결정 사항의 담당과 기한을 정하여 실행하고, 필요하면 6.3에 따라 계획서를 변경한다."
            basis: ["별표1 9.4", "6.3", "10.2"]
        forms:
          - key: "management_review"
            title: "경영검토 결과서"
            header: ["공사명", "검토일"]
            columns: ["번호", "검토 항목", "검토 내용", "결정 사항", "조치 담당", "기한", "조치 결과"]
            widths: [6, 17, 25, 20, 10, 9, 13]
            approval: true
            rows: 0

  - id: "10"
    title: "개선"
    basis: "별표1 10."
    sections:
      - id: "10.1"
        title: "부적합 및 시정조치"
        basis: "별표1 10.1"
        purpose: "근본 원인을 없애야 하는 부적합이나 잠재적 부적합에 대해 재발 방지 조치를 한다."
        steps:
          - "부적합 공사, 발주자와 이해관계자의 불만 등을 검토·분석하고 원인을 정한다."
          - "유사 부적합이 있거나 생길 수 있는지 확인한다."
          - "필요한 조치를 정하여 실행하고, 효과성을 검토한다."
          - "필요하면 리스크와 기회 목록(6.1)과 본 계획서(6.3)를 갱신한다."
        records: ["시정조치 요구·결과서"]
        roles:
          - {task: "부적합·불만 검토·분석", marks: {품질: "○", 공사: "◎", 공무: "◎"}}
          - {task: "근본 원인 결정", marks: {품질: "○", 공사: "◎"}}
          - {task: "시정조치 결정·실행", marks: {공사: "○", 공무: "○", 안전: "○", 현장대리인: "●"}}
          - {task: "효과성 검토", marks: {품질: "○", 현장대리인: "●"}}
          - {task: "리스크 목록·계획 갱신", marks: {품질: "○", 현장대리인: "●"}}
        flow:
          - stage: "발생·접수"
            content:
              - "• 운영성과 검토에서 근본 원인을 없애야 할 부적합이나 잠재적 부적합을 찾으면 시정조치 대상으로 접수한다."
              - "- 부적합 공사, 발주자·이해관계자의 불만, 심사·점검 지적 등"
            basis: ["별표1 10.1"]
          - stage: "검토·원인 결정"
            content:
              - "• 품질관리자는 부적합을 검토·분석하여 원인을 정하고, 비슷한 부적합이 있거나 생길 수 있는지 확인한다."
            basis: ["별표1 10.1"]
          - stage: "조치 결정·실행"
            content:
              - "• 재발을 막는 데 필요한 조치를 정하고 담당 팀이 기한 안에 실행한다."
            basis: ["별표1 10.1", "양식:corrective_action"]
          - stage: "효과성 검토"
            content:
              - "• 기한이 지나면 조치 결과를 확인하고, 효과가 없으면 조치를 다시 정한다."
            basis: ["별표1 10.1"]
          - stage: "갱신"
            content:
              - "• 필요하면 리스크 및 기회 관리대장과 품질관리계획을 갱신한다."
            basis: ["별표1 10.1", "6.1", "6.3"]
        forms:
          - key: "corrective_action"
            title: "시정조치 관리대장"
            header: ["공사명"]
            columns: ["번호", "발행일", "출처(부적합·불만·심사)", "내용", "원인", "조치 내용", "담당", "기한", "완료일", "효과성 확인"]
            widths: [5, 8, 12, 17, 13, 17, 7, 7, 7, 7]
            approval: true
            rows: 0

      - id: "10.2"
        title: "지속적 개선"
        basis: "별표1 10.2"
        purpose: "품질관리계획의 적절성·충족성·효과성을 지속적으로 개선한다."
        steps:
          - "9.2 분석 및 평가 결과와 9.4 경영검토 결과를 바탕으로 개선 과제를 정한다."
          - "개선 과제의 담당과 기한을 정하여 실행하고 결과를 확인한다."
        records: ["개선 과제 관리 기록"]
        roles:
          - {task: "개선 입력 검토", marks: {품질: "○", 현장대리인: "◎"}}
          - {task: "개선 과제 결정", marks: {현장대리인: "●", 품질: "○"}}
          - {task: "과제 실행", marks: {공사: "○", 공무: "○", 안전: "○", 품질: "○"}}
          - {task: "결과 확인·반영", marks: {품질: "○", 현장대리인: "●"}}
        flow:
          - stage: "입력 검토"
            content:
              - "• 품질관리자는 분석 및 평가의 결과와 경영검토 결과를 검토하여 개선할 요구 또는 기회를 찾는다."
            basis: ["별표1 10.2", "9.2", "9.4"]
          - stage: "과제 결정"
            content:
              - "• 개선 과제를 정하고 담당과 기한을 정하여 관리대장에 적는다."
            basis: ["양식:improvement_register"]
          - stage: "실행"
            content:
              - "• 담당 팀이 과제를 실행하고 진행 상황을 대장에 적는다."
            basis: ["양식:improvement_register"]
          - stage: "결과 확인·반영"
            content:
              - "• 결과를 확인하여 효과가 있으면 절차와 계획서에 반영(6.3)하고 지식으로 등록(7.3)한다."
            basis: ["6.3", "7.3"]
        forms:
          - key: "improvement_register"
            title: "지속적 개선 관리대장"
            header: ["공사명"]
