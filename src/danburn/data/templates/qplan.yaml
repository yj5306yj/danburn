# 품질관리계획서 본문 템플릿 — 장·절 순서는 「건설공사 품질관리 업무지침」 별표1
# "품질관리계획서 작성기준(제7조제1항 관련)"을 따른다(현행 국토교통부고시 제2026-360호, 2026-07-08 시행).
# 별표1 내용은 제2022-30호 이후 바뀌지 않았다(2024-638호에서 줄바꿈·오탈자만 정비, 2025-311호·2026-360호 변경 없음)
#   — 근거: docs/research/2026-09-26-8.11-현행기준-딥리서치.md §1 [1차].
# 절 제목은 별표1 표기를 따른다. 별표1 표 칸에서 줄이 꺾여 띄어쓰기를 알 수 없는 제목은 같은 고시의
#   별지 「품질관리계획서 검토·승인서」 검토항목 표기로 정했다(예: "이해관계자의 요구와 기대관리", "조직의 지식관리").
# 문장은 별표1이 요구하는 내용을 이 저장소가 직접 풀어 쓴 것이다(타사 계획서 문장 아님).
#
# 절 항목: id·title·basis(별표1 항목 번호) + purpose(목적) · scope(적용범위, 생략 시 공통 문장)
#          · body_label·body(자유 문단 목록) · steps(업무 절차, 번호 목록) · records(관련 기록)
#          · body_after(8.11 절에만: {8.11} 표지)
#          · roles(업무 분장표) · flow(업무 흐름표) · forms(기록 양식) — 형식은 .cache/contracts/L7-schema.md (L7)
#            흐름표·분장표·양식의 문장과 열 이름은 별표1 각 절 요건과 「건설기술 진흥법」·「건설공사 품질관리 업무지침」
#            조문에서 이 저장소가 새로 쓴 것이다. 새 필드에는 {자리표시}를 쓰지 않는다.
#          · tables(부표, 2차 확장 L7-C2) — 기준 값은 법령 원문(시행령·시행규칙·업무지침, law.go.kr DRF 2026-09-26 확인)과
#            일반 실무에서 새로 정한 것이다. source: "project.<키>" 는 project 목록으로 행을 채운다.
#            flow.basis 의 "양식:<key>" 는 렌더러가 "양식 N" 으로 바꾼다. 개인정보 첨부(경력증명서 등)는 양식으로 만들지 않는다.
# 자리표시: {키} 는 project 입력(project.example.yaml)이나 build_plan 인자로 채운다. 못 채우면 오류.
# 특수 표지(문단 하나를 통째로 차지):
#   {8.11}         — 8.11 품질시험계획표(엔진 산출, hwpx_out.add_811_tables)를 이 절 구역 안, 절차 문단 뒤에 넣는다(세로)
#   {표:공사개요}   — project 의 공사 정보 표
#   {표:조직}       — project.조직 목록(직무·성명·자격·담당업무) 표
#   {표:품질목표}   — project.품질목표 목록(목표·지표·주기·담당) 표

source: "「건설공사 품질관리 업무지침」 별표1 품질관리계획서 작성기준(제7조제1항 관련), 국토교통부고시 제2026-360호(2026-07-08)"
default_scope: "{공사명}의 계약 범위에 포함된 모든 공종과 이에 참여하는 시공자·하도급자의 업무에 적용한다."

# 업무 분장표 열(팀). project 입력 `팀:` 이 있으면 그것을 쓴다. marks 의 키는 아래 key 와 같다.
default_teams:
  - {key: 현장대리인, name: 현장대리인}
  - {key: 품질, name: 품질팀}
  - {key: 공사, name: 공사팀}
  - {key: 공무, name: 공무팀}
  - {key: 안전, name: 안전팀}

chapters:
  - id: "1"
    title: "일반사항"
    basis: "별표1 1."
    body:
      - "1) 본 계획서는 「건설기술 진흥법」 제55조제1항, 같은 법 시행령 제89조 및 「건설공사 품질관리 업무지침」 제7조에 따라 {공사명}의 품질관리 방법을 정한 문서이다."
      - "2) 본 계획서의 작성 대상 근거: {작성근거}"
      - "3) {승인절차_문장} 제정과 개정 현황은 앞쪽의 '승인 및 개정이력'에 기록한다."
      - "4) 본 계획서에 딸린 서식은 기록을 남기기 위한 예시이며, 필요한 항목을 빠뜨리지 않는 범위에서 현장 여건에 맞게 고쳐 쓸 수 있다."

  - id: "2"
    title: "적용범위 및 인용표준"
    basis: "별표1 2."
    body:
      - "2.1 적용범위"
      - "{공사명}({공사위치})의 품질과 관련된 계획·시공·검사·기록 업무 전부에 적용한다."
      - "현장 특성상 작성기준의 일부를 적용하지 않는 항목과 그 사유: {적용제외}"
      - "2.2 인용표준"
      - "1) 「건설기술 진흥법」, 같은 법 시행령 및 시행규칙"
      - "2) 「건설공사 품질관리 업무지침」(국토교통부 고시)"
      - "3) KS Q ISO 9001:2015 품질경영시스템 — 요구사항"
      - "4) KS Q ISO 9000:2015 품질경영시스템 — 기본사항과 용어"
      - "5) 계약문서에서 정한 공사시방서·전문시방서 및 관련 KS·KCS"

  - id: "3"
    title: "용어 정의"
    basis: "별표1 3."
    body:
      - "본 계획서의 용어는 「건설공사 품질관리 업무지침」 제2조와 KS Q ISO 9000:2015에서 정한 뜻을 따르며, 그 밖의 용어는 다음과 같이 쓴다."
      - "1) 현장: 본 공사를 수행하는 {시공자}의 공사 조직"
      - "2) 공사감독자 등: 발주자가 지정한 공사감독자 또는 건설사업관리기술인({건설사업관리자})"
      - "3) 부적합 공사: 설계도서·시방서·본 계획서에서 정한 품질기준을 충족하지 못한 공사 부위 또는 자재"
      - "4) 문서화된 정보: 현장이 관리·유지해야 하는 정보와 그 매체(종이·전자 파일)"

  - id: "4"
    title: "조직 상황"
    basis: "별표1 4."
    sections:
      - id: "4.1"
        title: "건설공사의 정보"
        basis: "별표1 4.1"
        purpose: "공사의 계약 일반현황을 한곳에 정리하여 품질관리 계획의 기초 자료로 삼는다."
        body_label: "공사 개요"
        body:
          - "{표:공사개요}"
        records: ["공사계약서", "설계도서·시방서", "공사 개요 표(본 절)"]
        roles:
          - {task: "공사 정보 수집·정리", marks: {공무: "○", 품질: "◎", 현장대리인: "●"}}
          - {task: "적용제외 항목 결정", marks: {품질: "○", 공무: "◎", 공사: "◎", 현장대리인: "●"}}
          - {task: "공사 정보 변경 반영", marks: {공무: "○", 품질: "◎", 현장대리인: "●"}}
        flow:
          - stage: "계약문서 접수"
            content:
              - "• 공무 담당은 계약서·설계도서·시방서·내역서 등 계약문서를 받아 목록으로 정리한다."
            basis: ["별표1 4.1", "7.6"]
          - stage: "공사 정보 정리"
            content:
              - "• 공무 담당은 공사명·공사금액·공사기간·공사위치·관련 주체·공종 현황·계약 특이사항을 공사개요 표로 정리한다."
              - "- 공구·블록이 나뉘는 공사는 구역별 값을 함께 적는다."
            basis: ["별표1 4.1"]
          - stage: "적용제외 검토"
            content:
              - "• 품질관리자는 현장 특성 때문에 작성기준의 일부를 적용할 수 없는 항목을 가려내고 그 사유를 구체적으로 적는다."
              - "(예: 시공자에게 설계 책임이 없는 공사의 8.3 설계관리)"
            basis: ["별표1 2."]
          - stage: "검토·확인 및 승인"
            content:
              - "• 현장대리인은 정리된 공사 정보를 확인하여 품질관리계획서에 반영한다."
              - "• 계획서는 다음 절차로 승인받는다."
              - "- {승인절차_문장}"
            basis: ["업무지침 제6조", "영 제90조"]
          - stage: "변경 반영"
            content:
              - "• 계약변경 등으로 공사 정보가 바뀌면 공무 담당이 공사개요를 고치고, 6.3에 따라 계획서를 개정한다."
            basis: ["6.3", "8.2"]

      - id: "4.2"
        title: "이해관계자의 요구와 기대관리"
        basis: "별표1 4.2"
        purpose: "공사에 영향을 주거나 받는 이해관계자와 그 요구사항을 파악하고 변화를 추적한다."
        steps:
          - "이해관계자 파악: 발주자, 공사감독자 등, 하도급자, 자재 공급원, 인근 주민, 관계 행정기관 등을 목록으로 만든다."
          - "요구사항 파악: 계약문서·인허가 조건·민원 기록에서 이해관계자별 요구사항을 뽑아 적는다."
          - "모니터링과 검토: 공정회의 때 목록을 다시 보고, 새 요구나 달라진 요구가 있으면 목록을 고치고 관련 조직에 알린다."
        records: ["이해관계자 요구사항 목록", "민원 처리 대장"]
        roles:
          - {task: "이해관계자 파악", marks: {품질: "○", 공사: "◎", 공무: "◎", 현장대리인: "●"}}
          - {task: "요구사항 파악·등록", marks: {품질: "○", 공사: "◎", 공무: "◎", 안전: "◎"}}
          - {task: "요구사항 이행", marks: {공사: "○", 공무: "○", 안전: "○", 품질: "◎"}}
          - {task: "모니터링·검토", marks: {품질: "○", 현장대리인: "●"}}
        flow:
          - stage: "이해관계자 파악"
            content:
              - "• 품질관리자는 공사에 영향을 주거나 받을 수 있는 사람과 조직을 파악한다."
              - "- 발주자, 공사감독자 또는 건설사업관리기술인, 하도급자, 자재 공급원, 인근 주민, 관계 행정기관 등"
            basis: ["별표1 4.2"]
          - stage: "요구사항 파악"
            content:
              - "• 각 팀은 계약문서·인허가 조건·회의록·민원 기록에서 이해관계자별 요구사항을 뽑는다."
              - "- 법적·규제적 요구사항과 계약상 요구사항을 구분하여 적는다."
            basis: ["별표1 4.2"]
          - stage: "관리대장 등록"
            content:
              - "• 품질관리자는 파악한 요구사항을 관리대장에 등록하고 요구사항마다 담당 팀을 정한다."
            basis: ["양식:stakeholder_register"]
          - stage: "이행"
            content:
              - "• 담당 팀은 요구사항을 공사 계획과 공정에 반영하고 이행 결과를 대장에 적는다."
              - "- 이행이 어려운 요구는 현장대리인에게 보고하고 해당 이해관계자와 협의한다."
            basis: ["7.5"]
          - stage: "모니터링·검토"
            content:
              - "• 품질관리자는 공정회의 등 정해진 때마다 대장을 검토하여 새로 생기거나 달라진 요구를 반영한다."
              - "• 검토 결과는 6.1 리스크 및 기회관리와 9.1 고객만족의 입력으로 쓴다."
            basis: ["별표1 4.2", "6.1", "9.1"]
        forms:
          - key: "stakeholder_register"
            title: "이해관계자 요구사항 관리대장"
            header: ["공사명"]
            columns: ["번호", "등록일", "이해관계자", "요구사항", "구분(법적·계약·기타)", "담당", "조치 결과", "확인일", "비고"]
            widths: [6, 10, 13, 25, 12, 8, 14, 7, 5]
            approval: true
            rows: 0

      - id: "4.3"
        title: "프로세스 관리"
        basis: "별표1 4.3"
        purpose: "공사 전반의 업무 흐름(프로세스)과 그 순서·상호작용을 정하고 운영한다."
        steps:
          - "착공 준비 → 자재 구매·검수 → 시공 → 검사·시험 → 부적합 처리 → 준공·인계의 순서로 프로세스 흐름도를 작성한다."
          - "프로세스마다 입력과 기대 출력, 운영 기준과 방법(성과 지표 포함)을 정한다."
          - "필요한 인원·장비·자재를 정하고 쓸 수 있도록 확보한다."
          - "프로세스별 책임자와 권한을 5.2 책임 및 권한에 따라 부여한다."
          - "6.1에서 파악한 리스크와 기회에 대한 조치를 프로세스에 반영한다."
          - "프로세스를 주기적으로 평가하고, 필요한 변경과 개선을 실행한다."
        records: ["프로세스 흐름도", "프로세스별 성과 지표 기록"]
        roles:
          - {task: "프로세스 파악·맵 작성", marks: {품질: "○", 공사: "◎", 공무: "◎", 현장대리인: "●"}}
          - {task: "입력·출력·운영 기준 결정", marks: {품질: "○", 공사: "◎", 공무: "◎", 안전: "◎"}}
          - {task: "자원 확보·책임 부여", marks: {공무: "○", 품질: "◎", 현장대리인: "●"}}
          - {task: "프로세스 평가·개선", marks: {품질: "○", 공사: "◎", 현장대리인: "●"}}
        flow:
          - stage: "프로세스 파악"
            content:
              - "• 품질관리자는 착공 준비부터 준공·인계까지 공사 전반의 프로세스를 파악한다."
              - "- 주 프로세스: 요구사항 검토, 구매, 시공, 검사·시험, 준공·인계"
              - "- 지원 프로세스: 자원, 역량·교육, 의사소통, 문서화된 정보"
            basis: ["별표1 4.3"]
          - stage: "순서·상호작용 결정"
            content:
              - "• 프로세스의 순서와 상호작용을 프로세스 맵으로 나타내고 등록대장에 올린다."
            basis: ["양식:process_register"]
          - stage: "입력·출력·기준 결정"
            content:
              - "• 프로세스마다 필요한 입력과 기대 출력을 정한다."
              - "• 효과적인 운영에 필요한 기준과 방법, 모니터링·측정 방법과 성과지표를 정한다."
            basis: ["별표1 4.3"]
          - stage: "자원·책임 부여"
            content:
              - "• 현장대리인은 프로세스별로 필요한 인원·장비·자재를 확보하고 책임자와 권한을 정한다."
            basis: ["5.2", "7.1"]
          - stage: "리스크 조치 반영"
            content:
              - "• 6.1에서 정한 리스크와 기회의 조치를 해당 프로세스의 운영 기준에 반영한다."
            basis: ["6.1"]
          - stage: "평가·변경·개선"
            content:
              - "• 품질관리자는 성과지표로 프로세스를 평가하고, 결과를 달성하는 데 필요한 변경을 실행한다."
              - "• 개선 사항은 10.2 지속적 개선에 따라 관리한다."
            basis: ["9.2", "10.2"]
        forms:
          - key: "process_register"
            title: "프로세스 등록대장"
            header: ["공사명"]
            columns: ["번호", "프로세스명", "구분(주·지원)", "입력", "출력", "운영 기준(관련 절)", "성과지표", "책임 팀", "비고"]
            widths: [6, 14, 9, 14, 14, 15, 13, 8, 7]
            approval: true
            rows: 0
        tables:
          - key: "process_relation"
            title: "건설공사 프로세스 관계표"
            columns: ["구분", "프로세스", "주요 입력", "주요 출력", "관련 절"]
            widths: [10, 20, 26, 28, 16]
            rows:
              - ["운영", "요구사항 검토·준비", "계약문서, 설계도서, 관계 법령", "설계도서 검토서, 인허가 이행계획", "8.1, 8.2"]
              - ["운영", "기자재 구매", "수급계획, 공급원 승인 조건", "발주서, 반입 기자재", "8.4, 8.9"]
              - ["운영", "하도급 관리", "하도급 발주계획", "하도급 계약, 제출 기록", "8.5"]
              - ["운영", "시공", "승인된 시공계획서·시공상세도", "시공 완료 부위, 시공 기록", "8.6, 8.7, 8.8, 8.10"]
              - ["운영", "검사·시험", "품질시험계획, 반입 자재, 시공 부위", "품질검사 실시대장, 시험성적서", "8.11"]
              - ["운영", "부적합 처리", "불합격 결과, 점검 지적", "조치 결과, 재검사 기록", "8.12, 10.1"]
              - ["운영", "준공·인계", "검사·시험 기록, 준공도면", "준공검사 결과, 인계 목록", "8.13"]
              - ["지원", "자원·역량", "공정계획, 법정 배치 기준", "인력·장비 배치, 교육 기록", "7.1, 7.2, 7.4"]
              - ["지원", "의사소통·문서", "요구사항, 공문, 회의 안건", "회의록, 문서 대장", "7.3, 7.5, 7.6"]
              - ["관리", "기획·성과·개선", "이슈, 리스크, 성과 데이터", "품질목표, 심사·검토 결과, 개선 과제", "6.1~6.3, 9.1~9.4, 10.2"]
            indent: false

  - id: "5"
    title: "리더십"
    basis: "별표1 5."
    sections:
      - id: "5.1"
        title: "품질방침"
        basis: "별표1 5.1"
        purpose: "현장 최고책임자가 공사의 목적과 발주자의 요구에 맞는 현장 품질방침을 정하고 알린다."
        body_label: "현장 품질방침"
        body:
          - "현장 품질방침: {품질방침}"
          - "위 방침은 법적·계약상 요구사항의 충족, 리스크와 기회의 처리, 필요한 자원의 지원과 구성원의 참여, 고객만족, 지속적 개선에 대한 현장의 의지를 담는다."
        steps:
          - "현장대리인({현장대리인})이 품질방침을 정하고 서명하여 현장 사무실 등 잘 보이는 곳에 게시한다."
          - "신규 배치 인원 교육과 정기 교육 때 품질방침을 설명하고, 설명한 사실을 교육 기록으로 남긴다."
        records: ["품질방침 게시본", "교육 기록"]
        roles:
          - {task: "품질방침 초안 작성", marks: {품질: "○", 현장대리인: "◎"}}
          - {task: "품질방침 결정·서명", marks: {현장대리인: "●", 품질: "◎"}}
          - {task: "게시·전파", marks: {품질: "○", 공무: "◎"}}
          - {task: "이해·적용 확인", marks: {품질: "○", 공사: "◎", 공무: "◎", 안전: "◎"}}
        flow:
          - stage: "방침 초안 작성"
            content:
              - "• 품질관리자는 공사의 목적, 발주자의 기대와 요구, 회사 품질방침을 고려하여 현장 품질방침 초안을 만든다."
            basis: ["별표1 5.1"]
          - stage: "의지 표명 확인"
            content:
              - "• 방침에 다음 사항에 대한 의지가 담겼는지 확인한다."
              - "- 건설공사 요구사항과 법적·규제적 요구사항의 충족"
              - "- 리스크와 기회의 결정과 처리"
              - "- 필요한 자원의 지원과 구성원의 참여"
              - "- 고객만족과 품질 확보를 위한 지속적 개선"
            basis: ["별표1 5.1"]
          - stage: "결정·서명"
            content:
              - "• 현장 최고책임자인 현장대리인이 방침을 결정하고 서명한다."
            basis: ["5.1"]
          - stage: "게시·전파"
            content:
              - "• 방침을 현장 사무실 등 잘 보이는 곳에 게시하고, 신규 배치 교육과 정기 교육 때 설명한다."
            basis: ["7.4", "7.5"]
          - stage: "이해·적용 확인"
            content:
              - "• 품질관리자는 교육 기록과 면담으로 구성원이 방침을 이해하고 업무에 적용하는지 확인하여 기록으로 보유한다."
            basis: ["양식:training_result"]
          - stage: "적절성 검토"
            content:
              - "• 9.4 경영검토 때 방침의 적절성을 검토하고, 고칠 필요가 있으면 6.3에 따라 개정한다."
            basis: ["9.4", "6.3"]

      - id: "5.2"
        title: "책임 및 권한"
        basis: "별표1 5.2"
        purpose: "본사와 연계된 현장 조직을 구성하고 단위 조직과 구성원의 책임과 권한을 정한다."
        body_label: "현장 조직"
        body:
          - "{표:조직}"
        steps:
          - "품질·공사·공무·관리 등 단위 조직별로 활동의 계획, 실행, 유지와 모니터링 책임자를 위 표와 같이 정한다."
          - "발주자·공사감독자 등·하도급자와의 의사소통과 공동 영역에서 생긴 문제의 해결은 7.5 의사소통관리에 따른다."
          - "내부심사, 품질관리 적절성 확인 등 내·외부 점검과 그 결과에 따른 조치는 품질관리자({품질관리자})가 주관한다."
          - "시정조치는 10.1에 따라 관리한다."
          - "책임과 권한은 조직도 게시와 교육으로 알리고, 인원이 바뀌면 본 절을 개정한다."
        records: ["현장 조직도", "건설기술인 배치 현황", "교육 기록"]
        roles:
          - {task: "현장 조직 구성", marks: {현장대리인: "●", 공무: "○", 품질: "◎"}}
          - {task: "책임과 권한 결정", marks: {현장대리인: "●", 품질: "○", 공사: "◎", 공무: "◎", 안전: "◎"}}
          - {task: "조직도·업무분장 게시와 교육", marks: {품질: "○", 공무: "◎"}}
          - {task: "인원 변경 반영", marks: {공무: "○", 품질: "◎", 현장대리인: "●"}}
        flow:
          - stage: "현장 조직 구성"
            content:
              - "• 현장대리인은 품질관리계획을 수립·실행·유지할 수 있도록 본사 조직과 연계된 현장 조직을 구성한다."
              - "- 품질·공사·공무·안전 등 단위 조직과 책임자를 정한다."
            basis: ["별표1 5.2"]
          - stage: "책임과 권한 결정"
            content:
              - "• 단위 조직과 구성원별로 다음 책임과 권한을 정하여 업무분장표에 적는다."
              - "- 활동의 계획·실행·유지와 모니터링"
              - "- 발주자, 공사감독자 또는 건설사업관리기술인, 하도급자와의 의사소통과 공유 영역에서 생긴 문제의 해결"
              - "- 내부심사·품질관리 적절성 확인 등 내·외부 점검과 결과 조치"
              - "- 시정조치의 관리"
            basis: ["별표1 5.2", "양식:duty_matrix"]
          - stage: "업무대행자 지정"
            content:
              - "• 책임자가 자리를 비울 때 업무를 대신할 사람을 정하여 업무분장표에 함께 적는다."
            basis: ["양식:duty_matrix"]
          - stage: "전파·이해 확인"
            content:
              - "• 조직도와 업무분장표를 게시하고 교육으로 알린다."
              - "• 구성원이 책임과 권한을 이해하고 있음을 교육 기록으로 보유한다."
            basis: ["7.4", "양식:training_result"]
          - stage: "변경 관리"
            content:
              - "• 인원이나 조직이 바뀌면 업무분장표를 고치고, 필요하면 6.3에 따라 계획서를 개정한다."
            basis: ["6.3"]
        forms:
          - key: "duty_matrix"
            title: "업무분장표"
            header: ["공사명"]
            columns: ["번호", "조직(팀)", "직책", "담당 업무", "책임과 권한", "업무대행자", "비고"]
            widths: [6, 12, 12, 28, 24, 10, 8]
            approval: true
            rows: 0

  - id: "6"
    title: "기획"
    basis: "별표1 6."
    sections:
      - id: "6.1"
        title: "리스크 및 기회관리"
        basis: "별표1 6.1"
        purpose: "발주자와 공사의 요구사항, 법적 요구사항, 이해관계자의 이슈를 고려하여 리스크와 기회를 정하고 조치한다."
        steps:
          - "착공 시와 주요 공정 착수 전에 공종별 리스크와 기회를 파악하여 목록으로 만든다."
          - "발생 가능성과 영향도로 우선순위를 정하고, 조치 계획(담당·기한)을 세운다."
          - "조치 결과를 확인하여 효과성을 평가하고, 목록을 갱신한다."
        records: ["리스크 및 기회 관리 대장"]
        roles:
          - {task: "이슈·요구사항 수집", marks: {품질: "○", 공사: "◎", 공무: "◎", 안전: "◎"}}
          - {task: "리스크와 기회 파악", marks: {공사: "○", 공무: "○", 안전: "○", 품질: "◎"}}
          - {task: "평가·우선순위 결정", marks: {품질: "○", 공사: "◎", 안전: "◎", 현장대리인: "●"}}
          - {task: "조치 실행", marks: {공사: "○", 공무: "○", 안전: "○", 품질: "◎"}}
          - {task: "효과성 평가·목록 갱신", marks: {품질: "○", 현장대리인: "●"}}
        flow:
          - stage: "이슈 수집"
            content:
              - "• 품질관리자는 발주자와 건설공사 요구사항, 법적·규제적 요구사항, 이해관계자의 이슈를 모은다."
            basis: ["별표1 6.1", "4.2"]
          - stage: "리스크와 기회 파악"
            content:
              - "• 각 팀은 착공 때와 주요 공종 착수 전에 공종·프로세스별 리스크와 기회를 파악하여 관리대장에 적는다."
            basis: ["양식:risk_register"]
          - stage: "평가·우선순위"
            content:
              - "• 발생 가능성과 영향도로 등급을 매겨 우선 조치할 대상을 정한다."
              - "- 가능성·영향도의 등급 기준은 대장 앞쪽에 적어 둔다."
            basis: ["양식:risk_register"]
          - stage: "조치 계획"
            content:
              - "• 조치 대상마다 조치 내용·담당·기한을 정하고 해당 프로세스의 운영 기준에 반영한다."
            basis: ["4.3"]
          - stage: "조치 실행"
            content:
              - "• 담당 팀이 조치를 실행하고 결과를 대장에 적는다."
            basis: ["양식:risk_register"]
          - stage: "효과성 평가·갱신"
            content:
              - "• 품질관리자는 조치 결과로 효과성을 평가한다."
              - "• 새 이슈가 생기거나 시정조치 결과가 나오면 대장을 갱신하고, 결과를 경영검토의 입력으로 쓴다."
            basis: ["별표1 6.1", "9.4", "10.1"]
        forms:
          - key: "risk_register"
            title: "리스크 및 기회 관리대장"
            header: ["공사명"]
            columns: ["번호", "파악일", "공종·프로세스", "구분(리스크·기회)", "내용", "가능성", "영향도", "등급", "조치 계획", "담당", "기한", "결과·효과성"]
            widths: [5, 8, 10, 8, 17, 6, 6, 5, 13, 6, 7, 9]
            groups:                          # 2단 머리(묶음 판단: 이 저장소, 정본 모양 아님)
              - {title: "평가", span: 3, start: 5}
            approval: true
            rows: 0
        tables:
          - key: "risk_likelihood"
            title: "리스크 평가 기준"
            subtitle: "1. 발생 가능성"
            columns: ["점수", "구분", "기준"]
            widths: [14, 18, 68]
            rows:
              - ["3", "높음", "이 공사 또는 비슷한 공사에서 되풀이하여 일어났거나, 조치하지 않으면 일어날 것으로 보이는 경우"]
              - ["2", "보통", "비슷한 공사에서 일어난 적이 있고, 조건에 따라 일어날 수 있는 경우"]
              - ["1", "낮음", "일어난 적이 드물고, 현재 관리 수준에서 일어날 가능성이 작은 경우"]
            indent: true
          - key: "risk_impact"
            title: "리스크 평가 기준"
            subtitle: "2. 영향도"
            columns: ["점수", "구분", "기준"]
            widths: [14, 18, 68]
            rows:
              - ["3", "큼", "구조 안전·주요 성능에 영향을 주거나 재시공이 필요하고, 공정·비용에 큰 손실이 생기는 경우"]
              - ["2", "중간", "보완 시공으로 해결되나 공정 지연이나 추가 비용이 생기는 경우"]
              - ["1", "작음", "현장에서 곧바로 바로잡을 수 있고 공정·비용 영향이 거의 없는 경우"]
            indent: true
          - key: "risk_level"
            title: "리스크 평가 기준"
            subtitle: "3. 리스크 등급(발생 가능성 점수 × 영향도 점수)"
            columns: ["점수", "등급", "관리 기준"]
            widths: [14, 18, 68]
            rows:
              - ["6~9", "상", "조치 계획을 세워 착수 전에 조치하고, 현장대리인이 결과를 확인한다."]
              - ["3~4", "중", "조치 계획을 세워 기한 안에 조치하고, 품질관리자가 결과를 확인한다."]
              - ["1~2", "하", "현재 관리 방법을 유지하며 정기 검토 때 다시 평가한다."]
            indent: true
          - key: "risk_response"
            title: "리스크 및 기회 대응 방법"
            columns: ["구분", "대응 방법", "내용"]
            widths: [14, 18, 68]
            rows:
              - ["리스크", "회피", "원인이 되는 작업 방법·자재·공정 순서를 바꾸어 리스크를 없앤다."]
              - ["리스크", "감소", "검사 빈도 강화, 작업 전 교육, 시공 전 확인 등으로 가능성이나 영향을 줄인다."]
              - ["리스크", "공유·이전", "전문 하도급, 보험, 계약 조건 등으로 책임과 영향을 나눈다."]
              - ["리스크", "수용", "영향이 작아 조치 비용이 더 크면 근거를 남기고 모니터링만 한다."]
              - ["기회", "활용·확대", "신공법·개선 사례·유리한 조건을 공정과 절차에 반영하여 효과를 키운다."]
            indent: true

      - id: "6.2"
        title: "품질목표관리"
        basis: "별표1 6.2"
        purpose: "품질방침과 일관되고 측정 가능한 현장 품질목표를 세우고 달성 정도를 관리한다."
        body_label: "품질목표"
        body:
          - "{표:품질목표}"
        steps:
          - "품질목표는 품질방침과 일관되고, 측정할 수 있으며, 적용 요구사항과 고객만족을 고려하여 정한다."
          - "목표마다 달성 대상·일정, 필요 자원, 책임자, 완료 시기를 정한 추진계획을 세운다."
          - "위 표의 주기마다 달성도를 확인·평가하고, 결과를 구성원에게 알리며 필요하면 목표를 갱신한다."
        records: ["품질목표 추진계획서", "품질목표 달성도 평가 기록"]
        roles:
          - {task: "품질목표 수립", marks: {품질: "○", 공사: "◎", 현장대리인: "●"}}
          - {task: "추진계획 수립", marks: {품질: "○", 공사: "◎", 공무: "◎", 현장대리인: "●"}}
          - {task: "실적 측정·보고", marks: {공사: "○", 품질: "○", 공무: "◎"}}
          - {task: "달성도 평가·갱신", marks: {품질: "○", 현장대리인: "●"}}
        flow:
          - stage: "목표 수립"
            content:
              - "• 품질관리자는 현장 품질방침과 일관되고 측정할 수 있는 품질목표 초안을 만든다."
              - "- 적용 요구사항, 공사목적물의 적합성, 고객만족 증진을 고려한다."
            basis: ["별표1 6.2", "5.1"]
          - stage: "추진계획 수립"
            content:
              - "• 목표마다 달성 대상과 일정, 필요한 자원, 책임자, 완료 시기를 정한다."
              - "• 달성도를 확인할 주기와 결과 평가 방법을 정한다."
            basis: ["별표1 6.2", "양식:objective_plan"]
          - stage: "승인·전파"
            content:
              - "• 현장대리인이 목표와 추진계획을 승인하고, 품질관리자가 구성원에게 알린다."
            basis: ["7.5"]
          - stage: "모니터링"
            content:
              - "• 책임자는 정한 주기마다 실적을 측정하여 추진계획 및 실적표에 적는다."
            basis: ["양식:objective_plan"]
          - stage: "평가·갱신"
            content:
              - "• 품질관리자는 달성도를 평가하고, 미달이면 원인과 대책을 정한다."
              - "• 필요하면 목표를 갱신하고 지속적 개선 결과를 반영한다."
            basis: ["9.2", "9.4", "10.2"]
        forms:
          - key: "objective_plan"
            title: "품질목표 추진계획 및 실적"
            header: ["공사명"]
            columns: ["번호", "품질목표", "지표(산식)", "목표값", "추진 방법", "책임자", "완료 시기", "확인 주기", "실적", "달성도", "비고"]
            widths: [5, 15, 12, 7, 16, 8, 8, 8, 8, 7, 6]
            approval: true
            rows: 0

      - id: "6.3"
        title: "품질관리계획의 변경관리"
        basis: "별표1 6.3"
        purpose: "내부심사·경영검토·설계변경 등으로 품질관리계획을 바꿀 필요가 생기면 계획적으로 변경한다."
        steps:
          - "변경의 목적과 예상 결과를 검토한다."
          - "변경 내용이 별표1 작성기준을 충족하는지 확인한다."
          - "변경에 필요한 자원을 쓸 수 있는지 확인하고, 책임과 권한을 다시 부여할 필요가 있는지 검토한다."
          - "개정도 제정과 같은 절차를 거친다. {승인절차_문장} 시행 후 개정 이력표에 개정 번호·일자·장·사유를 적는다."
        records: ["승인 및 개정이력", "개정 승인 문서"]
        roles:
          - {task: "변경 필요 파악", marks: {품질: "○", 공사: "◎", 공무: "◎"}}
          - {task: "변경 검토·개정안 작성", marks: {품질: "○", 공사: "◎", 공무: "◎"}}
          - {task: "검토·확인·승인 요청", marks: {품질: "○", 현장대리인: "●"}}
          - {task: "개정본 배포·옛 판 회수", marks: {품질: "○", 공무: "◎"}}
        flow:
          - stage: "변경 필요 파악"
            content:
              - "• 품질관리자는 내부심사·경영검토·지속적 개선의 결과와 설계변경·조직 변경에서 계획을 바꿀 필요를 파악한다."
            basis: ["별표1 6.3", "9.3", "9.4", "10.2"]
          - stage: "변경 검토"
            content:
              - "• 변경을 계획적으로 하기 위하여 다음을 검토한다."
              - "- 변경의 목적과 잠재적 결과"
              - "- 품질관리계획서 작성기준(별표1) 충족 여부"
              - "- 자원의 사용 가능성"
              - "- 책임과 권한의 부여 또는 재부여"
            basis: ["별표1 6.3"]
          - stage: "개정안 작성"
            content:
              - "• 개정할 장·절과 개정 사유를 정리하여 개정안을 만든다."
            basis: ["7.6"]
          - stage: "검토·확인 및 승인"
            content:
              - "• 개정안도 제정 때와 같은 절차로 승인받는다."
              - "- {승인절차_문장}"
            basis: ["업무지침 제6조", "영 제90조"]
          - stage: "개정·배포"
            content:
              - "• 승인 후 승인 및 개정이력에 개정 번호·일자·장·사유를 적는다."
              - "• 개정본을 배포하고 옛 판은 회수하거나 식별 표시를 한다."
            basis: ["7.6", "양식:doc_distribution"]

  - id: "7"
    title: "지원"
    basis: "별표1 7."
    sections:
      - id: "7.1"
        title: "자원관리"
        basis: "별표1 7.1"
        purpose: "품질관리계획과 공사 요구사항을 이행하는 데 필요한 인원·기반구조·작업환경을 확보한다."
        steps:
          - "인적자원: 관련 법령과 발주자 요구에 따라 필요한 품질관리 인원과 기술인을 정하고 배치한다(품질관리자 {품질관리자}, 등급 {품질관리자_등급})."
          - "기반구조: 현장 사무실, 시험실, 자재 보관장소, 장비, 정보통신 설비를 공정에 맞추어 확보한다."
          - "작업환경: 기상·소음·조명 등 품질에 영향을 주는 작업 조건을 관리하고, 필요한 성능이 유지되도록 점검한다."
        records: ["인력 배치 계획", "장비 투입 계획"]
        roles:
          - {task: "필요 인원 결정·배치", marks: {공무: "○", 품질: "◎", 현장대리인: "●"}}
          - {task: "기반구조 확보", marks: {공무: "○", 공사: "◎", 안전: "◎", 현장대리인: "●"}}
          - {task: "작업환경 관리", marks: {공사: "○", 안전: "○", 품질: "◎"}}
          - {task: "기반구조 점검", marks: {품질: "○", 공무: "◎", 안전: "◎"}}
        flow:
          - stage: "인적자원 결정"
            content:
              - "• 공무 담당은 관련 법령과 발주자 요구에 따라 계획 이행과 프로세스 운영에 필요한 기술인과 품질관리 인원을 정한다."
              - "- 품질관리자 배치는 관련 법령에서 정한 공사 규모별 기준을 확인한다."
            basis: ["별표1 7.1"]
          - stage: "인원 배치"
            content:
              - "• 7.4에 따라 역량이 확인된 인원을 공정에 맞추어 배치하고 배치 현황을 관리한다."
            basis: ["7.4"]
          - stage: "기반구조 확보"
            content:
              - "• 현장 사무실, 시험실, 자재 보관장소, 장비, 운송 수단, 정보통신 설비를 공정에 맞추어 확보한다."
            basis: ["별표1 7.1"]
          - stage: "작업환경 관리"
            content:
              - "• 공사 담당은 기온·습도·소음·조명·정리정돈 등 품질에 영향을 주는 작업 조건을 관리한다."
              - "- 한중·서중 등 특별한 조건의 작업은 시공계획서에 관리 방법을 적는다."
            basis: ["8.6"]
          - stage: "성능 유지 점검"
            content:
              - "• 기반구조의 상태를 정기적으로 점검하여 점검표에 적고, 이상이 있으면 보수하거나 교체한다."
            basis: ["별표1 7.1", "양식:infra_check"]
        forms:
          - key: "infra_check"
            title: "기반구조 관리상태 점검표"
            header: ["공사명", "점검일"]
            columns: ["번호", "점검 대상", "점검 항목", "점검 기준", "점검 결과(양호·불량)", "조치 내용", "조치일", "확인"]
            widths: [6, 14, 18, 18, 12, 16, 8, 8]
            approval: true
            rows: 0

      - id: "7.2"
        title: "모니터링 자원 및 측정자원의 관리"
        basis: "별표1 7.2"
        purpose: "검사·시험·측정에 쓰는 장비가 정해진 정밀도를 유지하도록 관리한다."
        steps:
          - "8.11 시험계획에 필요한 시험·측정 장비와 장비별 관리 기준(정밀도·정확도)을 정하여 확보한다."
          - "정해진 주기 또는 사용 전에 교정을 받고, 교정성적서를 검토하여 사용 여부를 판단하며, 교정 상태를 장비에 표시한다."
          - "장비마다 고유 번호를 붙이고 취급·유지보전·보관 방법을 정한다."
          - "성능 저하를 발견하기 위한 점검 주기·기준·방법을 정한다."
          - "장비가 관리 기준을 벗어난 것이 확인되면 그 장비로 얻은 이전 결과의 유효성을 평가하고 필요한 조치를 한다."
        records: ["시험장비 관리대장", "교정성적서"]
        roles:
          - {task: "필요 장비·관리기준 결정", marks: {품질: "○", 공사: "◎", 현장대리인: "●"}}
          - {task: "장비 확보·등록", marks: {품질: "○", 공무: "◎"}}
          - {task: "교정·상태 표시", marks: {품질: "○"}}
          - {task: "취급·보관·점검", marks: {품질: "○", 공사: "◎"}}
          - {task: "관리기준 이탈 시 조치", marks: {품질: "○", 공사: "◎", 현장대리인: "●"}}
        flow:
          - stage: "장비 결정"
            content:
              - "• 품질관리자는 8.11 시험계획에 필요한 검사·시험·측정 장비와 장비별 관리기준(정밀도·정확도)을 정한다."
            basis: ["별표1 7.2", "8.11"]
          - stage: "확보·등록"
            content:
              - "• 장비를 확보하면 고유 관리번호를 붙여 교정 관리대장과 장비 이력카드에 등록한다."
            basis: ["양식:calibration_register", "양식:equipment_card"]
          - stage: "교정"
            content:
              - "• 정해진 주기 또는 사용 전에 교정을 받고, 교정성적서를 검토하여 사용 여부를 판단한다."
              - "- 자체 교정하는 장비는 방법과 기준을 정하여 기록한다."
            basis: ["별표1 7.2"]
          - stage: "상태 표시"
            content:
              - "• 교정 유효기간과 사용 가능·사용 불가 상태를 장비에 표시한다."
            basis: ["양식:calibration_tag"]
          - stage: "취급·보관·점검"
            content:
              - "• 장비별 취급·유지보전·보관 방법을 정한다."
              - "• 성능 저하를 찾기 위한 점검 주기·기준·방법을 정하여 점검하고 이력카드에 적는다."
            basis: ["별표1 7.2", "양식:equipment_card"]
          - stage: "이탈 시 조치"
            content:
              - "• 장비가 관리기준을 벗어나면 사용을 멈추고 사용 불가로 표시한다."
              - "• 그 장비로 얻은 이전 검사·시험 결과의 유효성을 평가하고, 필요하면 재시험 등 조치를 하여 기록한다."
            basis: ["별표1 7.2", "8.12"]
        forms:
          - key: "calibration_register"
            title: "계측장비 교정 관리대장"
            header: ["공사명"]
            columns: ["번호", "관리번호", "장비명", "규격·용량", "제작사", "수량", "주기", "최근", "차기", "교정기관", "판정", "비고"]
            widths: [5, 9, 13, 11, 9, 5, 7, 9, 9, 10, 6, 7]
            groups:                          # 2단 머리(묶음 판단: 이 저장소, 정본 모양 아님)
              - {title: "교정", span: 3, start: 6}
            approval: true
            rows: 0
          - key: "equipment_card"
            title: "장비 이력카드"
            header: ["관리번호", "장비명", "규격", "제작사", "도입일"]
            columns: ["번호", "일자", "구분(교정·점검·수리)", "내용", "결과", "실시자", "확인"]
            widths: [6, 11, 15, 32, 14, 11, 11]
            approval: false
            rows: 0
          - key: "calibration_tag"
            title: "교정 상태 식별표"
            columns: ["관리번호", "장비명", "교정일", "차기 교정일", "상태(사용 가능·사용 불가)", "확인자"]
            widths: [14, 20, 14, 14, 24, 14]
            approval: false
            rows: 1                  # 장비에 붙이는 표지 한 장

      - id: "7.3"
        title: "조직의 지식관리"
        basis: "별표1 7.3"
        purpose: "공사에 필요한 계약·기술·법령 지식을 정하고 최신 상태로 쓸 수 있게 한다."
        steps:
          - "필요한 지식(계약서, 시방서, 적용 기준, 사내 표준, 적용 법령, 공법, 유사 공사 사례 등)을 파악한다."
          - "내부·외부 지식을 목록으로 관리하고, 구성원이 찾아 쓸 수 있는 위치에 둔다."
          - "법령·기준이 개정되거나 새 공법을 적용할 때 최신 자료를 입수하여 관련 인원에게 알린다."
        records: ["적용 기준·법령 목록"]
        roles:
          - {task: "필요 지식 파악", marks: {품질: "○", 공사: "◎", 공무: "◎"}}
          - {task: "지식 목록·보관 위치 관리", marks: {공무: "○", 품질: "◎"}}
          - {task: "신규 지식 입수·전파", marks: {품질: "○", 공사: "◎", 안전: "◎"}}
          - {task: "현장 사례 등록", marks: {공사: "○", 공무: "○", 안전: "○", 품질: "◎"}}
        flow:
          - stage: "필요 지식 파악"
            content:
              - "• 품질관리자는 공사목적물 완성에 필요한 지식을 파악한다."
              - "- 계약서, 시방서, 적용 기준과 표준, 사내 표준, 적용 법령, 공법, 유사 공사의 우수·실패 사례"
            basis: ["별표1 7.3"]
          - stage: "목록 작성·보관"
            content:
              - "• 내부·외부 지식을 지식 등록대장에 올리고, 구성원이 찾아 쓸 수 있는 보관 위치(서가·공유 폴더)를 정한다."
            basis: ["별표1 7.3", "양식:knowledge_register"]
          - stage: "최신화"
            content:
              - "• 법령·기준이 개정되거나 새 공법을 적용하면 최신 자료를 입수하여 대장을 고치고 관련 인원에게 알린다."
            basis: ["별표1 7.3", "7.5"]
          - stage: "현장 지식 축적"
            content:
              - "• 시공 중 얻은 교훈과 개선 사례를 대장에 등록하여 공유한다."
              - "• 준공 때 본사로 넘길 지식은 8.13에 따라 정리한다."
            basis: ["8.13", "10.2"]
        forms:
          - key: "knowledge_register"
            title: "현장 지식 등록대장"
            header: ["공사명"]
            columns: ["번호", "등록일", "구분(내부·외부)", "자료명", "내용 요약", "판·개정일", "보관 위치", "등록자", "비고"]
            widths: [6, 9, 10, 18, 22, 10, 12, 7, 6]
            approval: false
            rows: 0

      - id: "7.4"
        title: "역량/적격성관리"
        basis: "별표1 7.4"
        purpose: "업무를 수행하는 인원의 역량을 정하고 교육훈련으로 유지·향상한다."
        steps:
          - "업무별로 필요한 학력·교육훈련·숙련도·경험·법정 자격을 정한다."
          - "배치 전 자격과 경력을 확인하여 역량이 보장된 인원을 배치한다."
          - "교육 필요성 파악: 관련 법령과 본 계획서 요구사항, 작업·검사·시험 방법, 측량, 신기술·신공법, 품질관리 사항."
          - "자체교육·위탁교육 계획을 세워 실시하고, 결과를 보고하며 효과성을 평가한다."
        records: ["교육훈련 계획서", "교육 실시 기록", "자격 확인 기록"]
        roles:
          - {task: "업무별 역량 기준 결정", marks: {품질: "○", 공무: "◎", 현장대리인: "●"}}
          - {task: "적격성 확인·배치", marks: {공무: "○", 품질: "◎", 현장대리인: "●"}}
          - {task: "교육훈련 계획 수립", marks: {품질: "○", 안전: "◎", 공무: "◎", 현장대리인: "●"}}
          - {task: "교육 실시·결과 보고", marks: {품질: "○", 안전: "○", 공사: "◎"}}
          - {task: "교육 효과성 평가", marks: {품질: "○", 현장대리인: "●"}}
        flow:
          - stage: "역량 기준 결정"
            content:
              - "• 업무별로 필요한 학력·교육훈련·숙련도·경험과 관련 법령의 자격 요건을 정한다."
            basis: ["별표1 7.4"]
          - stage: "적격성 확인·배치"
            content:
              - "• 배치 전 자격과 경력을 확인하여 역량이 보장된 인원을 배치한다."
              - "- 경력증명서·자격증 사본 등 개인정보가 담긴 증빙은 이 계획서에 양식으로 싣지 않으며, 사용자가 제출 서류에 따로 첨부한다."
            basis: ["별표1 7.4", "7.1"]
          - stage: "교육 필요성 파악"
            content:
              - "• 품질관리자는 다음 분야의 교육 필요성을 파악한다."
              - "- 공사 관련 법령과 품질관리계획의 요구사항"
              - "- 작업 방법과 절차, 검사·시험 방법, 측량 기법, 적용되는 신기술·신공법"
              - "- 품질관리에 관한 사항"
            basis: ["별표1 7.4"]
          - stage: "교육계획 수립"
            content:
              - "• 자체교육·위탁교육으로 나누어 대상·내용·시기·강사를 정한 교육훈련 계획서를 만들어 현장대리인의 승인을 받는다."
            basis: ["양식:training_plan"]
          - stage: "실시·보고"
            content:
              - "• 계획에 따라 교육하고 참석자와 교육 내용을 기록하여 보고한다."
            basis: ["양식:training_result"]
          - stage: "효과성 평가"
            content:
              - "• 평가 시험·면담·업무 관찰 등으로 교육 효과를 평가하고, 미흡하면 재교육한다."
            basis: ["별표1 7.4"]
        forms:
          - key: "training_plan"
            title: "교육훈련 계획서"
            header: ["공사명"]
            columns: ["번호", "교육명", "구분(자체·위탁)", "대상", "교육 내용", "예정 시기", "시간", "강사·기관", "비고"]
            widths: [6, 16, 10, 12, 24, 9, 6, 11, 6]
            approval: true
            rows: 0
          - key: "training_result"
            title: "교육훈련 결과 보고서"
            header: ["공사명", "교육명", "교육일시", "장소", "강사"]
            columns: ["번호", "소속", "직책", "성명", "서명", "비고"]
            widths: [8, 22, 18, 18, 18, 16]
            approval: true
            rows: 0
        tables:
          - key: "competence_criteria"
            title: "적격성 관리 기준"
            columns: ["직무", "요구 역량(자격·경력·교육)", "확인 방법", "근거"]
            widths: [16, 40, 22, 22]
            rows:
              - ["현장대리인", "공사 종류·규모에 맞는 관련 법령의 배치 자격", "배치 신고 서류", "계약문서, 관계 법령"]
              - ["품질관리 건설기술인", "품질관리 대상 공사 구분에 맞는 등급과 품질관리 경력(시행규칙 별표5)", "건설기술인 신고 확인", "건설기술 진흥법 시행규칙 제50조제4항·별표5"]
              - ["공사 담당", "담당 공종의 시공 경력, 시공계획서·시공상세도 검토 능력", "경력 확인, 면담", "본 계획서 7.4"]
              - ["안전 담당", "관계 법령에서 정한 안전관리자 선임 요건", "선임 서류", "「산업안전보건법」"]
              - ["시험 담당", "담당 시험 종목의 시험 방법 숙지와 장비 취급 능력", "교육 이수, 시험 입회 확인", "본 계획서 7.2·8.11"]
              - ["중점관리 작업자", "8.7에서 정한 공종별 자격 기준", "자격 확인 후 인정", "본 계획서 8.7"]
            indent: false
          - key: "training_criteria"
            title: "교육훈련 운영 기준"
            columns: ["교육 구분", "대상", "주요 내용", "시기·주기", "주관"]
            widths: [16, 16, 38, 16, 14]
            rows:
              - ["신규 배치 교육", "새로 배치된 직원", "품질방침, 품질관리계획서, 책임과 권한", "배치 때", "품질관리자"]
              - ["공종 착수 전 교육", "해당 공종 직원·하도급자", "시공계획서, 작업 방법, 검사·시험 기준", "공종 착수 전", "공사 담당"]
              - ["근로자 품질교육", "현장 근로자", "품질 요구사항, 부적합 사례와 예방", "정기(월 단위 등)", "품질관리자"]
              - ["시험·검사 교육", "시험 담당", "시험 방법, 장비 취급, 기록 방법", "시험 착수 전·필요 때", "품질관리자"]
              - ["법령·기준 개정 교육", "관련 직원", "개정 내용과 적용 방법", "개정 때", "품질관리자"]
              - ["위탁교육", "해당 직원", "법정 교육, 신기술·신공법", "계획에 따라", "공무 담당"]
            indent: false

      - id: "7.5"
        title: "의사소통관리"
        basis: "별표1 7.5"
        purpose: "공사 관계자 사이의 요구사항·정보 교환과 문제 해결을 위한 의사소통 방법을 정한다."
        steps:
          - "의사소통 대상: 발주자({발주자}), 공사감독자 등({건설사업관리자}), 하도급자, 자재 공급원, 관계 기관."
          - "의사소통 내용·시기·방법·담당자를 정한다(예: 주간 공정회의, 월간 품질회의, 공문, 전자 문서)."
          - "부적합·민원·불평이 생기면 접수 즉시 담당자를 지정하여 처리하고 후속 조치를 기록한다."
          - "비상시 연락 체계를 정하여 게시한다."
        records: ["회의록", "공문 수발신 대장", "비상 연락망"]
        roles:
          - {task: "의사소통 방안 결정", marks: {품질: "○", 공무: "◎", 현장대리인: "●"}}
          - {task: "회의체 구성·운영", marks: {공무: "○", 공사: "◎", 품질: "◎", 현장대리인: "●"}}
          - {task: "공문·정보 교환", marks: {공무: "○", 품질: "◎"}}
          - {task: "민원·불평 처리", marks: {공무: "○", 공사: "◎", 안전: "◎", 현장대리인: "●"}}
          - {task: "비상 연락체계 운영", marks: {안전: "○", 공무: "◎", 현장대리인: "●"}}
        flow:
          - stage: "방안 결정"
            content:
              - "• 품질관리자는 의사소통의 내용·시기·대상·방법·담당자를 정한다."
              - "- 대상: 발주자, 공사감독자 또는 건설사업관리기술인, 하도급자, 자재 공급원, 관계 기관, 인근 주민"
            basis: ["별표1 7.5"]
          - stage: "회의체 구성"
            content:
              - "• 공사 관련자 회의체를 구성하여 운영한다."
              - "- 예: 주간 공정회의, 월간 품질회의, 하도급자 협의회"
            basis: ["별표1 7.5", "양식:meeting_minutes"]
          - stage: "정보 교환"
            content:
              - "• 요구사항과 정보는 공문·회의·전자 문서로 주고받고, 공문은 문서 접수·발송대장에 적는다."
              - "• 회의 결과는 회의록으로 남긴다."
            basis: ["7.6", "양식:doc_register", "양식:meeting_minutes"]
          - stage: "문제 해결"
            content:
              - "• 부적합·민원·불평이 생기면 곧바로 담당자를 정해 처리하고 후속 조치를 민원 처리 일지에 적는다."
              - "- 부적합 공사는 8.12, 시정조치는 10.1에 따른다."
            basis: ["별표1 7.5", "양식:complaint_log"]
          - stage: "비상 대응"
            content:
              - "• 비상시 연락체계와 대응 절차를 정하여 게시하고, 연락처가 바뀌면 바로 고친다."
            basis: ["별표1 7.5"]
        forms:
          - key: "complaint_log"
            title: "민원 처리 일지"
            header: ["공사명"]
            columns: ["번호", "접수일", "민원 구분", "접수 경로", "민원 내용", "담당", "처리 내용", "처리일", "결과 통보", "비고"]
            widths: [5, 9, 9, 9, 22, 7, 20, 8, 6, 5]
            approval: true
            rows: 0
          - key: "meeting_minutes"
            title: "회의록"
            header: ["공사명", "회의명", "일시", "장소", "참석자"]
            columns: ["번호", "안건", "논의 내용", "결정 사항", "조치 담당", "기한"]
            widths: [6, 18, 32, 22, 12, 10]
            approval: true
            rows: 0
        tables:
          - key: "communication_criteria"
            title: "의사소통 관리 기준"
            columns: ["대상", "내용", "시기", "방법", "담당"]
            widths: [18, 34, 16, 18, 14]
            rows:
              - ["발주자", "공정·품질 현황, 계약변경, 주요 결정 사항", "정기·수시", "공문, 보고서, 회의", "현장대리인"]
              - ["공사감독자 또는 건설사업관리기술인", "시공계획 검토, 검사·시험 입회, 부적합 처리 승인", "공종별·수시", "공문, 검측 요청, 회의", "공사·품질 담당"]
              - ["하도급자", "작업 지시, 품질 요구사항, 검사 결과", "일일·주간", "작업 회의, 공문", "공사 담당"]
              - ["자재 공급원", "발주·납기, 시험성적서, 불량 자재 조치", "발주·반입 때", "발주서, 공문", "공무·품질 담당"]
              - ["관계 행정기관", "인허가, 신고, 점검 대응", "해당 때", "공문, 전자 민원", "공무 담당"]
              - ["인근 주민", "공사 안내, 민원 처리 결과", "착공 전·수시", "안내문, 면담", "공무 담당"]
              - ["현장 구성원", "방침·목표, 계획 변경, 지시 사항", "정기·수시", "조회, 교육, 게시", "품질관리자"]
            indent: false

      - id: "7.6"
        title: "문서화된 정보 및 정보의 관리"
        basis: "별표1 7.6"
        purpose: "품질관리계획서, 계약·설계 문서, 품질 기록을 식별·보관·변경 관리한다."
        steps:
          - "관리 대상: 품질관리계획서·시공계획서·작업절차서(내부), 계약문서·설계도서·법규·기술시방(외부), 적합성 증거 기록."
          - "문서에는 제목·날짜·작성자·문서번호({문서번호} 체계)를 적고, 작성·검토·승인 절차를 거친다."
          - "배포·접근·검색 방법, 보관·보존 방법, 판(버전) 관리, 법정 보존기간에 따른 보유·폐기 방법을 정한다."
          - "외부 문서는 받은 날짜와 판을 기록하여 식별하고, 의도하지 않은 수정을 막도록 원본을 보호한다."
        records: ["문서 관리대장", "기록 보존 목록"]
        roles:
          - {task: "문서 체계·번호 결정", marks: {품질: "○", 공무: "◎", 현장대리인: "●"}}
          - {task: "문서 작성·검토·승인", marks: {공사: "○", 공무: "○", 안전: "○", 품질: "◎", 현장대리인: "●"}}
          - {task: "접수·발송·배포", marks: {공무: "○", 품질: "◎"}}
          - {task: "도면 판 관리", marks: {공사: "○", 공무: "◎"}}
          - {task: "보관·보존·폐기", marks: {공무: "○", 품질: "◎", 현장대리인: "●"}}
        flow:
          - stage: "관리 대상 결정"
            content:
              - "• 품질관리자는 관리할 문서화된 정보를 정한다."
              - "- 내부: 품질관리계획서, 시공계획서, 작업절차서"
              - "- 외부: 계약문서, 설계도서, 법규, 기술시방"
              - "- 적합하다는 증거로 작성하는 기록"
            basis: ["별표1 7.6"]
          - stage: "작성·식별"
            content:
              - "• 문서에는 제목·날짜·작성자·문서번호를 적고, 형식(언어·소프트웨어 판)과 매체(종이·전자)를 정한다."
            basis: ["별표1 7.6"]
          - stage: "검토·승인"
            content:
              - "• 작성한 문서는 담당 팀장의 검토와 현장대리인의 승인을 받는다."
            basis: ["5.2"]
          - stage: "접수·발송·배포"
            content:
              - "• 공무 담당은 들어오고 나가는 문서를 접수·발송대장에 적는다."
              - "• 품질 문서는 배부 관리대장으로 배포·회수하고, 도면은 도면 관리대장으로 판을 관리한다."
            basis: ["양식:doc_register", "양식:doc_distribution", "양식:drawing_register"]
          - stage: "변경관리"
            content:
              - "• 문서를 고치면 판(버전)을 올리고 변경 내용을 적는다."
              - "• 옛 판은 회수하거나 폐기 표시를 하여 잘못 쓰이지 않게 한다."
            basis: ["별표1 7.6"]
          - stage: "보관·보호"
            content:
              - "• 읽을 수 있는 상태로 보관하고 전자 파일은 백업한다."
              - "• 외부 문서는 받은 날짜와 판을 기록하여 식별하고, 의도하지 않은 수정을 막도록 원본을 보호한다."
            basis: ["별표1 7.6"]
          - stage: "보유·폐기"
            content:
              - "• 법령과 계약에서 정한 보존기간에 따라 보유하고, 기간이 지나면 승인을 받아 폐기한다."
              - "• 준공 때 넘길 기록은 8.13에 따른다."
            basis: ["업무지침 제40조", "8.13"]
        forms:
          - key: "doc_register"
            title: "문서 접수·발송대장"
            header: ["공사명"]
            columns: ["번호", "구분(접수·발송)", "일자", "문서번호", "발신·수신처", "제목", "담당", "처리 결과", "비고"]
            widths: [6, 9, 9, 12, 14, 26, 7, 11, 6]
            approval: false
            rows: 0
          - key: "doc_distribution"
            title: "품질 문서 배부 관리대장"
            header: ["공사명"]
            columns: ["번호", "문서명", "문서번호", "판(Rev.)", "배부일", "배부처", "부수", "수령 확인", "회수일", "비고"]
            widths: [6, 20, 12, 7, 9, 14, 6, 10, 9, 7]
            approval: false
            rows: 0
          - key: "drawing_register"
            title: "도면 관리대장"
            header: ["공사명"]
            columns: ["번호", "도면번호", "도면명", "판(Rev.)", "접수일", "변경 사유", "배부처", "옛 판 회수", "비고"]
            widths: [6, 12, 22, 7, 9, 18, 12, 8, 6]
            approval: false
            rows: 0
        tables:
          - key: "document_classification"
            title: "문서 분류 체계"
            columns: ["분류", "대상 문서", "번호 부여", "보관", "보유 기간"]
            widths: [12, 32, 18, 18, 20]
            rows:
              - ["계획", "품질관리계획서, 시공계획서, 작업절차서", "{문서번호}-계획-일련번호", "현장 문서함·전자 폴더", "준공 때까지(인계 후 본사)"]
              - ["외부", "계약문서, 설계도서, 시방서, 법규·기준", "받은 문서의 번호·판 그대로", "원본 보호, 사본 배포", "준공 때까지(인계 후 본사)"]
              - ["기록", "품질검사 실시대장, 시험성적서, 점검표, 회의록", "{문서번호}-기록-일련번호", "양식별 철", "계약·관계 법령에서 정한 기간"]
              - ["성과", "품질검사 성과 총괄표", "{문서번호}-성과-일련번호", "원본 보관", "발주자 제출(발주자는 시설물 존속 기간 보존 — 영 제93조)"]
              - ["공문", "접수·발송 공문", "접수·발송대장 번호", "월별 철", "계약·관계 법령에서 정한 기간"]
            indent: false

  - id: "8"
    title: "운용"
    basis: "별표1 8."
    sections:
      - id: "8.1"
        title: "건설공사 요구사항 검토 및 준비"
        basis: "별표1 8.1"
        purpose: "계약문서·설계도서·관련 법규의 요구사항을 검토하고 공사 착수를 준비한다."
        steps:
          - "착공 전에 검토 시기·방법·책임자를 정하여 설계도서와 시방서를 검토한다."
          - "서로 어긋나거나 모호한 요구사항, 현장 실정과 맞지 않는 요구사항은 공사감독자 등과 협의하여 해결한다."
          - "사전 준비: 인허가 계획과 이행, 공사 표지판 설치, 측량 기준점 보호와 확인 측량(필요한 경우), 가설시설물 설치 계획, 현지 여건 조사."
        records: ["설계도서 검토 기록", "인허가 관리 대장", "현지 조사 기록"]
        roles:
          - {task: "검토 시기·방법·책임자 지정", marks: {현장대리인: "●", 공사: "◎", 품질: "○"}}
          - {task: "설계도서 검토", marks: {공사: "○", 품질: "◎", 공무: "◎"}}
          - {task: "상충·모호한 요구사항 해결", marks: {공사: "○", 공무: "○", 현장대리인: "●"}}
          - {task: "인허가 계획·이행", marks: {공무: "○", 현장대리인: "●"}}
          - {task: "표지판·측량·가설·현지 조사", marks: {공사: "○", 안전: "◎", 공무: "◎"}}
        flow:
          - stage: "검토 계획"
            content:
              - "• 현장대리인은 계약문서·설계도서·관련 법규 검토의 시기·방법·책임자를 정한다."
            basis: ["별표1 8.1"]
          - stage: "요구사항 검토"
            content:
              - "• 공사 담당은 도면·시방서·내역서를 서로 대조하여 검토하고 결과를 설계도서 검토서에 적는다."
              - "- 서로 어긋나거나 모호한 사항, 현장 실정과 맞지 않는 사항을 찾는다."
            basis: ["양식:design_review"]
          - stage: "문제 해결"
            content:
              - "• 찾은 사항은 공사감독자 또는 건설사업관리기술인과 협의하여 해결한다."
              - "• 계약 변경이 필요하면 8.2에 따른다."
            basis: ["별표1 8.1", "8.2"]
          - stage: "인허가"
            content:
              - "• 공무 담당은 공사 관련 인허가 목록과 이행계획을 세우고, 허가 조건의 이행을 관리한다."
            basis: ["별표1 8.1", "양식:permit_plan"]
          - stage: "현장 준비"
            content:
              - "• 공사 표지판 설치, 측량 기준점 보호와 확인 측량(필요한 경우), 가설시설물 설치를 계획하여 이행한다."
            basis: ["별표1 8.1"]
          - stage: "현지 여건 조사"
            content:
              - "• 지형·지장물·인접 시설·교통·민원 요인을 조사하여 시공계획과 리스크 및 기회 관리대장에 반영한다."
            basis: ["별표1 8.1", "6.1"]
        forms:
          - key: "design_review"
            title: "설계도서 검토서"
            header: ["공사명", "검토일", "검토자"]
            columns: ["번호", "도서명(도면번호)", "검토 부위", "검토 내용(상충·누락·오류)", "조치 의견", "협의 결과", "비고"]
            widths: [6, 16, 12, 28, 16, 15, 7]
            approval: true
            rows: 0
          - key: "permit_plan"
            title: "인허가 조건 이행계획서"
            header: ["공사명"]
            columns: ["번호", "인허가명", "관계 기관", "신청 시기", "허가일", "허가 조건", "이행 계획", "이행 결과", "담당", "비고"]
            widths: [5, 14, 10, 8, 8, 17, 15, 11, 6, 6]
            approval: true
            rows: 0

      - id: "8.2"
        title: "건설공사 요구사항 변경"
        basis: "별표1 8.2"
        purpose: "설계변경을 포함한 계약 변경을 관리한다."
        steps:
          - "계약 변경이 필요하면 사유와 근거를 갖추어 요청하고, 승인 결과에 따라 처리한다."
          - "변경 내용을 관련 문서(도면·시방서·본 계획서 8.11 등)에 반영하고, 관련 인원에게 알린다."
        records: ["설계변경 관리 대장"]
        roles:
          - {task: "변경 사유 정리", marks: {공사: "○", 공무: "◎", 품질: "◎"}}
          - {task: "계약변경 요청", marks: {공무: "○", 현장대리인: "●"}}
          - {task: "관련 문서 수정", marks: {공무: "○", 공사: "○", 품질: "◎"}}
          - {task: "변경 내용 전파", marks: {공무: "○", 품질: "○"}}
        flow:
          - stage: "변경 사유 발생"
            content:
              - "• 설계도서 검토, 현장 여건 변화, 발주자 요구 등으로 계약변경 사유가 생기면 공사 담당이 내용과 근거를 정리한다."
            basis: ["별표1 8.2", "8.1"]
          - stage: "변경 요청"
            content:
              - "• 공무 담당은 사유서·도면·수량 산출 등 근거를 갖추어 공사감독자 또는 건설사업관리기술인을 거쳐 발주자에게 변경을 요청한다."
            basis: ["별표1 8.2"]
          - stage: "승인·처리"
            content:
              - "• 승인 결과를 설계변경 관리대장에 적고, 승인 전에는 변경된 내용으로 시공하지 않는다."
            basis: ["양식:design_change_register"]
          - stage: "문서 반영"
            content:
              - "• 변경된 도면·시방서·내역과 본 계획서(8.11 시험계획 포함)를 고친다."
            basis: ["7.6", "6.3"]
          - stage: "변경 인식"
            content:
              - "• 관련 인원과 하도급자에게 변경 내용을 알리고 옛 판 도면을 회수한다."
            basis: ["별표1 8.2", "7.5"]
        forms:
          - key: "design_change_register"
            title: "설계변경 관리대장"
            header: ["공사명"]
            columns: ["번호", "요청일", "변경 항목", "변경 사유", "변경 내용", "관련 도면", "승인일", "반영 문서", "비고"]
            widths: [6, 9, 14, 18, 22, 11, 8, 7, 5]
            approval: true
            rows: 0

      - id: "8.3"
        title: "설계관리"
        basis: "별표1 8.3"
        purpose: "시공자에게 설계 책임이 있는 경우(설계시공 일괄입찰 등)에 한하여 설계를 관리한다."
        body_label: "적용 여부"
        body:
          - "적용 여부: {설계관리}"
        steps:
          - "적용하는 경우 설계계획을 세우고, 설계 입력 요구사항을 정한다."
          - "설계 검토·검증·실현성 확인을 수행하고, 설계 출력이 입력 요구사항을 충족하는지 확인한다."
          - "설계 변경을 식별·검토하여 관리한다."
        records: ["설계 검토 기록"]
        roles:
          - {task: "적용 여부 판단", marks: {품질: "○", 공무: "◎", 현장대리인: "●"}}
          - {task: "설계계획·입력 결정", marks: {공사: "○", 공무: "◎", 품질: "◎"}}
          - {task: "검토·검증·실현성 확인", marks: {공사: "○", 품질: "○", 현장대리인: "●"}}
          - {task: "설계변경 관리", marks: {공사: "○", 공무: "◎"}}
        flow:
          - stage: "적용 여부 확인"
            content:
              - "• 설계시공 일괄입찰 등 시공자에게 설계 책임이 있는 공사에만 적용한다."
              - "• 적용하지 않으면 2.1 적용범위의 적용제외에 사유를 적는다."
            basis: ["별표1 8.3", "2.1"]
          - stage: "설계계획"
            content:
              - "• 설계 범위·일정·조직과 검토 단계를 정한 설계계획을 세워 관리한다."
            basis: ["별표1 8.3"]
          - stage: "입력 결정"
            content:
              - "• 기능·성능 요구, 적용 법령과 기준, 유사 설계 정보 등 설계 입력 요구사항을 정한다."
            basis: ["별표1 8.3"]
          - stage: "검토·검증·실현성 확인"
            content:
              - "• 단계별로 설계 검토, 설계 검증, 실현성 확인을 수행하고 기록한다."
            basis: ["별표1 8.3"]
          - stage: "출력 확인"
            content:
              - "• 설계 출력(도면·계산서·시방)이 입력 요구사항을 충족하는지 확인하고 승인을 받는다."
            basis: ["별표1 8.3"]
          - stage: "설계변경 관리"
            content:
              - "• 설계 변경을 식별·검토하여 승인 후 반영하고 설계변경 관리대장에 적는다."
            basis: ["8.2", "양식:design_change_register"]

      - id: "8.4"
        title: "기자재 구매관리"
        basis: "별표1 8.4"
        purpose: "품질 요구사항을 충족하는 주요 기자재가 공정에 맞추어 들어오도록 관리한다."
        steps:
          - "공정표에 맞춘 기자재 수급계획을 세운다."
          - "발주서에 기자재명·규격·납기·검사 기준과 구매 정보를 적는다."
          - "반입 기자재는 8.11 시험계획에 따라 검사·시험하여 합격한 것만 쓴다."
          - "부적합 기자재는 식별 표시 후 격리하고 반출 또는 8.12에 따라 처리한다."
          - "제작품은 검증 방법과 출하 방법을 발주서에 적는다."
        records: ["기자재 수급 계획", "자재 검수 기록", "자재 공급원 승인 서류"]
        roles:
          - {task: "기자재 수급계획", marks: {공무: "○", 공사: "◎", 품질: "◎", 현장대리인: "●"}}
          - {task: "자재 공급원 승인 요청", marks: {품질: "○", 공무: "◎", 현장대리인: "●"}}
          - {task: "발주서 작성·발주", marks: {공무: "○", 공사: "◎", 현장대리인: "●"}}
          - {task: "반입 검사·시험", marks: {품질: "○", 공사: "◎"}}
          - {task: "부적합 기자재 처리", marks: {품질: "○", 공사: "○", 현장대리인: "●"}}
        flow:
          - stage: "수급계획"
            content:
              - "• 공무 담당은 공정표에 맞추어 주요 기자재의 수급계획을 세운다."
            basis: ["별표1 8.4", "양식:material_supply_plan"]
          - stage: "공급원 승인"
            content:
              - "• 품질관리자는 품질시험 성적서·KS 인증 여부 등 서류를 갖추어 자재 공급원 승인을 요청하고 결과를 대장에 적는다."
              - "- 레미콘·아스콘 등 사전점검 대상은 업무지침의 절차를 따른다."
            basis: ["업무지침 제32조", "업무지침 제33조", "양식:supplier_approval"]
          - stage: "발주"
            content:
              - "• 발주서에 기자재명·규격·수량·납기·검사 기준과 관련 구매 정보를 적어 발주한다."
              - "- 제작품은 검증 방법과 출하 방법을 발주서에 적는다."
            basis: ["별표1 8.4"]
          - stage: "반입 검사·시험"
            content:
              - "• 반입 때 납품서와 시험성적서를 확인하고, 8.11 품질시험계획에 따라 검사·시험하여 합격한 것만 쓴다."
            basis: ["8.11", "업무지침 제38조"]
          - stage: "보관·유지관리"
            content:
              - "• 합격한 기자재는 식별 표시를 하고 8.10에 따라 보관한다."
            basis: ["8.8", "8.10"]
          - stage: "부적합 처리"
            content:
              - "• 불합격 기자재는 식별 표시 후 격리하고, 반출하거나 8.12에 따라 처리한다."
            basis: ["별표1 8.4", "8.12"]
        forms:
          - key: "material_supply_plan"
            title: "주요 기자재 수급 계획서"
            header: ["공사명"]
            columns: ["번호", "기자재명", "규격", "단위", "수량", "공급원", "투입 공종", "투입 예정 시기", "발주 예정일", "비고"]
            widths: [6, 16, 14, 6, 8, 13, 12, 10, 9, 6]
            approval: true
            rows: 0
          - key: "supplier_approval"
            title: "자재 공급원 승인 관리대장"
            header: ["공사명"]
            columns: ["번호", "자재명", "규격", "공급원(제조사)", "KS 인증 여부", "요청일", "승인일", "승인자", "비고"]
            widths: [6, 16, 16, 18, 9, 9, 9, 10, 7]
            approval: true
            rows: 0

      - id: "8.5"
        title: "외부에서 제공되는 프로세스관리"
        basis: "별표1 8.5"
        purpose: "하도급 공종의 품질을 보장한다."
        steps:
          - "하도급 계획을 세우고, 필요하면 하도급자의 수행 능력을 평가하여 선정한다."
          - "하도급 계약에 적용 절차, 기자재·장비의 보고와 승인, 인력 자격 등 요구사항을 적는다."
          - "하도급자에게 교육·품질 절차·정보를 제공하고, 하도급 공종도 8.11에 따라 검사·시험한다."
          - "하도급자가 제출할 기록의 종류와 제출 시기·방법을 정한다."
        records: ["하도급자 평가 기록", "하도급 공종 검사 기록"]
        roles:
          - {task: "하도급 계획", marks: {공무: "○", 공사: "◎", 현장대리인: "●"}}
          - {task: "하도급업체 평가·선정", marks: {공무: "○", 품질: "◎", 안전: "◎", 현장대리인: "●"}}
          - {task: "계약 요구사항 결정", marks: {공무: "○", 품질: "◎", 안전: "◎"}}
          - {task: "하도급자 지원·교육", marks: {품질: "○", 안전: "○", 공사: "◎"}}
          - {task: "하도급 공종 검사·모니터링", marks: {공사: "○", 품질: "○"}}
        flow:
          - stage: "하도급 계획"
            content:
              - "• 공무 담당은 하도급할 공종·범위·시기를 정한 하도급 발주계획을 세운다."
            basis: ["별표1 8.5", "양식:subcontract_plan"]
          - stage: "평가·선정"
            content:
              - "• 필요하면 시공 실적·기술 인력·장비·품질관리 능력으로 하도급업체가 계약 요구사항을 충족할 수 있는지 평가하여 선정한다."
            basis: ["별표1 8.5"]
          - stage: "계약 요구사항"
            content:
              - "• 하도급 계약에 적용 절차, 기자재·장비의 보고와 승인, 인력 자격 인정 등 요구사항을 적고 계약한다."
            basis: ["별표1 8.5"]
          - stage: "지원"
            content:
              - "• 하도급자에게 제공할 교육훈련, 품질 관련 절차서, 기자재, 정보의 범위를 정하여 제공한다."
            basis: ["별표1 8.5", "7.4"]
          - stage: "검사·모니터링"
            content:
              - "• 하도급 공종도 8.11에 따라 검사·시험하고 시공 상태를 모니터링한다."
            basis: ["별표1 8.5", "8.11"]
          - stage: "기록 제출"
            content:
              - "• 하도급자가 제출할 기록의 종류와 제출 시기·방법을 정하여 받는다."
            basis: ["별표1 8.5", "7.6"]
        forms:
          - key: "subcontract_plan"
            title: "하도급 발주계획서"
            header: ["공사명"]
            columns: ["번호", "공종", "공사 범위", "착수 예정일", "완료 예정일", "발주 예정일", "선정 방법", "요구 자격·조건", "비고"]
            widths: [6, 13, 20, 9, 9, 9, 10, 18, 6]
            approval: true
            rows: 0

      - id: "8.6"
        title: "공사관리"
        basis: "별표1 8.6"
        purpose: "공사 목적물이 요구사항을 충족하도록 공사 전반을 계획하고 관리한다."
        steps:
          - "주요 공종마다 시공계획서를 작성하고, 필요하면 작업절차서를 둔다."
          - "공정 진도를 관리하고, 부진하면 만회 대책과 수정 공정계획을 세운다."
          - "시공상세도와 준공도를 관리한다."
          - "자격과 역량을 갖춘 인원을 배치한다."
        records: ["시공계획서", "공정 관리 기록", "시공상세도 관리 대장"]
        roles:
          - {task: "시공계획서·작업절차서 작성", marks: {공사: "○", 품질: "◎", 안전: "◎", 현장대리인: "●"}}
          - {task: "시공상세도 작성·관리", marks: {공사: "○", 공무: "◎"}}
          - {task: "공정 진도 관리", marks: {공무: "○", 공사: "◎", 현장대리인: "●"}}
          - {task: "인원 선정·배치", marks: {공무: "○", 공사: "◎", 품질: "◎"}}
          - {task: "준공도 작성", marks: {공사: "○", 공무: "◎"}}
        flow:
          - stage: "시공계획"
            content:
              - "• 공사 담당은 주요 공종마다 시공계획서를 작성하여 공사감독자 또는 건설사업관리기술인의 검토를 받는다."
              - "- 필요하면 작업절차서 또는 작업지침을 둔다."
            basis: ["별표1 8.6"]
          - stage: "시공상세도"
            content:
              - "• 시공상세도를 작성하여 승인받은 뒤 시공하고, 관리대장으로 판을 관리한다."
            basis: ["별표1 8.6", "양식:shop_drawing_register"]
          - stage: "시공"
            content:
              - "• 승인된 계획과 도면으로 시공한다."
              - "• 공정별 검사·시험은 8.11, 중점 관리 공종은 8.7에 따른다."
            basis: ["8.7", "8.11"]
          - stage: "공정 관리"
            content:
              - "• 공무 담당은 공정 진도를 관리하고, 부진하면 만회 대책과 수정 공정계획을 세운다."
            basis: ["별표1 8.6"]
          - stage: "인원 관리"
            content:
              - "• 요구되는 자격과 역량을 갖춘 인원을 선정하여 배치한다."
            basis: ["별표1 8.6", "7.4"]
          - stage: "준공도"
            content:
              - "• 시공 중 변경 사항을 반영한 준공도를 작성하여 8.13에 따라 제출한다."
            basis: ["별표1 8.6", "8.13"]
        forms:
          - key: "shop_drawing_register"
            title: "시공상세도 관리대장"
            header: ["공사명"]
            columns: ["번호", "도면번호", "도면명", "공종", "작성일", "제출일", "승인일", "판(Rev.)", "비고"]
            widths: [6, 13, 27, 12, 9, 9, 9, 7, 8]
            approval: true
            rows: 0

      - id: "8.7"
        title: "중점품질관리"
        basis: "별표1 8.7"
        purpose: "하자가 잦거나 부적합 시 시정이 어려운 공종·부위를 중점 관리한다."
        body_label: "중점 관리 대상"
        body:
          - "중점 품질관리 대상 공종: {중점관리공종}"
        steps:
          - "대상 공종을 정하고 공종별 관리 항목·기준을 정한다."
          - "작업에 쓰는 장비의 기준을 정하고 승인한다."
          - "작업자의 자격 기준을 정하고 확인한다."
          - "작업 방법과 모니터링 방법을 정하여 시공 중 확인한다."
        records: ["중점 품질관리 대장"]
        roles:
          - {task: "중점 관리 대상 결정", marks: {품질: "○", 공사: "◎", 현장대리인: "●"}}
          - {task: "관리 항목·기준 결정", marks: {품질: "○", 공사: "◎"}}
          - {task: "장비 기준·승인", marks: {공사: "○", 품질: "◎", 안전: "◎"}}
          - {task: "작업자 자격 확인", marks: {품질: "○", 공사: "◎"}}
          - {task: "작업 확인·기록", marks: {공사: "○", 품질: "○"}}
        flow:
          - stage: "대상 결정"
            content:
              - "• 품질관리자는 품질관리가 소홀해지기 쉽거나 하자가 잦고, 부적합으로 판명되면 시정이 어렵고 비용이 많이 드는 공종·부위를 중점 관리 대상으로 정한다."
            basis: ["별표1 8.7"]
          - stage: "관리 항목·기준"
            content:
              - "• 대상마다 관리 항목, 관리 기준, 확인 시기와 방법을 정하여 중점 품질관리 대장에 적는다."
            basis: ["양식:key_quality_register"]
          - stage: "장비 기준·승인"
            content:
              - "• 작업에 쓰는 장비의 기준을 정하고 반입 전에 승인한다."
            basis: ["별표1 8.7"]
          - stage: "작업자 자격"
            content:
              - "• 작업자의 자격 기준을 정하고, 자격을 확인하여 인정한 작업자만 투입한다."
            basis: ["별표1 8.7", "양식:key_worker_register"]
          - stage: "작업·모니터링"
            content:
              - "• 정한 작업 방법으로 시공하고, 공사·품질 담당이 시공 중 확인하여 대장에 적는다."
            basis: ["별표1 8.7", "8.11"]
          - stage: "결과 반영"
            content:
              - "• 확인 결과 부적합은 8.12에 따라 처리하고, 반복되는 문제는 10.1 시정조치로 넘긴다."
            basis: ["8.12", "10.1"]
        forms:
          - key: "key_quality_register"
            title: "중점 품질관리 대장"
            header: ["공사명"]
            columns: ["번호", "공종·부위", "관리 항목", "관리 기준", "확인 시기", "확인 방법", "확인 결과", "확인자", "비고"]
            widths: [6, 15, 15, 18, 10, 12, 11, 7, 6]
            approval: true
            rows: 0
          - key: "key_worker_register"
            title: "중점관리 작업자 자격 관리대장"
            header: ["공사명"]
            columns: ["번호", "공종", "작업 구분", "소속", "성명", "자격·교육 이수", "확인일", "비고"]
            widths: [6, 14, 14, 16, 12, 20, 10, 8]
            approval: true
            rows: 0

      - id: "8.8"
        title: "식별 및 추적관리"
        basis: "별표1 8.8"
        purpose: "모든 단계에서 기자재와 공사 목적물을 식별하고 추적할 수 있게 한다."
        steps:
          - "식별 대상과 방법(표찰·색 표시·위치 기록 등)을 정한다."
          - "추적이 필요한 대상(예: 레미콘 타설 부위와 공시체, 철근 반입 로트)을 정하고 범위·방법을 정한다."
          - "검사·시험 상태(검사 전·합격·불합격)를 표시한다."
        records: ["자재 반입·사용 부위 기록"]
        roles:
          - {task: "식별 대상·방법 결정", marks: {품질: "○", 공사: "◎"}}
          - {task: "추적 대상·범위 결정", marks: {품질: "○", 공사: "◎", 공무: "◎"}}
          - {task: "검사·시험 상태 표시", marks: {품질: "○", 공사: "○"}}
          - {task: "반입·사용 부위 기록", marks: {공사: "○", 품질: "◎"}}
        flow:
          - stage: "식별 대상 결정"
            content:
              - "• 품질관리자는 식별 대상(반입 기자재, 시공 부위, 시험 시료, 장비)과 식별 방법(표지·꼬리표·색 표시·위치 기록)을 정한다."
            basis: ["별표1 8.8"]
          - stage: "반입 자재 식별"
            content:
              - "• 반입 자재에 품명·규격·반입일·공급원·검사 상태를 적은 식별표지를 붙인다."
            basis: ["양식:id_tag"]
          - stage: "추적 대상·범위"
            content:
              - "• 추적 요구사항을 고려하여 추적할 대상과 범위·정도·방법을 정한다."
              - "- 예: 레미콘 타설 부위와 공시체, 철근 반입 로트와 사용 부위"
            basis: ["별표1 8.8"]
          - stage: "검사·시험 상태 표시"
            content:
              - "• 검사 전·합격·불합격 상태를 구분하여 표시하고, 불합격품은 8.12에 따라 격리한다."
            basis: ["별표1 8.8", "8.12"]
          - stage: "기록 유지"
            content:
              - "• 반입·사용 부위 기록을 품질검사 실시대장과 연결하여 보관한다."
            basis: ["양식:test_ledger", "7.6"]
        forms:
          - key: "id_tag"
            title: "자재 식별표지"
            columns: ["품명", "규격", "반입일", "공급원", "수량", "검사 상태(검사 전·합격·불합격)", "확인자"]
            widths: [16, 14, 11, 15, 9, 24, 11]
            approval: false
            rows: 1                  # 자재에 붙이는 표지 한 장

      - id: "8.9"
        title: "고객 또는 외부공급자의 재산관리"
        basis: "별표1 8.9"
        purpose: "발주자 지급자재 등 외부 재산을 적기에 받아 적절히 관리한다."
        steps:
          - "지급 재산을 파악하고 수급계획을 세운다."
          - "인수 시 검사·시험하고, 부적합하면 발주자에게 알리고 처리한다."
          - "보관 중 손상·분실·부적절 판정 시 보고하고 처리한다."
          - "대체 사용이나 잉여 재산의 처리는 발주자와 협의한다."
        records: ["지급자재 수불 대장"]
        roles:
          - {task: "재산 파악·수급계획", marks: {공무: "○", 공사: "◎"}}
          - {task: "인수 검사·시험", marks: {품질: "○", 공사: "◎"}}
          - {task: "보관·수불 관리", marks: {공사: "○", 공무: "○"}}
          - {task: "손상·분실 보고", marks: {공사: "○", 공무: "○", 현장대리인: "●"}}
          - {task: "대체·잉여 재산 처리", marks: {공무: "○", 현장대리인: "●"}}
        flow:
          - stage: "재산 파악"
            content:
              - "• 공무 담당은 발주자 지급자재 등 고객 또는 외부공급자의 재산을 파악하고 수급계획을 세운다."
              - "(재산: 자재·부품·공구·장비, 고객 부동산, 지적 소유권, 개인정보 등)"
            basis: ["별표1 8.9"]
          - stage: "인수 검사"
            content:
              - "• 인수 때 수량·규격·외관을 확인하고 8.11에 따라 검사·시험한다."
              - "• 부적합하면 발주자에게 알리고 처리 방법을 협의한다."
            basis: ["별표1 8.9", "8.11"]
          - stage: "보관·수불"
            content:
              - "• 지급 재산은 구분하여 보관하고 수불 대장으로 관리한다."
            basis: ["양식:supplied_material_ledger", "8.10"]
          - stage: "손상·분실 보고"
            content:
              - "• 보관 중 손상·분실되거나 쓸 수 없는 것으로 판명되면 곧바로 발주자에게 보고하고 처리한다."
            basis: ["별표1 8.9"]
          - stage: "대체·잉여 처리"
            content:
              - "• 대체 사용이 필요하거나 남은 재산은 발주자와 협의하여 처리하고 기록한다."
            basis: ["별표1 8.9"]
        forms:
          - key: "supplied_material_ledger"
            title: "지급자재 수불 대장"
            header: ["공사명"]
            columns: ["번호", "일자", "품명", "규격", "단위", "입고", "출고", "재고", "사용 부위", "확인", "비고"]
            widths: [6, 9, 15, 14, 6, 8, 8, 8, 13, 7, 6]
            groups:                          # 2단 머리(묶음 판단: 이 저장소, 정본 모양 아님)
              - {title: "수량", span: 3, start: 5}
            approval: true
            rows: 0

      - id: "8.10"
        title: "보존관리"
        basis: "별표1 8.10"
        purpose: "시공부터 인계까지 기자재와 공사 목적물이 분실·손상·열화되지 않게 보존한다."
        steps:
          - "운반·투입 시 특별한 취급이 필요한 기자재의 취급 방법을 정한다."
          - "기자재 특성에 맞는 보관 장소·보관 방법과 반입·반출 방법을 정한다."
          - "인계 전까지 공사 목적물의 보호 방안을 정한다."
          - "화재와 보안 관리 사항을 정한다."
        records: ["자재 보관 점검 기록"]
        roles:
          - {task: "특별 취급 방법 결정", marks: {공사: "○", 품질: "◎", 안전: "◎"}}
          - {task: "보관 장소·방법 결정", marks: {공사: "○", 공무: "◎", 품질: "◎"}}
          - {task: "보관 상태 점검", marks: {품질: "○", 공사: "◎"}}
          - {task: "시공 부위 보호", marks: {공사: "○", 품질: "◎"}}
          - {task: "화재·보안 관리", marks: {안전: "○", 공무: "◎", 현장대리인: "●"}}
        flow:
          - stage: "취급 방법"
            content:
              - "• 운반·투입할 때 특별한 취급이 필요한 기자재(유리·창호·마감재·위험물 등)를 정하고 취급 방법을 알린다."
            basis: ["별표1 8.10"]
          - stage: "보관 장소·방법"
            content:
              - "• 기자재 특성에 맞는 보관 장소와 방법(받침·덮개·온도·습도·적재 높이), 반입·반출 방법을 정한다."
            basis: ["별표1 8.10"]
          - stage: "보관 점검"
            content:
              - "• 품질관리자는 정기적으로 보관 상태를 점검하여 점검표에 적고, 문제가 있으면 바로잡는다."
            basis: ["양식:storage_check"]
          - stage: "목적물 보호"
            content:
              - "• 인계 전까지 시공이 끝난 부위를 보양·보호하는 방안을 정하여 이행한다."
            basis: ["별표1 8.10"]
          - stage: "화재·보안"
            content:
              - "• 가연성 자재 보관, 화기 작업, 출입 통제 등 화재와 보안 관리 사항을 정하여 이행한다."
            basis: ["별표1 8.10"]
        forms:
          - key: "storage_check"
            title: "보관자재 점검표"
            header: ["공사명", "점검일", "점검자"]
            columns: ["번호", "자재명", "보관 장소", "보관 방법", "점검 항목", "점검 결과", "조치 내용", "확인"]
            widths: [6, 16, 14, 16, 16, 10, 14, 8]
            approval: true
            rows: 0
        tables:
          - key: "storage_methods"
            title: "품목별 보관 방법"
            columns: ["품목", "보관 장소", "보관 방법", "주의 사항"]
            widths: [15, 18, 37, 30]
            rows:
              - ["시멘트(포대)", "창고", "바닥에서 띄운 받침 위에 쌓고 입고 순서대로 쓴다.", "습기·빗물 차단, 굳은 것은 쓰지 않는다."]
              - ["철근", "야적장", "받침목 위에 강종·지름별로 나누어 두고 덮개를 씌운다.", "흙·기름 오염과 녹 방지, 식별표 부착"]
              - ["골재", "야적장", "종류·크기별로 칸을 나누어 쌓는다.", "섞임·흙 유입 방지, 배수"]
              - ["단열재", "창고·가림막 안", "평평한 받침 위에 쌓고 햇빛을 가린다.", "화기 엄금, 바람에 날림 방지"]
              - ["방수재·도료·접착제", "위험물 보관장소", "밀폐하여 서늘한 곳에 두고 유효기간 순으로 쓴다.", "화기 엄금, 환기, 유효기간 확인"]
              - ["유리·창호", "창고", "받침 위에 세워 두고 사이에 완충재를 넣는다.", "충격·뒤틀림 방지, 표면 보호필름 유지"]
              - ["석고보드·마감판", "창고", "평평한 받침 위에 수평으로 쌓는다.", "습기·모서리 파손 방지"]
              - ["타일·석재", "창고·야적장", "포장 상태로 받침 위에 두고 종류·로트별로 나눈다.", "깨짐 방지, 로트 섞임 방지"]
              - ["레미콘·아스콘", "보관하지 않음", "도착 즉시 타설·포설한다.", "운반 시간·온도 확인(8.11)"]
            indent: false

      - id: "8.11"
        title: "검사 및 시험, 모니터링"
        basis: "별표1 8.11"
        purpose: "투입 자재, 시공 공정, 공사 목적물의 특성을 검사·시험·모니터링하여 요구사항 충족을 검증한다."
        steps:
          - "공정 단계별 검사 및 시험 계획(ITP)을 세운다. 자재별 시험 항목·빈도·계획 횟수는 뒤쪽의 품질시험계획표에 따른다."
          - "시험 빈도는 {기준}의 별표2 품질시험기준을 따른다."
          - "각 단계의 합격 판정 기준, 사용 장비와 기법, 책임자를 정한다."
          - "검증 시기·장소·방법을 정하고, 필요한 경우 공사감독자 등의 입회 시기와 방법을 정한다."
          - "검사·시험 결과는 품질검사 실시대장(「건설기술 진흥법 시행규칙」 별지 제42호서식)에 기록하여 보고한다."
          - "외부 시험기관에 의뢰하는 시험은 의뢰 방법과 결과 검토 방법을 정한다."
        records: ["품질검사 실시대장(시행규칙 별지 제42호서식)", "품질검사 성과 총괄표(시행규칙 별지 제43호서식)", "시험성적서", "「건설기술 진흥법 시행령」 제91조·별표9 품질시험계획의 내용",
                  "「건설기술 진흥법 시행규칙」 제50조제4항·별표5 품질관리를 위한 시설 및 건설기술인 배치기준"]
        body_after:
          - "{8.11}"
        roles:
          - {task: "검사·시험 계획(ITP) 수립", marks: {품질: "○", 공사: "◎", 현장대리인: "●"}}
          - {task: "시험 시설·인력 확보", marks: {품질: "○", 공무: "◎", 현장대리인: "●"}}
          - {task: "검사·시험 실시", marks: {품질: "○", 공사: "◎"}}
          - {task: "입회 요청·외부 의뢰", marks: {품질: "○", 공사: "○", 공무: "◎"}}
          - {task: "결과 기록·보고", marks: {품질: "○", 현장대리인: "●"}}
        flow:
          - stage: "시험계획 수립"
            content:
              - "• 품질관리자는 적절한 공정 단계마다 검사 및 시험 계획(ITP)을 세운다."
              - "• 자재별 시험 종목·방법·빈도와 계획 횟수는 뒤쪽의 품질시험계획표로 정한다."
              - "- 시험 종목·방법·빈도는 업무지침 별표2 품질시험기준을 따른다."
            basis: ["별표1 8.11", "업무지침 제8조"]
          - stage: "기준·장비·책임"
            content:
              - "• 단계마다 검사·시험 항목, 합격판정기준, 빈도, 사용 장비와 기법, 책임자의 역할을 정한다."
              - "- 시험 장비는 7.2에 따라 관리한다."
            basis: ["별표1 8.11", "7.2"]
          - stage: "시설·인력 확인"
            content:
              - "• 공사 규모에 맞는 시험실·시험 장비와 품질관리 인력을 관련 법령의 기준에 따라 확보하고 배치계획을 세운다."
              - "- 품질관리자 경력증명서 등 개인정보가 담긴 증빙은 양식으로 만들지 않고, 사용자가 제출 때 따로 첨부한다."
            basis: ["7.1", "7.2"]
          - stage: "시기·장소·입회"
            content:
              - "• 검증 시기·장소·방법을 정하고, 필요하면 공사감독자 또는 건설사업관리기술인의 입회 시기와 방법을 정한다."
              - "- 현장 시험은 공사감독자가 입회하여 시료 채취 위치와 시험 방법을 확인하고, 그 과정을 사진 등으로 기록한다."
            basis: ["별표1 8.11", "업무지침 제38조"]
          - stage: "검사·시험 실시"
            content:
              - "• 계획에 따라 반입 자재, 시공 공정, 공사목적물을 검사·시험한다."
              - "• 외부에 의뢰하는 시험은 의뢰 방법을 정하고, 받은 성적서를 검토하여 결과를 판정한다."
            basis: ["별표1 8.11", "업무지침 제38조"]
          - stage: "기록·보고"
            content:
              - "• 결과는 품질검사 실시대장에 기록한다. 전자적 처리가 불가능한 특별한 사유가 없으면 전자 파일로 작성·관리한다."
              - "• 품질검사를 마치면 품질검사 성과 총괄표를 작성하여 기성부분검사·예비준공검사·준공검사를 신청할 때 발주자에게 제출한다."
            basis: ["시행규칙 제50조·제51조", "영 제93조", "양식:test_ledger", "양식:test_summary"]
          - stage: "불합격 처리"
            content:
              - "• 불합격이면 8.12에 따라 처리하고, 결과는 9.2 분석 및 평가에 쓴다."
            basis: ["8.12", "9.2"]
        forms:
          - key: "test_ledger"               # 법정 서식: 「건설기술 진흥법 시행규칙」 별지 제42호서식(2024. 7. 10. 개정) — 열은 서식 원문 순서
            title: "품질검사 실시대장"
            columns: ["일련번호", "연월일", "시험·검사 구분", "품질검사 대상 재료", "건설자재·부재를 공급받은 공장", "시험·검사 장소", "시험·검사 종목", "시험 기준", "시험 결과", "시험 결과 판정", "성명", "서명", "성명", "서명", "비고"]
            widths: [5, 7, 7, 8, 10, 7, 8, 7, 7, 6, 6, 6, 6, 6, 4]
            groups:                          # 서식 2단 머리: 성명·서명 두 칸씩 묶음
              - {title: "품질관리기술인", span: 2, start: 10}
              - {title: "건설사업관리기술인 확인", span: 2, start: 12}
            landscape: true                  # 15열 — 이 양식 쪽만 가로 A4
            approval: false                  # 서식에 결재란 없음
            rows: 0
          - key: "test_summary"              # 법정 서식: 「건설기술 진흥법 시행규칙」 별지 제43호서식 — 머리 줄·열은 서식 원문 순서
            title: "품질검사 성과 총괄표"
            header: ["공사명", "공사기간", "공정(%)"]
