# 레미콘 규격별 부위 추정 키워드 — 거푸집 해체용 공시체 조 구성을 정한다.
# 사용자 실무 설명(2026-09-26): 기둥·기초처럼 수평 강도가 필요 없는 수직부재만이면 수직1+예비1,
# 슬래브·보처럼 수평 강도까지 받으면 수직1+수평1+예비1 풀세트. 거푸집 해체 확인이 없는 곳(버림 등)은 추가 없음.
# 도급내역서의 품명·공종 머리(section)에 아래 단어가 있으면 그 부위로 본다. 추정 결과는 사용자에게 확인·수정받는다.
vertical: ["기초", "기둥", "벽", "옹벽", "코어", "파일캡", "매트", "지중보"]
horizontal: ["슬래브", "슬라브", "보", "지붕", "계단", "발코니", "램프", "데크", "바닥판"]
none: ["버림", "무근", "잡석", "채움", "보호", "포장", "경계석", "측구", "기초보강"]
spare_default: true      # 거푸집용 조가 있으면 예비 1조를 기본 포함(현장마다 다름 — 확인)
