# 출처: 「건설공사 품질관리 업무지침」 별표2 건설공사 품질시험기준(제8조제1항 관련)
#       3. 건축 > 바. 마감공사(지붕·목공사 포함) > 건조 시멘트 모르타르(KS L 5220)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
# KS 처리: 종별 괄호 안 KS 규격 제품은 별표2 끝 ※주석(PDF p.52)에 따라 시행령 제91조제1항 시험 제외 → ◎.
# 표 칸 확인(PDF p.44 쪽 이미지): 플로값·응결시간은 아래 '시멘트계 자기 수평 모르타르(KS F 4041)' 칸에 속한다.
# 자재 포함 시공 행(L7-E5): 사급 내역은 모르타르가 '…쌓기(…, 건조모르타르 포함)'처럼 ㎡·m 시공 행 괄호 안에만 나온다.
#   괄호 '(…포함)' 안의 이름은 시공 행으로 받아(accept_install_rows) KS ◎ 행을 내고, ㎡·m·㎥ 는 톤으로 환산하지 않는다
#   (unit_factors 곱 0 = 수량 환산 없음 → 규격 '자재 포함 시공 행' 한 행, 수량 '-', 비고 '시공 행 추정(수량 환산 없음)').
#   같은 분야·블록에 포·kg·톤 자재 행이 있으면 시공 행은 버린다. 빈도가 물량 비례가 아니라 횟수는 같다.
#   괄호 밖 이름('…모르타르 바르기' 등)은 그대로 제외어로 막는다 — 현장 배합 모르타르와 구분할 수 없다.
material: dry_cement_mortar
label: 건조시멘트모르타르
work: 미장공사
basis_version: "국토교통부고시 제2026-360호(2026-07-08 시행) 「건설공사 품질관리 업무지침」 별표2"
index_keys: [dry_cement_mortar]
match:
  names: [건조시멘트모르타르, 건조모르타르, 드라이모르타르, 드라이몰탈, 건조시멘트몰탈, 건조몰탈, 시멘트모르타르]
  units: [포, kg, ton]                   # 기성 포대(포·kg)·벌크(TON). ㎡·㎥ '시멘트모르타르' 행은 바름·현장비빔이라 뺀다
  exclude: [바름, 바르기, 비빔, 쌓기, 채움, 운반, 하차, 폴리머, 무수축, 자기수평, 단열, 에폭시, 방수]
accept_install_rows: true                # '(…건조모르타르 포함)' 시공 행(L7-E5)
install_units: [m2, m, m3]
unit_factors:                            # 합산 전 환산: kg=0.001톤(정의), 포=40kg 포대 가정(0.04톤) — 다른 포대면 확인 필요
  kg: [ton, 0.001]
  포: [ton, 0.04]
  m2: [ton, 0]                           # 시공 행 면적·길이·부피 — 모르타르 양으로 환산하지 않는다(곱 0 = 수량 환산 없음)
  m: [ton, 0]
  m3: [ton, 0]
ks_mark: true                            # 종별 괄호 (KS L 5220)
ks_count: none
order: 40
group_tests: true
group:
  frequency: "제조회사별, 제품규격별\n제조일부터 3개월이 되어 재질 변화가 있다고 인정되는 때"
  basis: "별표2 3. 건축 바. 마감공사 건조 시멘트 모르타르(KS L 5220) (PDF p.44); KS 제품은 별표2 ※주석(PDF p.52) — 시행령 제91조제1항 시험 제외"
tests:
  - test_type: 압축강도(7,28일)
    method: "KS L ISO 679"
    where: 외부
    frequency: {per_qty: null, unit: null, text: "제조회사별, 제품규격별", minimum: 1}
    basis: "별표2 3. 바. 건조 시멘트 모르타르(KS L 5220) 압축강도(7,28일) (PDF p.44)"
    conditions: &dm "제조회사별·제품규격별, 제조일부터 3개월 경과해 재질 변화가 인정되면 추가(병합 빈도 칸, 물량 빈도 없음). KS 인증품은 ※주석(PDF p.52)으로 면제 → ◎. 빈도가 물량 비례가 아니라 환산은 횟수에 영향이 없고, 포·kg·톤 행을 한 행으로 합산하려고 톤으로 맞춘다(kg=0.001톤 정의; 포=40kg 가정 — 25kg 등 다른 포대면 수량 표시만 달라짐, 확인 필요)."
  - test_type: 보수성
    method: "KS L 5219"
    where: 외부
    frequency: {per_qty: null, unit: null, text: "제조회사별, 제품규격별", minimum: 1}
    basis: "별표2 3. 바. 건조 시멘트 모르타르(KS L 5220) 보수성 (PDF p.44)"
    conditions: *dm
  - test_type: 공기량
    method: "KS L 3136"
    where: 외부
    frequency: {per_qty: null, unit: null, text: "제조회사별, 제품규격별", minimum: 1}
    basis: "별표2 3. 바. 건조 시멘트 모르타르(KS L 5220) 공기량 (PDF p.44)"
    conditions: *dm
  - test_type: 모래의 함량
    method: "KS F 2502"
    where: 외부
    frequency: {per_qty: null, unit: null, text: "제조회사별, 제품규격별", minimum: 1}
    basis: "별표2 3. 바. 건조 시멘트 모르타르(KS L 5220) 모래의 함량 (PDF p.44)"
    conditions: *dm
  - test_type: 모래의 최대크기
    method: "KS F 2502"
    where: 외부
    frequency: {per_qty: null, unit: null, text: "제조회사별, 제품규격별", minimum: 1}
    basis: "별표2 3. 바. 건조 시멘트 모르타르(KS L 5220) 모래의 최대크기 (PDF p.44)"
    conditions: "시험방법 칸은 모래의 함량과 병합(KS F 2502). 빈도·KS 처리는 다른 항목과 같음."
