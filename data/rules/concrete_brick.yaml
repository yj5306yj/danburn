# 출처: 「건설공사 품질관리 업무지침」 별표2 건설공사 품질시험기준(제8조제1항 관련)
#       3. 건축 > 가. 조적공사 > 콘크리트벽돌(KS F 4004)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
# KS 처리: 종별 괄호 안 KS 규격 제품은 별표2 끝 ※주석(PDF p.52)에 따라
#   「건설기술 진흥법 시행령」 제91조제1항 시험을 하지 않아도 된다 → ks_count: none(◎, 'KS자재').
# 시멘트벽돌은 KS F 4004(콘크리트 벽돌) 제품이라 이 종별로 본다(색인 동의어와 같음).
material: concrete_brick
label: 콘크리트벽돌
work: 조적공사
basis_version: "국토교통부고시 제2026-360호(2026-07-08 시행) 「건설공사 품질관리 업무지침」 별표2"
index_keys: [concrete_brick]
match:
  names: [콘크리트벽돌, 시멘트벽돌, 벽돌]
  units: [ea, 개, 매, 천매]              # 도급내역서 관행 EA·매·천매. ㎡ 단위(쌓기 노무·복합 단가 행)는 잡지 않는다
  exclude: [점토, 치장벽돌, 붉은, 적벽돌, 내화, 단열, 연소재, 유리, 쌓기, 줄눈, 운반, 하차]   # 다른 벽돌 종별·노무 행
unit_factors:                            # 합산 전 환산: 천매=1,000매(정의), 매·개=1개 → 빈도 단위(ea)와 맞춘다
  천매: [ea, 1000]
  매: [ea, 1]
  개: [ea, 1]
ks_mark: true                            # 종별 괄호 (KS F 4004)
ks_count: none
order: 50
group_tests: true
group:
  frequency: "제품 100,000매당"
  basis: "별표2 3. 건축 가. 조적공사 콘크리트벽돌(KS F 4004) (PDF p.32); KS 제품은 별표2 ※주석(PDF p.52) — 시행령 제91조제1항 시험 제외"
tests:
  - test_type: 겉모양
    method: "KS F 4004"
    where: 외부
    frequency: {per_qty: 100000, unit: ea, text: "제품 100,000매당", minimum: 1}
    basis: "별표2 3. 가. 콘크리트벽돌(KS F 4004) 겉모양 (PDF p.32)"
    conditions: &brick "제품 100,000매당(시험방법·빈도 칸은 다섯 시험 공통 병합 칸). KS 인증품은 ※주석(PDF p.52)으로 면제 → ◎. 내역 단위 천매·매·개는 unit_factors 로 개(ea)로 환산해 합산(천매=1,000매)."
  - test_type: 치수
    method: "KS F 4004"
    where: 외부
    frequency: {per_qty: 100000, unit: ea, text: "제품 100,000매당", minimum: 1}
    basis: "별표2 3. 가. 콘크리트벽돌(KS F 4004) 치수 (PDF p.32)"
    conditions: *brick
  - test_type: 기건 비중
    method: "KS F 4004"
    where: 외부
    frequency: {per_qty: 100000, unit: ea, text: "제품 100,000매당", minimum: 1}
    basis: "별표2 3. 가. 콘크리트벽돌(KS F 4004) 기건 비중 (PDF p.32)"
    conditions: *brick
  - test_type: 압축 강도
    method: "KS F 4004"
    where: 외부
    frequency: {per_qty: 100000, unit: ea, text: "제품 100,000매당", minimum: 1}
    basis: "별표2 3. 가. 콘크리트벽돌(KS F 4004) 압축 강도 (PDF p.32)"
    conditions: *brick
  - test_type: 흡수율
    method: "KS F 4004"
    where: 외부
    frequency: {per_qty: 100000, unit: ea, text: "제품 100,000매당", minimum: 1}
    basis: "별표2 3. 가. 콘크리트벽돌(KS F 4004) 흡수율 (PDF p.32)"
    conditions: *brick
