# 출처: 「건설공사 품질관리 업무지침」 별표2 건설공사 품질시험기준(제8조제1항 관련)
#       3. 건축 > 바. 마감공사(지붕·목공사 포함) > 석고보드(KS F 3504) (PDF p.41~42)
# 원문 조문을 옮기지 않고 번호·항목명·요약만 적는다.
# 원문은 석고보드를 GB-R(일반)·GB-S(방수)·GB-F(방화)·GB-L(라스)·GB-D(치장)으로 나눠 시험종목을 따로 적는다.
# 묶음 행은 규격 구분 없이 한 규칙이라 일반(GB-R) 종목을 기본으로 두고, 종류별 추가 종목은 optional + 조건으로 남겼다.
