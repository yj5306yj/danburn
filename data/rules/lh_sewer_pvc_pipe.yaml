# 출처: LHCS 10 40 00:2020 「시험」(2020-12-09 제정, 한국토지주택공사) 부록 「품질시험 및 검사기준」 Ⅰ. 공통 및 토목분야 1. 공통 마. 기타
#       국가건설기준센터(KCSC) 공개본. 공공데이터포털 「한국토지주택공사_전문시방서_20201209」 이용허락범위 제한 없음.
# 발주처(LH) 전용 규칙 — `--owner LH` 일 때만 켜진다. 별표2에는 하수용 PVC관(KS M 3600, 구조형 이중벽관·리브관) 종별이 없다.
# 원문 문장·표를 옮기지 않고 종별·시험종목·시험방법 번호·빈도 사실만 적는다.
# 매칭: 내역서의 하수 PVC 이중벽관은 자재 행('PVC이중벽관', 지급)이나 '부설 및 접합' 행(사급, 재료비 포함)으로 온다.
#   '부설'·'접합'은 빼지 않는다 — 부설 행이 자재를 품는 블록이 있다(L7-T2). 같은 블록에 지급 자재 행이 있으면
#   엔진의 지급 우선 중복 제거가 사급 부설 행을 뺀다(규격을 지름으로 묶어 'D-200'과 '고무링접합, D200'을 맞춘다).
# 단위: 빈도가 '300개마다(6M기준)' — 관 1개 = 6m 로 보고 m 를 개로 환산한다(unit_factors).
material: lh_sewer_pvc_pipe
label: 하수용 PVC관(이중벽관)
work: 배수공사
owner: LH
basis_version: LHCS 10 40 00:2020(2020-12-09) 부록 「품질시험 및 검사기준」
extra_keys: [pvc_double_wall_pipe]
match:
  names: [하수용폴리염화비닐관, 하수용PVC관, 폴리염화비닐이중벽관, PVC이중벽관, PVC리브관]
  units: [m, 본, 개, ea]
  exclude: [보호콘크리트, 천공, 준설, 절단, 하차, 운반, 인건, 노무, 할증, 철거]
unit_factors:
  m: [ea, 0.16666666666666666]      # 6m = 1개(원문 '6M기준')
  본: [ea, 1]
  개: [ea, 1]
ks_mark: false
ks_count: makers
order: 71
spec_group:
  pattern: "D\\s*-?\\s*(\\d{3,4})"
  label: "D{1}"
  other: 규격별
group_tests: true
group:
  frequency: 제조회사별, 제품규격별 300개마다(6m 기준)
  basis: LHCS 10 40 00:2020 부록 「품질시험 및 검사기준」 Ⅰ.1 공통 마. 기타 하수용 폴리염화비닐(PVC)관(KS M 3600)
tests:
- test_type: 원강성
  method: KS M 3600
  where: 외부
  frequency: &f {per_qty: 300, unit: ea, text: 제조회사별, 제품규격별 300개마다(6m 기준), minimum: 1}
  basis: LHCS 10 40 00:2020 부록 「품질시험 및 검사기준」 Ⅰ.1 공통 마. 기타 하수용 폴리염화비닐(PVC)관 원강성
  conditions: &c 제조회사별·제품규격별 300개(관 6m 기준)마다. 비고 — 소량(10개 미만) 사용 규격은 KS 제품이면 KS 인증업체가 공인기관에 의뢰한 시험성적서 확인으로 갈음할 수 있고, 그 밖의 시험항목은 KS 인증업체 공인기관 성적서 확인으로 갈음.
- {test_type: 원연성, method: KS M 3600, where: 외부, frequency: *f, basis: LHCS 10 40 00:2020 부록 「품질시험 및 검사기준」 Ⅰ.1 공통 마. 기타 하수용 폴리염화비닐(PVC)관 원연성, conditions: *c}
- {test_type: 관의 색, method: KS M 3600, where: 외부, frequency: *f, basis: LHCS 10 40 00:2020 부록 「품질시험 및 검사기준」 Ⅰ.1 공통 마. 기타 하수용 폴리염화비닐(PVC)관 관의 색, conditions: *c}
